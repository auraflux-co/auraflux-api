<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>body{background:#111;color:#0f0;font-family:monospace;font-size:11px;padding:15px;}
h3{color:#f39c12;margin:8px 0 4px;}pre{background:#1a1a1a;padding:8px;border-radius:4px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;}</style>
</head><body>
<h3>Gap Fill Test</h3>
<button onclick="run()" style="background:#c7af4f;color:#000;font-weight:900;padding:6px 14px;border:none;cursor:pointer">TEST</button>
<div id="out" style="margin-top:12px">Click TEST</div>
<script>
var KEY='rJPVYlHnpcjxuOLoR1phvBz7e27UMMSq';
var BASE='https://financialmodelingprep.com/stable/quote?apikey='+KEY+'&symbol=';

function run(){
  var out=''; var done=0; var total=5;
  function fin(l,s,t){ out+='<h3>'+l+' ('+s+')</h3><pre>'+t.slice(0,400)+'</pre>'; done++; if(done>=total) document.getElementById('out').innerHTML=out; }

  // Test sector ETFs individually via FMP
  var xhr1=new XMLHttpRequest();
  xhr1.open('GET',BASE+'XLK',true);
  xhr1.timeout=8000;
  xhr1.onload=function(){ fin('XLK sector ETF',xhr1.status,xhr1.responseText.slice(0,200)); };
  xhr1.onerror=xhr1.ontimeout=function(){ fin('XLK','ERR','failed'); };
  xhr1.send();

  // CoinGecko crypto with 24h change
  setTimeout(function(){
    var xhr2=new XMLHttpRequest();
    xhr2.open('GET','https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd&include_24hr_change=true',true);
    xhr2.timeout=8000;
    xhr2.onload=function(){
      try{
        var d=JSON.parse(xhr2.responseText);
        fin('CoinGecko Crypto',xhr2.status,
          'BTC: $'+d.bitcoin.usd+' ('+d.bitcoin.usd_24h_change.toFixed(2)+'%)\n'+
          'ETH: $'+d.ethereum.usd+' ('+d.ethereum.usd_24h_change.toFixed(2)+'%)\n'+
          'SOL: $'+d.solana.usd+' ('+d.solana.usd_24h_change.toFixed(2)+'%)');
      }catch(e){ fin('CoinGecko',xhr2.status,xhr2.responseText.slice(0,200)); }
    };
    xhr2.onerror=xhr2.ontimeout=function(){ fin('CoinGecko','ERR','failed'); };
    xhr2.send();
  },1000);

  // Frankfurter forex
  setTimeout(function(){
    var xhr3=new XMLHttpRequest();
    xhr3.open('GET','https://api.frankfurter.app/latest?from=USD&to=EUR,GBP,JPY,CAD',true);
    xhr3.timeout=8000;
    xhr3.onload=function(){
      try{
        var d=JSON.parse(xhr3.responseText);
        fin('Frankfurter Forex',xhr3.status,JSON.stringify(d.rates));
      }catch(e){ fin('Frankfurter',xhr3.status,xhr3.responseText.slice(0,200)); }
    };
    xhr3.onerror=xhr3.ontimeout=function(){ fin('Frankfurter','ERR','failed'); };
    xhr3.send();
  },2000);

  // Gold via commodity price free API
  setTimeout(function(){
    var xhr4=new XMLHttpRequest();
    xhr4.open('GET','https://forex-data-feed.swissquote.com/public-quotes/bboquotes/instrument/XAU/USD',true);
    xhr4.timeout=8000;
    xhr4.onload=function(){ fin('Swissquote Gold',xhr4.status,xhr4.responseText.slice(0,300)); };
    xhr4.onerror=xhr4.ontimeout=function(){ fin('Swissquote Gold','ERR','failed'); };
    xhr4.send();
  },3000);

  // Binance for crypto too (backup)
  setTimeout(function(){
    var xhr5=new XMLHttpRequest();
    xhr5.open('GET','https://api.binance.com/api/v3/ticker/24hr?symbols=[%22BTCUSDT%22,%22ETHUSDT%22,%22SOLUSDT%22]',true);
    xhr5.timeout=8000;
    xhr5.onload=function(){
      try{
        var d=JSON.parse(xhr5.responseText);
        fin('Binance Crypto',xhr5.status,d.map(function(t){ return t.symbol+': $'+parseFloat(t.lastPrice).toFixed(2)+' ('+parseFloat(t.priceChangePercent).toFixed(2)+'%)'; }).join('\n'));
      }catch(e){ fin('Binance',xhr5.status,xhr5.responseText.slice(0,200)); }
    };
    xhr5.onerror=xhr5.ontimeout=function(){ fin('Binance','ERR','failed'); };
    xhr5.send();
  },4000);
}
</script></body></html>

<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>body{background:#111;color:#0f0;font-family:monospace;font-size:11px;padding:15px;}
h3{color:#f39c12;margin:8px 0 4px;}pre{background:#1a1a1a;padding:8px;border-radius:4px;white-space:pre-wrap;word-break:break-all;}</style>
</head><body>
<h3>LocalStorage Check</h3>
<div id="out"></div>
<script>
var keys=['mkt_indices','mkt_stocks','mkt_crypto','mkt_forex','mkt_news','mkt_updated'];
var out='';
keys.forEach(function(k){
  var v=localStorage.getItem(k);
  if(v){
    try{
      var d=JSON.parse(v);
      out+='<h3>'+k+'</h3><pre>'+JSON.stringify(d).slice(0,300)+'</pre>';
    }catch(e){ out+='<h3>'+k+'</h3><pre>'+v.slice(0,100)+'</pre>'; }
  } else {
    out+='<h3>'+k+'</h3><pre>EMPTY</pre>';
  }
});
document.getElementById('out').innerHTML=out;
</script></body></html>

            - heading "Introduction" [level=6] [ref=e63]:
              - strong [ref=e64]: Introduction
            - paragraph [ref=e66]: Thank you for registering for the Lumi Education Summer Programs. At Lumi Education, we understand that plans can change.
            - heading "Cancellation & Refund Schedule" [level=6] [ref=e68]:
              - strong [ref=e69]: Cancellation & Refund Schedule
            - paragraph [ref=e71]: "By May 31, 2026: Families who cancel their registration on or before May 31, 2026 will receive a full refund of all camp fees paid."
            - paragraph [ref=e73]: "June 1–15, 2026: Families who cancel their registration between June 1, 2026 and June 15, 2026 will receive a 50% refund of camp fees paid."
            - paragraph [ref=e75]: "After June 15, 2026: Cancellations made after June 15, 2026 are non-refundable."
            - heading "Cancellation Requests" [level=6] [ref=e77]:
              - strong [ref=e78]: Cancellation Requests
            - paragraph [ref=e80]: All cancellation requests must be submitted in writing via email to Lumi Education at contact.us@learningwithlumi.com.

  - generic [ref=e61]:
    - heading "What Makes AuraFlux Different" [level=2] [ref=e62]
    - paragraph [ref=e63]: Not a tool. An automated production environment.
    - generic [ref=e64]:
      - generic [ref=e65]:
        - generic [ref=e66]: ⚙
        - heading "A full pipeline, not a feature" [level=3] [ref=e67]
        - paragraph [ref=e68]: Other tools do one thing — trim clips, generate captions, schedule posts. AuraFlux does all of it, in sequence, automatically. One job submission runs the entire production process end to end.
      - generic [ref=e69]:
        - generic [ref=e70]: 🎯
        - heading "Platform-aware by default" [level=3] [ref=e71]
        - paragraph [ref=e72]: Every job knows its destination. Vertical crop for TikTok. Chapter markers for YouTube. Captions calibrated for each platform's viewer behavior. No manual reformatting.
      - generic [ref=e73]:
        - generic [ref=e74]: 🔍
        - heading "AI quality checks at every stage" [level=3] [ref=e75]
        - paragraph [ref=e76]: Each portal runs QA before passing to the next. Frozen frames, silence gaps, assembly defects, and creative quality are all checked before your content goes live.
      - generic [ref=e77]:
        - generic [ref=e78]: 📡
        - heading "Direct publish, no manual export" [level=3] [ref=e79]
        - paragraph [ref=e80]: Connect your YouTube and TikTok accounts once. AuraFlux publishes directly via OAuth — with your title, description, tags, thumbnail, and chapter markers already applied.
      - generic [ref=e81]:
        - generic [ref=e82]: 💬
        - heading "Collab guides you through it" [level=3] [ref=e83]
        - paragraph [ref=e84]: Every plan includes Collab, the in-app AI assistant. Ask it anything — what features are available, how credits work, what to do next. It knows the full platform and responds in plain English.
      - generic [ref=e85]:
        - generic [ref=e86]: 🔌
        - heading "API-first for technical operators" [level=3] [ref=e87]
        - paragraph [ref=e88]: The entire platform is accessible via REST API. Integrate AuraFlux directly into your own tooling, dashboard, or workflow automation. Full developer documentation included.

  - generic [ref=e41]:
    - heading "Why We Built This" [level=2] [ref=e42]
    - paragraph [ref=e43]: Most streamers and creators produce hours of content every week — and then lose most of it. Editing takes longer than the stream itself. Hiring an editor costs more than the content earns. So the clips sit on a hard drive, and the channel doesn't grow.
    - paragraph [ref=e44]: We built AuraFlux to close that gap. Not by making editing faster, but by eliminating the need for it entirely. Our platform takes your raw stream or uploaded video, runs it through an AI-powered production pipeline, and delivers polished, platform-ready content — automatically.
    - blockquote [ref=e45]: "\"Every creator should be able to produce like a media company. That's not a staffing problem — it's a software problem.\""
    - paragraph [ref=e46]: AuraFlux is the software answer to that problem. The same pipeline that a five-person content team would run — clip selection, scripting, voiceover, assembly, quality checks, brand application, and direct publish — happens automatically, for every piece of content you produce.

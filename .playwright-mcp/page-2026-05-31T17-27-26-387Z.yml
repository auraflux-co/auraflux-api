    - generic [ref=e33]: Our Story
    - heading "Content Production, Without the Team" [level=1] [ref=e34]:
      - text: Content Production,
      - emphasis [ref=e35]: Without the Team
    - paragraph [ref=e36]: AuraFlux is the production infrastructure for creators who can't afford to stop streaming to edit. We automate everything from clip selection to final publish.

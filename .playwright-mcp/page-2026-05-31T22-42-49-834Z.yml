          - generic [ref=e47]:
            - term [ref=e48]: What's the difference between Operate and Guided?
            - definition [ref=e49]: Both plans include the full AuraFlux platform. Operate is self-serve — you run everything yourself via API or the dashboard. Guided includes Collab-powered monitoring and guidance from the AuraFlux team.
          - generic [ref=e50]:
            - term [ref=e51]: How do credits work?
            - definition [ref=e52]: Each plan includes a monthly credit allowance. One credit = one short-form job. Long-form and multi-clip jobs use 2 credits. Unused credits roll over and additional packs are available any time.
          - generic [ref=e53]:

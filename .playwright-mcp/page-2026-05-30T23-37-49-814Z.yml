      - main:
        - generic [ref=e57]:
          - group:
            - heading "Attendance Policy" [level=1] [ref=e61]
            - paragraph [ref=e63]:
              - strong [ref=e64]: IntroductionTo help ensure a safe, organized, and positive experience for all campers, Lumi Education has established the following attendance policy for all Summer Programs participants.
            - paragraph [ref=e66]:
              - strong [ref=e67]: 1. Daily AttendanceCampers are expected to attend all registered camp sessions and arrive on time each day. Regular participation supports students in engaging fully with camp activities and routines.
            - paragraph [ref=e69]:
              - strong [ref=e70]: "2. Arrival & Pick-UpParents/guardians must handle timely drop-off and pick-up per camp schedule.Late Arrival: Parents should notify staff in advance if a camper will be late.Late Pick-Up: Repeated late pick-ups may result in additional fees or possible dismissal from the camp program at the discretion of Lumi Education."
            - paragraph [ref=e72]:
              - strong [ref=e73]: 3. AbsencesParents should notify the organization promptly about absences through email, phone, or designated methods. Covered reasons include illness, emergencies, vacation, or personal circumstances.
            - paragraph [ref=e75]:
              - strong [ref=e76]: 4. No Refunds for Missed DaysLumi Education Summer Programs does not provide refunds, credits, prorated tuition, or make-up days for absences, late arrivals, early departures, or missed days.
            - paragraph [ref=e78]:
              - strong [ref=e79]: 5. Illness & Health-Related AbsencesIll campers should stay home per the Medical & Allergy Policy. Lumi Education reserves the right to request that a camper be picked up if they appear too ill to safely participate in camp activities.
            - paragraph [ref=e81]:
              - strong [ref=e82]: 6. Emergency Contact AvailabilityParents/guardians or authorized emergency contacts must remain reachable during camp hours for health, safety, or behavioral issues.
            - paragraph [ref=e84]:
              - strong [ref=e85]: 7. Withdrawal from CampWithdrawals are governed by the Summer Programs Cancellation & Refund Policy.
            - paragraph [ref=e87]: Phone (571) 207-8373 · Email contact.us@learningwithlumi.com

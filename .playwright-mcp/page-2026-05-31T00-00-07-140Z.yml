      - main:
        - generic [ref=e57]:
          - group:
            - heading "Attendance Policy" [level=1] [ref=e61]
            - generic [ref=e62]:
              - paragraph [ref=e63]
              - paragraph [ref=e64]: To help ensure a safe, organized, and positive experience for all campers, Lumi Education has established the following attendance policy for all Summer Programs participants.
            - generic [ref=e65]:
              - paragraph [ref=e66]: 1. Daily Attendance
              - paragraph [ref=e67]: Campers are expected to attend all registered camp sessions and arrive on time each day. Regular participation supports students in engaging fully with camp activities and routines.
            - generic [ref=e68]:
              - paragraph [ref=e69]: 2. Arrival & Pick-Up
              - paragraph [ref=e70]: "Parents/guardians must handle timely drop-off and pick-up per camp schedule.Late Arrival: Parents should notify staff in advance if a camper will be late."
              - paragraph [ref=e71]: "Late Pick-Up: Repeated late pick-ups may result in additional fees or possible dismissal from the camp program at the discretion of Lumi Education."
            - generic [ref=e72]:
              - paragraph [ref=e73]: 3. Absences
              - paragraph [ref=e74]: Parents should notify the organization promptly about absences through email, phone, or designated methods. Covered reasons include illness, emergencies, vacation, or personal circumstances.
            - generic [ref=e75]:
              - paragraph [ref=e76]: 4. No Refunds for Missed Days
              - paragraph [ref=e77]: Lumi Education Summer Programs does not provide refunds, credits, prorated tuition, or make-up days for absences, late arrivals, early departures, or missed days.
            - generic [ref=e78]:
              - paragraph [ref=e79]: 5. Illness & Health-Related Absences
              - paragraph [ref=e80]: Ill campers should stay home per the Medical & Allergy Policy. Lumi Education reserves the right to request that a camper be picked up if they appear too ill to safely participate in camp activities.
            - generic [ref=e81]:
              - paragraph [ref=e82]: 6. Emergency Contact Availability
              - paragraph [ref=e83]: Parents/guardians or authorized emergency contacts must remain reachable during camp hours for health, safety, or behavioral issues.
            - generic [ref=e84]:
              - paragraph [ref=e85]: 7. Withdrawal from Camp
              - paragraph [ref=e86]: Withdrawals are governed by the Summer Programs Cancellation & Refund Policy.
            - paragraph [ref=e88]: Phone (571) 207-8373 · Email contact.us@learningwithlumi.com

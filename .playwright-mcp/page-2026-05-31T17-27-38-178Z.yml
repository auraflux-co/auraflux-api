        - generic [ref=e62]:
          - generic [ref=e63]:
            - term [ref=e64]: What's the difference between Operate and Guided?
            - definition [ref=e65]: Both plans include the full AuraFlux platform. Operate is self-serve — you run everything yourself via API or the dashboard. Guided includes Collab-powered monitoring and guidance from the AuraFlux team.
          - generic [ref=e66]:
            - term [ref=e67]: How do credits work?
            - definition [ref=e68]: Each plan includes a monthly credit allowance. One credit = one short-form job. Long-form and multi-clip jobs use 2 credits. Unused credits roll over and additional packs are available any time.
          - generic [ref=e69]:
            - term [ref=e70]: Can I connect multiple social accounts?
            - definition [ref=e71]: Yes — you can connect YouTube, TikTok, Instagram, Twitch, and Kick. Each job can be targeted to one or more platforms simultaneously.
          - generic [ref=e72]:
            - term [ref=e73]: Do I need technical knowledge to use AuraFlux?
            - definition [ref=e74]: No. The dashboard guides you through every step. If you prefer direct API access, full developer documentation is available at app.auraflux.co/developer.

      - main:
        - generic [ref=e57]:
          - group:
            - heading "Medical & Allergy Policy" [level=1] [ref=e61]
            - heading "1. Health Information Requirement" [level=4] [ref=e63]
            - paragraph [ref=e65]: Parents must disclose allergies, medical conditions, current medications, emergency contacts, and physician information during registration. Updates to medical details must be reported before camp starts.
            - heading "2. Allergy Awareness" [level=4] [ref=e67]
            - paragraph [ref=e69]: Lumi Education strives to maintain an allergy-aware environment; however, we cannot guarantee an allergen-free facility. Parents must clearly disclose allergies and provide management instructions plus emergency medications. Camp staff will attempt allergen reduction and supervise meal times but are not medical professionals.
            - heading "3. Medications & Medical Care" [level=4] [ref=e71]
            - paragraph [ref=e73]: All medications require written instructions in original labeled containers. Lumi Education Summer Programs does not have licensed nurses, medical professionals, or on-site medical staff present. Staff may contact 911 during emergencies. Parents accept responsibility for all medical costs.
            - heading "4. Illness & When to Keep Children Home" [level=4] [ref=e75]
            - paragraph [ref=e77]: Children exhibiting fever, vomiting, diarrhea, contagious illness, cough, rash, or severe fatigue should stay home. Return requires 24 hours symptom-free without fever-reducing medication.
            - heading "5. Emergency Medical Care" [level=4] [ref=e79]
            - paragraph [ref=e81]: Staff attempt immediate parent contact; 911 may be called if necessary. Parents authorize emergency care access and accept financial responsibility.
            - heading "6. Food & Snacks" [level=4] [ref=e83]
            - paragraph [ref=e85]: Parents should disclose allergies and send labeled meals, avoiding severe allergen risks to other campers when requested. Campers must bring nut-free snacks daily.
            - heading "7. Acknowledgment of Risk" [level=4] [ref=e87]
            - paragraph [ref=e89]: Parents acknowledge inherent risks from allergen exposure, illness, and accidental injuries during group activities.
            - paragraph [ref=e91]: Phone (571) 207-8373 · Email contact.us@learningwithlumi.com

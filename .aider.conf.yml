# Use Gemini 2.5 Pro — 1M token context, no TPM rate limit issues
# Anthropic API was hitting 30k TPM org limit (free tier) with large server.js
# API key is passed via GEMINI_API_KEY env var (set in shell or .env)
model: gemini/gemini-2.5-pro
show-model-warnings: false

# Disable repo map to avoid context overhead (server.js is ~150k tokens)
map-tokens: 0


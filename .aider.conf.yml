read:
  - CLAUDE.md
  - STATUS.md
  - COMMIT_CHECKLIST.md
  - QA_GATES.md
  - docs/ops/OVERNIGHT_TASKS.md
  - MORNING_BRIEFING.md

# Use Gemini 2.5 Pro — 1M token context, no TPM rate limit issues
model: gemini/gemini-2.5-pro
show-model-warnings: false

# Disable repo map to avoid context overhead (server.js is ~150k tokens)
map-tokens: 0

# COORDINATION RULES FOR OVERNIGHT RUNS
# =====================================
# DO NOT TOUCH unless task explicitly requires it:
# - server.js (large file — only add to chat if task needs it)
# - cwn_production.html (dashboard — only touch if task requires it)
#
# SAFE TO WORK ON any night:
# - New files in test/, scripts/, docs/, lib/ (new modules only)
# - Documentation updates
# - lib/ai/ modules (runpod.js, workflow JSONs)
#
# IF TASK CONFLICTS: Skip to next safe task, document in MORNING_BRIEFING.md

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, initial-scale=1.0, maximum-scale=1.0">
<title>ClipzWorld Live Ticker — Auto</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: 'Arial Black', Arial, sans-serif;
    overflow: hidden;
    width: 1920px;
    height: 64px;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .ticker-wrap {
    width: 1920px;
    height: 64px;
    background: #111827;
    border-top: 3px solid #c7af4f;
    display: flex;
    align-items: stretch;
    overflow: hidden;
  }

  .brand-block {
    background: #c7af4f;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    flex-shrink: 0;
    flex-direction: column;
    gap: 2px;
    min-width: 110px;
  }
  .brand-title { font-size: 11px; font-weight: 900; color: #111827; letter-spacing: 2px; }
  .brand-live { display: flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 700; color: #111827; letter-spacing: 1px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #c0392b; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .scroll-outer { flex: 1; overflow: hidden; position: relative; }
  .scroll-track {
    display: flex;
    align-items: center;
    white-space: nowrap;
    height: 64px;
    animation: scroll-left var(--scroll-dur, 80s) linear infinite;
    will-change: transform;
    -webkit-font-smoothing: antialiased;
  }
  @keyframes scroll-left {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .league-div {
    display: inline-flex;
    align-items: center;
    height: 64px;
    padding: 0 12px;
    border-right: 2px solid rgba(199,175,79,0.25);
    flex-shrink: 0;
  }
  .league-lbl { font-size: 9px; font-weight: 900; color: rgba(199,175,79,0.55); letter-spacing: 2px; }

  .game-chip {
    display: inline-flex;
    align-items: center;
    height: 64px;
    border-right: 1px solid rgba(199,175,79,0.1);
    padding: 0 12px;
    flex-shrink: 0;
    gap: 6px;
    transition: background .15s;
  }
  .game-chip:hover { background: rgba(199,175,79,0.05); }

  .team-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    min-width: 52px;
  }
  .team-col.away { align-items: flex-end; }
  .team-col.home { align-items: flex-start; }

  .t-abbr { font-size: 13px; font-weight: 900; color: #fff; letter-spacing: .5px; line-height: 1; }
  .t-abbr.winner { color: #c7af4f; }
  .t-record { font-size: 8px; color: rgba(255,255,255,0.3); font-family: Arial, sans-serif; line-height: 1; }

  .logo-wrap {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 3px;
    background: #fff;
    image-rendering: -webkit-optimize-contrast;
    image-rendering: crisp-edges;
  }
  .logo-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 900;
    color: #fff;
  }

  .score-mid {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 70px;
    gap: 3px;
  }
  .score-row { display: flex; align-items: center; gap: 5px; }
  .sc { font-size: 24px; font-weight: 900; color: #fff; line-height: 1; min-width: 26px; text-align: center; }
  .sc.win { color: #c7af4f; }
  .sc-sep { font-size: 14px; color: rgba(199,175,79,0.4); }
  .game-state { font-size: 9px; font-weight: 700; font-family: Arial, sans-serif; letter-spacing: .3px; text-align: center; }
  .st-live { color: #e74c3c; }
  .st-final { color: rgba(255,255,255,0.3); }
  .st-pre { color: #27ae60; }
  .st-half { color: #f39c12; }

  /* Status bar */


  .no-games {
    display: inline-flex;
    align-items: center;
    height: 64px;
    padding: 0 24px;
    font-size: 13px;
    color: rgba(199,175,79,0.5);
    font-family: Arial, sans-serif;
  }
</style>
</head>
<body>



<div class="ticker-wrap">
  <div class="brand-block">
    <div class="brand-title">CLIPZWORLD</div>
    <div class="brand-live"><div class="live-dot"></div>LIVE</div>
  </div>
  <div class="scroll-outer">
    <div class="scroll-track" id="ticker-track">
      <div class="no-games">Loading scores...</div>
    </div>
  </div>
</div>

<script>
const LEAGUES = [
  { key:'nba',    label:'NBA',          url:'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard' },
  { key:'ncaam',  label:'NCAA MEN',     url:'https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard' },
  { key:'ncaaw',  label:'NCAA WOMEN',   url:'https://site.api.espn.com/apis/site/v2/sports/basketball/womens-college-basketball/scoreboard' },
  { key:'wnba',   label:'WNBA',         url:'https://site.api.espn.com/apis/site/v2/sports/basketball/wnba/scoreboard' },
  { key:'nfl',    label:'NFL',          url:'https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard' },
  { key:'ncaaf',  label:'NCAA FB',      url:'https://site.api.espn.com/apis/site/v2/sports/football/college-football/scoreboard' },
  { key:'mlb',    label:'MLB',          url:'https://site.api.espn.com/apis/site/v2/sports/baseball/mlb/scoreboard' },
  { key:'nhl',    label:'NHL',          url:'https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard' },
  { key:'mls',    label:'MLS',          url:'https://site.api.espn.com/apis/site/v2/sports/soccer/usa.1/scoreboard' },
  { key:'epl',    label:'EPL',          url:'https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard' },
  { key:'ucl',    label:'UCL',          url:'https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard' },
  { key:'laliga', label:'LA LIGA',      url:'https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard' },
  { key:'nascar', label:'NASCAR',       url:'https://site.api.espn.com/apis/site/v2/sports/racing/nascar/scoreboard' },
  { key:'golf',   label:'PGA',          url:'https://site.api.espn.com/apis/site/v2/sports/golf/pga/scoreboard' },
  { key:'mma',    label:'UFC',          url:'https://site.api.espn.com/apis/site/v2/sports/mma/ufc/scoreboard' },
  { key:'tennis', label:'TENNIS',       url:'https://site.api.espn.com/apis/site/v2/sports/tennis/scoreboard' },
];

let allGames = {};
let fetchErrors = 0;

function periodLabel(leagueKey, period, clock){
  if(leagueKey==='nba'||leagueKey==='wnba') return `Q${period} ${clock}`;
  if(leagueKey==='nfl'||leagueKey==='ncaaf') return `Q${period} ${clock}`;
  if(leagueKey==='nhl') return `P${period} ${clock}`;
  if(leagueKey==='mlb') return `INN ${period}`;
  if(['mls','epl','ucl','laliga'].includes(leagueKey)) return `${clock}'`;
  return period===1 ? `1H ${clock}` : `2H ${clock}`;
}

function endPeriodLabel(leagueKey, period){
  if(leagueKey==='nba'||leagueKey==='wnba'||leagueKey==='nfl'||leagueKey==='ncaaf') return `END Q${period}`;
  if(leagueKey==='nhl') return `END P${period}`;
  return period===1 ? 'END 1H' : 'END 2H';
}

function parseGame(ev, leagueKey){
  try {
    const comp = ev.competitions[0];
    const competitors = comp.competitors;
    const home = competitors.find(c=>c.homeAway==='home') || competitors[1];
    const away = competitors.find(c=>c.homeAway==='away') || competitors[0];
    if(!home||!away) return null;
    const status = ev.status;
    const stType = status.type.name;
    const period = status.period || 0;
    const clock  = status.displayClock || '';
    let stateLabel='', stateClass='st-pre';
    if(['STATUS_FINAL','STATUS_FULL_TIME','STATUS_FINAL_AET','STATUS_FINAL_PEN'].includes(stType)){
      stateLabel='FINAL'; stateClass='st-final';
    } else if(stType==='STATUS_HALFTIME'){
      stateLabel='HALF'; stateClass='st-half';
    } else if(['STATUS_IN_PROGRESS','STATUS_IN_PROGRESS_2'].includes(stType)){
      stateLabel=periodLabel(leagueKey,period,clock); stateClass='st-live';
    } else if(stType==='STATUS_END_PERIOD'){
      stateLabel=endPeriodLabel(leagueKey,period); stateClass='st-half';
    } else if(['STATUS_DELAY','STATUS_RAIN_DELAY'].includes(stType)){
      stateLabel='DELAY'; stateClass='st-half';
    } else if(['STATUS_OVERTIME','STATUS_IN_OVERTIME'].includes(stType)){
      stateLabel=`OT ${clock}`; stateClass='st-live';
    } else if(stType==='STATUS_END_OF_EXTRAPERIOD'){
      stateLabel='END OT'; stateClass='st-half';
    } else if(stType==='STATUS_POSTPONED'){
      stateLabel='PPD'; stateClass='st-final';
    } else if(stType==='STATUS_CANCELED'){
      stateLabel='CNCL'; stateClass='st-final';
    } else {
      const d=new Date(ev.date);
      stateLabel=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
      stateClass='st-pre';
    }
    const awayScore = parseInt(away.score)||0;
    const homeScore = parseInt(home.score)||0;
    const isFinal = ['STATUS_FINAL','STATUS_FULL_TIME','STATUS_FINAL_AET','STATUS_FINAL_PEN'].includes(stType);
    return {
      id: ev.id, league: leagueKey,
      awayAbbr: away.team.abbreviation || away.team.shortDisplayName,
      awayName: away.team.shortDisplayName||away.team.displayName,
      awayLogo: away.team.logo||'',
      awayColor: '#'+(away.team.color||'333333'),
      awayScore, awayRecord: away.records?.[0]?.summary||'',
      homeAbbr: home.team.abbreviation || home.team.shortDisplayName,
      homeName: home.team.shortDisplayName||home.team.displayName,
      homeLogo: home.team.logo||'',
      homeColor: '#'+(home.team.color||'333333'),
      homeScore, homeRecord: home.records?.[0]?.summary||'',
      stateLabel, stateClass, isFinal,
    };
  } catch(e){ return null; }
}


async function fetchLeague(lg){
  try {
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 8000);
    const res = await fetch(lg.url, {cache:'no-store', signal:controller.signal});
    clearTimeout(timeout);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const events = data.events||[];
    const parsed = [];
    for(const ev of events){
      try { const g=parseGame(ev,lg.key); if(g) parsed.push(g); } catch(e){}
    }
    allGames[lg.key] = parsed;
    return true;
  } catch(e){
    if(!allGames[lg.key]) allGames[lg.key]=[];
    console.warn('Failed', lg.key, e.message);
    return false;
  }
}

function buildTicker(){
  const track = document.getElementById('ticker-track');
  let content = '';
  let totalGames = 0;
  LEAGUES.forEach(lg=>{
    try {
      const games = (allGames[lg.key]||[]).filter(g=>g&&g.awayAbbr&&g.homeAbbr);
      if(!games.length) return;
      content += `<div class="league-div"><span class="league-lbl">${lg.label}</span></div>`;
      games.forEach(g=>{ try{ content+=gameChip(g); totalGames++; }catch(e){} });
    } catch(e){}
  });
  if(!totalGames){
    track.innerHTML='<div class="no-games">Loading scores...</div>';
    return;
  }
  track.innerHTML = content + content;
  const dur = Math.max(50, totalGames * 10);
  track.style.animation='none';
  void track.offsetHeight;
  track.style.animation=`scroll-left ${dur}s linear infinite`;
}

async function fetchAll(){
  await Promise.allSettled(LEAGUES.map(fetchLeague));
  buildTicker();
}

// Show loading state immediately so ticker isn't blank
document.getElementById('ticker-track').innerHTML =
  '<div class="no-games" style="color:rgba(199,175,79,0.6);font-size:11px;padding:0 24px">Loading scores...</div>';

// Stagger league fetches to avoid hammering all 16 at once
async function fetchAllStaggered(){
  const track = document.getElementById('ticker-track');
  // Fetch basketball first (most relevant, fastest)
  const priority = LEAGUES.filter(l=>['nba','ncaam','ncaaw','wnba'].includes(l.key));
  const rest = LEAGUES.filter(l=>!['nba','ncaam','ncaaw','wnba'].includes(l.key));

  await Promise.allSettled(priority.map(fetchLeague));
  buildTicker();

  // Then load remaining sports in background
  await Promise.allSettled(rest.map(fetchLeague));
  buildTicker();
}

fetchAllStaggered();
setInterval(fetchAll, 30000);
</script>
</body>
</html>

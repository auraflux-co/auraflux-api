<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>body{background:#111;color:#0f0;font-family:monospace;font-size:11px;padding:15px;}
h3{color:#f39c12;margin:8px 0 4px;}pre{background:#1a1a1a;padding:8px;border-radius:4px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;}</style>
</head><body>
<h3>Stock API Round 3</h3>
<div id="out">Testing...</div>
<script>
var out=''; var done=0; var total=5;
function fin(l,s,t){ out+='<h3>'+l+' ('+s+')</h3><pre>'+t.slice(0,400)+'</pre>'; done++; if(done>=total) document.getElementById('out').innerHTML=out; }

// 1. Finviz - no auth needed
var xhr1=new XMLHttpRequest();
xhr1.open('GET','https://finviz.com/quote.ashx?t=SPY&ty=c&ta=1&p=d',true);
xhr1.timeout=8000;
xhr1.onload=function(){ fin('Finviz',xhr1.status,xhr1.responseText.slice(0,200)); };
xhr1.onerror=xhr1.ontimeout=function(){ fin('Finviz','ERR','failed'); };
xhr1.send();

// 2. MarketStack free tier (100 req/month free)
var xhr2=new XMLHttpRequest();
xhr2.open('GET','http://api.marketstack.com/v1/eod/latest?access_key=demo&symbols=SPY',true);
xhr2.timeout=8000;
xhr2.onload=function(){ fin('MarketStack',xhr2.status,xhr2.responseText.slice(0,300)); };
xhr2.onerror=xhr2.ontimeout=function(){ fin('MarketStack','ERR','failed'); };
xhr2.send();

// 3. IEX Cloud free sandbox
var xhr3=new XMLHttpRequest();
xhr3.open('GET','https://api.iex.cloud/v1/data/core/quote/SPY?token=pk_test_demo',true);
xhr3.timeout=8000;
xhr3.onload=function(){ fin('IEX Cloud',xhr3.status,xhr3.responseText.slice(0,300)); };
xhr3.onerror=xhr3.ontimeout=function(){ fin('IEX Cloud','ERR','failed'); };
xhr3.send();

// 4. WallStreetMojo / Financial Modeling Prep free
var xhr4=new XMLHttpRequest();
xhr4.open('GET','https://financialmodelingprep.com/api/v3/quote/SPY?apikey=demo',true);
xhr4.timeout=8000;
xhr4.onload=function(){ fin('FMP demo',xhr4.status,xhr4.responseText.slice(0,300)); };
xhr4.onerror=xhr4.ontimeout=function(){ fin('FMP','ERR','failed'); };
xhr4.send();

// 5. Polygon free (5 calls/min, check if CORS works)
var xhr5=new XMLHttpRequest();
xhr5.open('GET','https://api.polygon.io/v2/last/trade/SPY?apiKey=demo',true);
xhr5.timeout=8000;
xhr5.onload=function(){ fin('Polygon demo',xhr5.status,xhr5.responseText.slice(0,300)); };
xhr5.onerror=xhr5.ontimeout=function(){ fin('Polygon','ERR','failed'); };
xhr5.send();
</script></body></html>

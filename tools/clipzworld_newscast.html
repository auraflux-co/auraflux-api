<!DOCTYPE html>
<!--
  ═══════════════════════════════════════════════════════════════════════════════
  CWN NEWSCAST OVERLAY — LONG-FORM BROADCAST CHROME
  ═══════════════════════════════════════════════════════════════════════════════

  Purpose:
    Full-screen broadcast-graphics chrome that burns onto every News long-form
    avatar segment (INTRO cold open, STORY#_INTRO, STORY#_SETUP, STORY#_SUMMARY,
    STORY#_REACTION, OUTRO). Consumed by server.js generateNewscastOverlay() via
    Puppeteer + omitBackground:true → real RGBA PNG → FFmpeg `overlay` filter.

  Always-on elements (frame 0 → last word):
    - Top bar: show name + Episode N + LIVE + date
    - Right sidebar story list (420px, min 90px per item, red ▶ ON AIR highlight)
    - Top-right segment-tag (NOW COVERING / category)
    - CWN logo at LOGO_POS_NEWS = {x:1725, y:910, size:90, opacity:0.85}
      (on Bobby G's coffee mug — News-specific override, not the shared LOGO_POS)
    - Combined ticker at y=H-72 (baked at assembly layer via cwn_combined_ticker.html)

  Timed element (TV card / lower-third):
    - Hidden during cold open INTRO
    - Visible for first CONFIG.INTRO_CARD.DURATION_SECONDS at each STORY#_INTRO
    - Hidden for remainder of each STORY# cycle after timeout
    - Hidden during OUTRO

  State transitions per STORY# boundary:
    - Sidebar highlight moves to next story
    - TV card headline swaps to next story
    - Segment-tag seg-name swaps to next story's category

  ─────────────────────────────────────────────────────────────────────────────
  UNIVERSAL CHROME — ALL THREE SHOWS USE THIS FILE
  ─────────────────────────────────────────────────────────────────────────────

  Rob directive (2026-04-15): TV cards removed from all sets. This chrome is now
  the single template for News, Twitch, and NBA long-form. All three shows are
  visually identical in structure — the only differences injected at render time:

    1. Show name (.top-brand text):
         News   → "BECAUSE THE LIGHT WAS ON"
         Twitch → "TALK SOUP"
         NBA    → "OTHER SIDE OF THE PILLOW"

    2. Sidebar story cards (right panel):
         News   → story headlines + WORLD NEWS category labels
         Twitch → streamer display names + ON STREAM category labels
         NBA    → game matchup labels + NBA GAME category labels

    3. Accent colors (--gold, --gold2, --red CSS vars):
         News   → gold #C7AF4F / #f0d060, red #C0392B  (default in :root)
         Twitch → purple #6441A5 / #7d5bbe, red #6441A5
         NBA    → blue #17408B / #1a4fa8, red #C9082A

  Colors + show name are injected via page.evaluate() in generateNewscastOverlay()
  using the contentType param. News is the :root default — no override needed.

  The sidebar's active card highlight (red left border + bold text) serves as the
  "intro card" for all three shows — no separate TV card or circle overlay needed.

  Implementation: CLINE_HANDOFF_SHARED_CHROME_SKINS.md
  ═══════════════════════════════════════════════════════════════════════════════
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920">
<title>ClipzWorld Newscast Overlay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,400;0,600;0,700;0,900;1,700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:  #22304b;
  --gold:  #c7af4f;
  --gold2: #f0d060;
  --red:   #c0392b;
  --white: #ffffff;
  --dark:  #0d1424;
}

body {
  width: 1920px;
  height: 1080px;
  overflow: hidden;
  background: transparent;
  font-family: 'Barlow Condensed', sans-serif;
}

/* ═══════════════════════════════════════
   LOWER THIRD — TV card (top-left, timed)
   Hidden by default; shown via .visible class toggle from generateNewscastOverlay()
═══════════════════════════════════════ */
.lower-third {
  position: absolute;
  top: 48px;        /* sits directly below the 48px top bar */
  left: 0;
  margin-left: 0;   /* explicit: no inherited offset */
  width: 720px;     /* narrowed from 860px to pull back from Bobby G's face */
  display: flex;
  flex-direction: column;
  opacity: 0;
  visibility: hidden;
  transform: translateX(0); /* ensure flush at x=0 — no slide-in offset at capture time */
}

.lower-third.visible {
  opacity: 1;
  visibility: visible;
  transform: translateX(0); /* flush against left frame edge (Fix 4) */
}

@keyframes slideInLeft {
  from { transform: translateX(-100%); }
  to { transform: translateX(0); }
}

.lt-top {
  background: var(--gold);
  padding: 8px 24px 8px 32px;
  display: flex;
  align-items: center;
  gap: 12px;
  clip-path: polygon(0 0, 100% 0, 96% 100%, 0 100%);
}

.lt-category {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  color: var(--dark);
  letter-spacing: 4px;
  line-height: 1;
}

.lt-bottom {
  background: var(--navy);
  padding: 10px 24px 10px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  clip-path: polygon(0 0, 96% 0, 100% 100%, 0 100%);
  border-left: 4px solid var(--gold);
}

.lt-headline {
  font-family: 'Barlow Condensed', sans-serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: 0.5px;
  line-height: 1.1;
}

/* ═══════════════════════════════════════
   TOP BAR — branding + date + show name
═══════════════════════════════════════ */
.top-bar {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 48px;
  background: linear-gradient(90deg, var(--navy) 0%, rgba(34,48,75,0.95) 60%, transparent 100%);
  display: flex;
  align-items: center;
  padding: 0 32px;
  gap: 20px;
  border-bottom: 2px solid var(--gold);
  animation: fadeIn 0.4s ease forwards;
}

@keyframes fadeIn { from{opacity:0} to{opacity:1} }

.top-brand {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  color: var(--gold);
  letter-spacing: 4px;
}

.top-divider {
  width: 1px; height: 24px;
  background: rgba(199,175,79,0.3);
}

.top-show {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 22px;
  font-weight: 400;
  color: var(--gold);
  letter-spacing: 4px;
}

.top-right {
  margin-left: auto;
  margin-right: 80px;  /* pull LIVE indicator + date inward from frame edge */
  display: flex;
  align-items: center;
  gap: 16px;
}

.top-live {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--red);
  padding: 3px 12px;
  border-radius: 2px;
}

.top-live-dot {
  width: 6px; height: 6px;
  border-radius: 50%;
  background: #fff;
  animation: bpulse 1s ease-in-out infinite;
}

@keyframes bpulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

.top-live-text {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px;
  color: #fff;
  letter-spacing: 3px;
}

.top-time {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 18px;
  color: var(--gold);
  letter-spacing: 2px;
}

/* ═══════════════════════════════════════
   SEGMENT INDICATOR — top right corner
═══════════════════════════════════════ */
.segment-tag {
  position: absolute;
  top: 60px;
  right: 32px;
  background: var(--navy);
  border: 1px solid var(--gold);
  border-radius: 3px;
  padding: 6px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  animation: fadeIn 0.5s ease 0.4s both;
}

.seg-label {
  font-size: 9px;
  color: rgba(199,175,79,0.6);
  letter-spacing: 3px;
  font-weight: 700;
}

.seg-name {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 20px;
  color: #fff;
  letter-spacing: 2px;
}

/* ═══════════════════════════════════════
   SIDE STORY LIST — right panel (420px wide, min 90px per item)
═══════════════════════════════════════ */
.story-list {
  position: absolute;
  top: 120px;
  right: 32px;
  width: 420px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  animation: fadeIn 0.5s ease 0.6s both;
}

.story-item {
  background: rgba(8,14,28,1.0);
  border-left: 4px solid var(--gold);
  border-top: 1px solid rgba(199,175,79,0.18);
  border-bottom: 1px solid rgba(199,175,79,0.18);
  border-right: 1px solid rgba(199,175,79,0.18);
  border-radius: 0 4px 4px 0;
  padding: 14px 16px;
  min-height: 90px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.story-item-cat {
  font-size: 12px;
  font-weight: 700;
  color: var(--gold);
  letter-spacing: 3px;
  margin-bottom: 5px;
}

.story-item-text {
  font-size: 18px;
  font-weight: 600;
  color: #ffffff;
  line-height: 1.35;
}

.story-item.active {
  border-left-color: var(--red);
  border-left-width: 5px;
  background: rgba(34,48,75,1.0);
}

.story-item.active .story-item-cat { color: var(--red); }
.story-item.active .story-item-text { color: #fff; font-weight: 700; }

.story-item-fact {
  font-size: 12px;
  font-weight: 400;
  color: rgba(255,255,255,0.55);
  line-height: 1.3;
  margin-top: 4px;
  font-style: italic;
}
.story-item.active .story-item-fact {
  color: rgba(255,255,255,0.75);
}

/* Fix 5a — Static 5-card cap: cards 6+ are never shown (no rotation logic) */
.story-list .story-item:nth-child(n+6) {
  display: none;
}

/* Fix 5b — Mutual exclusion: sidebar hides when flag+TV card are active */
body.sidebar-hidden .story-list {
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.5s ease, visibility 0.5s ease;
}

</style>
</head>
<body>

<!-- TOP BAR -->
<div class="top-bar">
  <div class="top-show" id="show-info">Episode 1</div>
  <div class="top-divider"></div>
  <div class="top-brand">BECAUSE THE LIGHT WAS ON</div>
  <div class="top-right">
    <div class="top-live">
      <div class="top-live-dot"></div>
      <div class="top-live-text">LIVE</div>
    </div>
    <div class="top-time" id="date-display">MARCH 30, 2026</div>
  </div>
</div>

<!-- SEGMENT TAG -->
<div class="segment-tag">
  <div class="seg-label">NOW COVERING</div>
  <div class="seg-name">WORLD NEWS</div>
</div>

<!-- STORY LIST — populated dynamically by generateNewscastOverlay() via page.evaluate() -->
<div class="story-list">
</div>

<!-- LOWER THIRD (TV card — hidden by default, shown via .visible class) -->
<div class="lower-third">
  <div class="lt-top">
    <div class="lt-category">WORLD NEWS</div>
  </div>
  <div class="lt-bottom">
    <div class="lt-headline"></div>
  </div>
</div>

<script>
// Live date display
function updateDate() {
  var now = new Date();
  var months = ['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
  var dateStr = months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
  var el = document.getElementById('date-display');
  if (el) el.textContent = dateStr;
}
updateDate();
setInterval(updateDate, 60000); // Update every minute

// Story tracking system (like ESPN game IDs)
// URL params: ?activeStory=2 to highlight story #2
function setActiveStory(storyId) {
  var items = document.querySelectorAll('.story-item');
  items.forEach(function(item, index) {
    item.classList.remove('active');
    var cat = item.querySelector('.story-item-cat');
    if (index === storyId - 1) {
      item.classList.add('active');
      if (cat) cat.textContent = '▶ ON AIR';
    } else {
      // Reset to original category (you can customize this per story)
      var categories = ['WORLD', 'SPORTS', 'TECH', 'POLITICS'];
      if (cat && index < categories.length) cat.textContent = categories[index];
    }
  });
}

// Check URL params on load
var urlParams = new URLSearchParams(window.location.search);
var activeStory = urlParams.get('activeStory');
if (activeStory) {
  setActiveStory(parseInt(activeStory));
}

// Optional: Listen for postMessage from parent (for OBS integration)
window.addEventListener('message', function(event) {
  if (event.data && event.data.type === 'setActiveStory') {
    setActiveStory(event.data.storyId);
  }
  if (event.data && event.data.type === 'updateLowerThird') {
    var data = event.data;
    var headline = document.querySelector('.lt-headline');
    var category = document.querySelectorAll('.lt-category')[0];
    if (headline && data.headline) headline.textContent = data.headline;
    if (category && data.category) category.textContent = data.category;
  }
});
</script>
</body>
</html>

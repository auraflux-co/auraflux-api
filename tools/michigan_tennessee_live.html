<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ClipzWorld — Michigan vs Tennessee LIVE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: transparent; font-family: 'Arial Black', Arial, sans-serif; overflow: hidden; }

  .board {
    width: 520px;
    border-radius: 14px;
    overflow: hidden;
    border: 2px solid #c7af4f;
    box-shadow: 0 8px 40px rgba(0,0,0,0.85);
  }

  /* Brand */
  .brand-bar {
    background: #c7af4f;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 16px;
  }
  .brand-name { font-size: 11px; font-weight: 900; color: #111827; letter-spacing: 2px; }
  .live-pill {
    display: flex; align-items: center; gap: 5px;
    background: #111827; border-radius: 20px;
    padding: 3px 10px; font-size: 10px; font-weight: 900;
    color: #c7af4f; letter-spacing: 1px;
  }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #e74c3c; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.75)} }

  /* Event label */
  .event-bar {
    background: #0a0f1e;
    text-align: center;
    padding: 5px 16px;
    font-size: 10px;
    color: rgba(199,175,79,0.65);
    letter-spacing: 2px;
    font-weight: 700;
    border-bottom: 1px solid rgba(199,175,79,0.15);
  }

  /* Game clock */
  .clock-bar {
    background: #111827;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    padding: 8px 20px;
    border-bottom: 1px solid rgba(199,175,79,0.12);
  }
  .period-badge {
    background: #c7af4f; color: #111827;
    font-size: 11px; font-weight: 900;
    padding: 3px 14px; border-radius: 20px; letter-spacing: 1px;
  }
  .game-clock { font-size: 28px; font-weight: 900; color: #fff; letter-spacing: 2px; min-width: 90px; text-align: center; }
  .shot-wrap { text-align: center; }
  .shot-num { font-size: 16px; font-weight: 900; color: #c7af4f; line-height: 1; }
  .shot-lbl { font-size: 9px; color: rgba(199,175,79,0.45); letter-spacing: 1px; }

  /* Teams */
  .teams-row {
    display: flex;
    background: #0d1424;
  }

  .team-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 18px 14px;
    gap: 8px;
    position: relative;
    overflow: hidden;
  }
  .team-panel.uconn { background: linear-gradient(160deg, #002868 0%, #001540 100%); }
  .team-panel.duke  { background: linear-gradient(160deg, #003087 0%, #001855 100%); }

  .team-logo {
    width: 80px; height: 80px;
    border-radius: 50%;
    background: #fff;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,0.2);
    box-shadow: 0 4px 16px rgba(0,0,0,0.5);
    flex-shrink: 0;
  }
  .team-logo img {
    width: 90%; height: 90%;
    object-fit: contain;
  }
  .team-logo .fallback {
    font-size: 13px; font-weight: 900;
    color: #002868; letter-spacing: 1px;
  }

  .team-abbr { font-size: 20px; font-weight: 900; color: rgba(255,255,255,0.9); letter-spacing: 2px; }
  .team-record { font-size: 10px; color: rgba(255,255,255,0.4); font-family: Arial,sans-serif; font-weight: 400; letter-spacing: .3px; }
  .team-score { font-size: 72px; font-weight: 900; color: #fff; line-height: 1; letter-spacing: -3px; }
  .team-score.leading { color: #f0d060; }
  .team-fouls { font-size: 10px; color: rgba(255,255,255,0.38); font-family: Arial,sans-serif; }
  .team-fouls b { color: #c7af4f; }
  .timeouts { display: flex; gap: 5px; margin-top: 2px; }
  .to { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.55); }
  .to.used { background: rgba(255,255,255,0.1); }

  /* Divider */
  .mid-div {
    width: 3px; background: #c7af4f;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 5px;
  }
  .mid-dot { width: 7px; height: 7px; border-radius: 50%; background: #c7af4f; margin: 0 -2px; }

  /* Half breakdown */
  .halves {
    background: #080d1a;
    border-top: 1px solid rgba(199,175,79,0.12);
    padding: 7px 18px;
  }
  .ht { width: 100%; border-collapse: collapse; font-family: Arial,sans-serif; }
  .ht th { font-size: 10px; color: rgba(199,175,79,0.45); font-weight: 700; padding: 2px 8px; text-align: center; letter-spacing: 1px; }
  .ht td { font-size: 13px; font-weight: 700; color: #fff; text-align: center; padding: 3px 8px; }
  .ht td.lbl { text-align: left; font-size: 11px; color: rgba(255,255,255,0.45); font-weight: 400; }
  .ht td.tot { color: #c7af4f; font-size: 15px; font-weight: 900; }

  /* Last play */
  .last-play {
    background: #0a0f1e;
    border-top: 1px solid rgba(199,175,79,0.1);
    padding: 6px 16px;
    font-size: 11px;
    color: rgba(255,255,255,0.55);
    font-family: Arial, sans-serif;
    min-height: 28px;
    text-align: center;
    font-style: italic;
  }
  .last-play b { color: #c7af4f; font-style: normal; }

  /* Bottom */
  .bottom-bar {
    background: #080d1a;
    border-top: 1px solid rgba(199,175,79,0.1);
    padding: 4px 16px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .bt { font-size: 9px; color: rgba(199,175,79,0.35); letter-spacing: 1.5px; font-family: Arial,sans-serif; }
  .upd { font-size: 9px; color: rgba(255,255,255,0.2); font-family: Arial,sans-serif; }

  /* Error state */
  .err { text-align:center; padding: 10px; font-size:10px; color: rgba(255,100,100,0.7); font-family:Arial,sans-serif; }
</style>
</head>
<body>
<div class="board">

  <div class="brand-bar">
    <span class="brand-name">CLIPZWORLD</span>
    <div class="live-pill">
      <div class="live-dot" id="live-dot"></div>
      <span id="live-lbl">LIVE</span>
    </div>
  </div>

  <div class="event-bar" id="event-label">NCAA MEN'S BASKETBALL · ELITE EIGHT · CBS</div>

  <div class="clock-bar">
    <div class="period-badge" id="period">PRE-GAME</div>
    <div class="game-clock" id="clock">2:15 PM</div>
    <div class="shot-wrap">
      <div class="shot-num" id="shot">30</div>
      <div class="shot-lbl">SHOT</div>
    </div>
  </div>

  <div class="teams-row">
    <!-- UConn -->
    <div class="team-panel mich" style="background:linear-gradient(160deg,#00274C 0%,#001428 100%)">
      <div class="team-logo" id="uconn-logo">
        <img id="mich-logo-img" src="" alt="Michigan" onerror="this.style.display='none';document.getElementById('uconn-fallback').style.display='flex'">
        <div class="fallback" id="mich-fallback" style="display:none">MICH</div>
      </div>
      <div class="team-abbr">MICH</div>
      <div class="team-record" id="mich-record">34-3</div>
      <div class="team-score" id="mich-score">0</div>
      <div class="team-fouls">FOULS <b id="mich-fouls">0</b></div>
      <div class="timeouts" id="mich-to"></div>
    </div>

    <div class="mid-div">
      <div class="mid-dot"></div>
      <div class="mid-dot"></div>
      <div class="mid-dot"></div>
    </div>

    <!-- Duke -->
    <div class="team-panel tenn" style="background:linear-gradient(160deg,#FF8200 0%,#b35c00 100%)">
      <div class="team-logo" id="duke-logo">
        <img id="tenn-logo-img" src="" alt="Tennessee" onerror="this.style.display='none';document.getElementById('duke-fallback').style.display='flex'">
        <div class="fallback" id="tenn-fallback" style="display:none">TENN</div>
      </div>
      <div class="team-abbr">TENN</div>
      <div class="team-record" id="tenn-record">25-11</div>
      <div class="team-score" id="tenn-score">0</div>
      <div class="team-fouls">FOULS <b id="tenn-fouls">0</b></div>
      <div class="timeouts" id="tenn-to"></div>
    </div>
  </div>

  <div class="halves">
    <table class="ht">
      <thead>
        <tr><th></th><th>1H</th><th>2H</th><th>OT</th><th>TOT</th></tr>
      </thead>
      <tbody>
        <tr>
          <td class="lbl">MICH</td>
          <td id="m-h1">—</td><td id="m-h2">—</td><td id="m-ot">—</td>
          <td class="tot" id="m-tot">0</td>
        </tr>
        <tr>
          <td class="lbl">TENN</td>
          <td id="t-h1">—</td><td id="t-h2">—</td><td id="t-ot">—</td>
          <td class="tot" id="t-tot">0</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="last-play" id="last-play">Tip-off at 2:15 PM ET · Chicago, IL · CBS</div>

  <div class="bottom-bar">
    <span class="bt">CLIPS · HIGHLIGHTS · MOMENTS</span>
    <span class="upd" id="upd-time">Connecting...</span>
  </div>

</div>

<script>
const GAME_ID = '401856576';
const API_URL = `https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/summary?event=${GAME_ID}`;

function renderTO(id, total, used){
  const el = document.getElementById(id);
  if(!el) return;
  el.innerHTML = '';
  for(let i=0;i<total;i++){
    const d = document.createElement('div');
    d.className = 'to' + (i < used ? ' used' : '');
    el.appendChild(d);
  }
}

function setScore(id, val, isLeading){
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = val;
  el.className = 'team-score' + (isLeading ? ' leading' : '');
}

function setPeriodDisplay(status, period, clock){
  const pEl = document.getElementById('period');
  const cEl = document.getElementById('clock');
  const sEl = document.getElementById('shot');
  const dotEl = document.getElementById('live-dot');
  const lblEl = document.getElementById('live-lbl');

  const name = status?.type?.name || '';

  if(name === 'STATUS_FINAL' || name === 'STATUS_FULL_TIME'){
    pEl.textContent = 'FINAL';
    cEl.textContent = 'FINAL';
    sEl.textContent = '';
    dotEl.style.animationPlayState = 'paused';
    dotEl.style.background = '#555';
    lblEl.textContent = 'FINAL';
  } else if(name === 'STATUS_HALFTIME'){
    pEl.textContent = 'HALF';
    cEl.textContent = 'HALFTIME';
    sEl.textContent = '';
    dotEl.style.background = '#f39c12';
  } else if(name === 'STATUS_IN_PROGRESS'){
    const pLabel = period === 1 ? '1ST HALF' : (period === 2 ? '2ND HALF' : `OT${period-2}`);
    pEl.textContent = pLabel;
    cEl.textContent = clock || '—';
    dotEl.style.animationPlayState = 'running';
    dotEl.style.background = '#e74c3c';
    lblEl.textContent = 'LIVE';
  } else {
    pEl.textContent = 'PRE-GAME';
    cEl.textContent = '2:15 PM ET';
    sEl.textContent = '30';
    dotEl.style.animationPlayState = 'paused';
    dotEl.style.background = '#27ae60';
    lblEl.textContent = 'UPCOMING';
  }
}

function updateFromData(data){
  try {
    const comp = data.header?.competitions?.[0];
    if(!comp) return;

    const competitors = comp.competitors || [];
    const away = competitors.find(c=>c.homeAway==='away') || competitors[0];
    const home = competitors.find(c=>c.homeAway==='home') || competitors[1];

    // Logos
    if(away?.team?.logo){
      document.getElementById('mich-logo-img').src = away.team.logo;
    }
    if(home?.team?.logo){
      document.getElementById('tenn-logo-img').src = home.team.logo;
    }

    // Records
    if(away?.record?.[0]?.displayValue) document.getElementById('mich-record').textContent = away.record[0].displayValue;
    if(home?.record?.[0]?.displayValue) document.getElementById('tenn-record').textContent = home.record[0].displayValue;

    // Scores
    const awayScore = parseInt(away?.score) || 0;
    const homeScore = parseInt(home?.score) || 0;
    const isFinal = comp.status?.type?.name === 'STATUS_FINAL';
    setScore('mich-score', awayScore, isFinal && awayScore > homeScore);
    setScore('tenn-score',  homeScore, isFinal && homeScore > awayScore);
    document.getElementById('m-tot').textContent = awayScore;
    document.getElementById('t-tot').textContent = homeScore;

    // Clock / period
    setPeriodDisplay(comp.status, comp.status?.period, comp.status?.displayClock);

    // Line scores (halves)
    const awayLines = away?.linescores || [];
    const homeLines = home?.linescores || [];
    const awayIds = ['m-h1','m-h2','m-ot'];
    const homeIds = ['t-h1','t-h2','t-ot'];
    awayLines.forEach((ls,i)=>{ if(awayIds[i]) document.getElementById(awayIds[i]).textContent = ls.displayValue||ls.value||'—'; });
    homeLines.forEach((ls,i)=>{ if(homeIds[i]) document.getElementById(homeIds[i]).textContent = ls.displayValue||ls.value||'—'; });

    // Fouls from boxscore
    const players = data.boxscore?.players || [];
    players.forEach(teamPlayers=>{
      const abbr = teamPlayers.team?.abbreviation?.toUpperCase();
      const stats = teamPlayers.statistics?.[0];
      const foulsIdx = stats?.names?.indexOf('PF');
      if(foulsIdx > -1){
        let totalFouls = 0;
        (teamPlayers.athletes||[]).forEach(a=>{
          const fv = parseInt(a.stats?.[foulsIdx])||0;
          totalFouls += fv;
        });
        if(abbr==='MICH'||abbr==='MICHIGAN') document.getElementById('mich-fouls').textContent = totalFouls;
        if(abbr==='TENN'||abbr==='TENNESSEE') document.getElementById('tenn-fouls').textContent = totalFouls;
      }
    });

    // Timeouts from situation
    const situation = data.situation;
    if(situation){
      const awayTO = parseInt(situation.awayTimeouts ?? 4);
      const homeTO = parseInt(situation.homeTimeouts ?? 4);
      renderTO('mich-to', 4, 4 - awayTO);
      renderTO('tenn-to',  4, 4 - homeTO);
    }

    // Last play
    const lastPlay = data.situation?.lastPlay?.text || data.situation?.lastPlay?.description || '';
    if(lastPlay){
      document.getElementById('last-play').innerHTML = `<b>Last play:</b> ${lastPlay}`;
    }

    // Update time
    const now = new Date();
    document.getElementById('upd-time').textContent = 'Updated ' + now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});

  } catch(e){
    console.error('Parse error:', e);
  }
}

async function fetchGame(){
  try {
    const res = await fetch(API_URL, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    updateFromData(data);
  } catch(e){
    console.warn('Fetch error:', e);
    document.getElementById('upd-time').textContent = 'Fetch error — retrying...';
  }
}

// Initial render of timeouts
renderTO('mich-to', 4, 0);
renderTO('tenn-to',  4, 0);

// Fetch immediately then every 25 seconds
fetchGame();
setInterval(fetchGame, 25000);
</script>
</body>
</html>

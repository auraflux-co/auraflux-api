<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:ital,wght@0,300;0,700;0,900;1,700&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:2560px; height:1440px; background:#060a12; overflow:hidden; font-family:'Barlow Condensed',sans-serif; }

/* Deep background */
.bg {
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 50%, rgba(34,48,75,0.9) 0%, transparent 70%),
    linear-gradient(135deg, #060a12 0%, #0d1a2e 40%, #111f38 60%, #060a12 100%);
}

/* Grid pattern */
.grid {
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(199,175,79,0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(199,175,79,0.04) 1px, transparent 1px);
  background-size:80px 80px;
}

/* Corner brackets */
.bracket {
  position:absolute;
  width:120px; height:120px;
}
.bracket::before, .bracket::after {
  content:'';
  position:absolute;
  background:#c7af4f;
}
.bracket.tl { top:60px; left:60px; }
.bracket.tl::before { width:3px; height:80px; top:0; left:0; }
.bracket.tl::after  { width:80px; height:3px; top:0; left:0; }
.bracket.tr { top:60px; right:60px; }
.bracket.tr::before { width:3px; height:80px; top:0; right:0; }
.bracket.tr::after  { width:80px; height:3px; top:0; right:0; }
.bracket.bl { bottom:60px; left:60px; }
.bracket.bl::before { width:3px; height:80px; bottom:0; left:0; }
.bracket.bl::after  { width:80px; height:3px; bottom:0; left:0; }
.bracket.br { bottom:60px; right:60px; }
.bracket.br::before { width:3px; height:80px; bottom:0; right:0; }
.bracket.br::after  { width:80px; height:3px; bottom:0; right:0; }

/* Gold accent lines */
.line-top    { position:absolute; top:180px;    left:60px; right:60px; height:2px; background:linear-gradient(90deg,transparent,#c7af4f 20%,#c7af4f 80%,transparent); }
.line-bottom { position:absolute; bottom:180px; left:60px; right:60px; height:2px; background:linear-gradient(90deg,transparent,#c7af4f 20%,#c7af4f 80%,transparent); }
.line-vert   { position:absolute; top:180px; bottom:180px; left:680px; width:2px; background:linear-gradient(180deg,transparent,rgba(199,175,79,0.5) 30%,rgba(199,175,79,0.5) 70%,transparent); }

/* Logo area */
.logo-area {
  position:absolute;
  top:50%; left:200px;
  transform:translateY(-50%);
  width:440px; height:440px;
}
.logo-ring {
  width:440px; height:440px;
  border-radius:50%;
  border:4px solid rgba(199,175,79,0.6);
  box-shadow:0 0 80px rgba(199,175,79,0.2), inset 0 0 40px rgba(199,175,79,0.05);
  overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.logo-ring img {
  width:420px; height:420px;
  object-fit:cover;
}

/* Text area */
.text-area {
  position:absolute;
  top:50%; left:740px; right:200px;
  transform:translateY(-50%);
}
.brand-tag {
  font-family:'Bebas Neue',sans-serif;
  font-size:26px;
  color:#c7af4f;
  letter-spacing:10px;
  margin-bottom:20px;
  opacity:0.8;
}
.main-title {
  font-family:'Bebas Neue',sans-serif;
  font-size:260px;
  line-height:0.85;
  color:#fff;
  letter-spacing:8px;
  text-shadow:0 0 120px rgba(199,175,79,0.15);
  margin-bottom:16px;
}
.main-title span { color:#c7af4f; }
.gold-line {
  width:100%;
  height:3px;
  background:linear-gradient(90deg,#c7af4f,rgba(199,175,79,0.2));
  margin:30px 0;
}
.sub-line {
  font-size:42px;
  font-weight:300;
  color:rgba(255,255,255,0.45);
  letter-spacing:14px;
}

/* Schedule strip */
.schedule {
  position:absolute;
  bottom:100px; left:740px; right:200px;
  display:flex; align-items:center; gap:40px;
}
.sched-item {
  display:flex; align-items:center; gap:12px;
}
.sched-dot { width:8px; height:8px; border-radius:50%; background:#c7af4f; }
.sched-txt { font-size:28px; font-weight:700; color:rgba(255,255,255,0.5); letter-spacing:3px; }
</style>
</head>

<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>body{background:#111;color:#0f0;font-family:monospace;font-size:11px;padding:15px;}
h3{color:#f39c12;margin:8px 0 4px;}pre{background:#1a1a2e;padding:8px;border-radius:4px;white-space:pre-wrap;word-break:break-all;}</style>
</head><body>
<h3>FMP Free Tier Symbol Test</h3>
<button onclick="run()" style="background:#c7af4f;color:#000;font-weight:900;padding:6px 14px;border:none;cursor:pointer">TEST</button>
<div id="out" style="margin-top:12px">Click TEST</div>
<script>
var KEY='rJPVYlHnpcjxuOLoR1phvBz7e27UMMSq';
var BASE='https://financialmodelingprep.com/stable/quote?apikey='+KEY+'&symbol=';

function run(){
  var out=''; var done=0;
  // Test every symbol individually to find what works free
  var tests=[
    // Single stocks - we know these work
    'AAPL','GOOGL','NFLX','AMD','JPM','WMT','V',
    // ETFs
    'GLD','SLV','USO','TLT','VXX','QQQ','SPY',
    // Commodities direct
    'GCUSD','SIUSD','CLUSD',
    // Multi-symbol batch
    'AAPL,GOOGL,NFLX'
  ];
  var total=tests.length;
  function fin(sym,status,txt){
    var ok=status==200&&txt.indexOf('402')===-1&&txt.indexOf('Premium')===-1&&txt.indexOf('Error')===-1;
    out+='<pre style="color:'+(ok?'#2ecc71':'#e74c3c')+'">'+sym+': '+(ok?'OK - $'+JSON.parse(txt)[0].price:'BLOCKED')+'</pre>';
    done++; if(done>=total) document.getElementById('out').innerHTML=out;
  }
  tests.forEach(function(sym,i){
    setTimeout(function(){
      var xhr=new XMLHttpRequest();
      xhr.open('GET',BASE+sym,true);
      xhr.timeout=6000;
      xhr.onload=function(){
        try{ fin(sym,xhr.status,xhr.responseText); }
        catch(e){ out+='<pre style="color:#f39c12">'+sym+': PARSE ERR</pre>'; done++; if(done>=total) document.getElementById('out').innerHTML=out; }
      };
      xhr.onerror=xhr.ontimeout=function(){ out+='<pre style="color:#e74c3c">'+sym+': NET ERR</pre>'; done++; if(done>=total) document.getElementById('out').innerHTML=out; };
      xhr.send();
    }, i*400);
  });
}
</script></body></html>

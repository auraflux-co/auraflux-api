<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>body{background:#111;color:#0f0;font-family:monospace;font-size:11px;padding:15px;}
h3{color:#f39c12;margin:8px 0 4px;}pre{background:#1a1a1a;padding:8px;border-radius:4px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;}</style>
</head><body>
<h3>FMP Free Endpoints Test</h3>
<button onclick="run()" style="background:#c7af4f;color:#000;font-weight:900;padding:6px 14px;border:none;cursor:pointer">TEST</button>
<div id="out" style="margin-top:12px">Click TEST</div>
<script>
var KEY='rJPVYlHnpcjxuOLoR1phvBz7e27UMMSq';
var BASE='https://financialmodelingprep.com/stable/';

function run(){
  var out=''; var done=0; var total=6;
  function fin(l,s,t){ out+='<h3>'+l+' ('+s+')</h3><pre>'+t.slice(0,400)+'</pre>'; done++; if(done>=total) document.getElementById('out').innerHTML=out; }

  // Try single symbol quotes (may be free)
  var xhr1=new XMLHttpRequest();
  xhr1.open('GET',BASE+'quote?symbol=AAPL&apikey='+KEY,true);
  xhr1.timeout=8000;
  xhr1.onload=function(){ fin('Single quote AAPL',xhr1.status,xhr1.responseText.slice(0,300)); };
  xhr1.onerror=xhr1.ontimeout=function(){ fin('Single quote','ERR','failed'); };
  xhr1.send();

  // Try search endpoint
  setTimeout(function(){
    var xhr2=new XMLHttpRequest();
    xhr2.open('GET',BASE+'profile?symbol=AAPL&apikey='+KEY,true);
    xhr2.timeout=8000;
    xhr2.onload=function(){ fin('Profile AAPL',xhr2.status,xhr2.responseText.slice(0,300)); };
    xhr2.onerror=xhr2.ontimeout=function(){ fin('Profile','ERR','failed'); };
    xhr2.send();
  },1000);

  // Try market indexes endpoint
  setTimeout(function(){
    var xhr3=new XMLHttpRequest();
    xhr3.open('GET','https://financialmodelingprep.com/stable/quote?symbol=^GSPC&apikey='+KEY,true);
    xhr3.timeout=8000;
    xhr3.onload=function(){ fin('S&P index',xhr3.status,xhr3.responseText.slice(0,300)); };
    xhr3.onerror=xhr3.ontimeout=function(){ fin('Index','ERR','failed'); };
    xhr3.send();
  },2000);

  // Try simple quote endpoint different path
  setTimeout(function(){
    var xhr4=new XMLHttpRequest();
    xhr4.open('GET','https://financialmodelingprep.com/api/v3/quote/AAPL?apikey='+KEY,true);
    xhr4.timeout=8000;
    xhr4.onload=function(){ fin('API v3 quote AAPL',xhr4.status,xhr4.responseText.slice(0,300)); };
    xhr4.onerror=xhr4.ontimeout=function(){ fin('v3 quote','ERR','failed'); };
    xhr4.send();
  },3000);

  // Try market gainers (often free)
  setTimeout(function(){
    var xhr5=new XMLHttpRequest();
    xhr5.open('GET','https://financialmodelingprep.com/api/v3/stock_market/gainers?apikey='+KEY,true);
    xhr5.timeout=8000;
    xhr5.onload=function(){ fin('Market Gainers',xhr5.status,xhr5.responseText.slice(0,300)); };
    xhr5.onerror=xhr5.ontimeout=function(){ fin('Gainers','ERR','failed'); };
    xhr5.send();
  },4000);

  // Try sector performance
  setTimeout(function(){
    var xhr6=new XMLHttpRequest();
    xhr6.open('GET','https://financialmodelingprep.com/api/v3/sectors-performance?apikey='+KEY,true);
    xhr6.timeout=8000;
    xhr6.onload=function(){ fin('Sectors Performance',xhr6.status,xhr6.responseText.slice(0,400)); };
    xhr6.onerror=xhr6.ontimeout=function(){ fin('Sectors','ERR','failed'); };
    xhr6.send();
  },5000);
}
</script></body></html>

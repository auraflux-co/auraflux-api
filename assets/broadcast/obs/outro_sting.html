<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ClipzWorld — Show Outro</title>
  <meta name="viewport" content="width=1920, height=1080" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 1920px; height: 1080px; overflow: hidden;
      background: #060a12;
    }
    .bg {
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 90% 80% at 50% 50%, #22304b 0%, #060a12 70%);
    }
    .content {
      position: absolute; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      opacity: 0;
      animation: in 0.8s ease-out 0.3s forwards;
    }
    @keyframes in { to { opacity: 1; } }
    .thanks {
      font-family: "Bebas Neue", sans-serif;
      font-size: 88px; letter-spacing: 8px; color: #fff;
      text-align: center;
    }
    .sub {
      margin-top: 20px;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 32px; font-weight: 600;
      letter-spacing: 6px; text-transform: uppercase;
      color: #c7af4f;
    }
    .cta {
      margin-top: 48px;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 24px;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.55);
      text-align: center; line-height: 1.6;
    }
    .handles {
      margin-top: 32px;
      font-family: "Barlow Condensed", sans-serif;
      font-size: 22px;
      letter-spacing: 4px;
      color: rgba(255,255,255,0.4);
    }
    .fade {
      position: absolute; inset: 0; background: #000;
      opacity: 0;
      animation: out 1.2s ease-in 12s forwards;
    }
    @keyframes out { to { opacity: 1; } }
  </style>
</head>
<body>
  <div class="bg"></div>
  <div class="content">
    <div class="thanks">THANKS FOR WATCHING</div>
    <div class="sub" id="show-line">TWITCH SOUP</div>
    <div class="cta">Follow for the next live · Same time tomorrow</div>
    <div class="handles">@clipzworldnews · twitch.tv/clipzworldnews</div>
  </div>
  <div class="fade"></div>
  <script>
    var show = new URLSearchParams(location.search).get('show');
    if (show) document.getElementById('show-line').textContent = show;
  </script>
  <!-- Pair with outro music Media Source. Stop stream after fade (~13s) or hold on black. -->
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Clipz World Live — Local Watch</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --gold:#c7af4f; --navy:#0d1424; --chrome-h:44px; --footer-h:52px; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { background:#060a12; color:#fff; font-family:system-ui,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
    header {
      flex-shrink:0; height:var(--chrome-h);
      padding:0 16px; display:flex; align-items:center; justify-content:space-between;
      border-bottom:1px solid rgba(199,175,79,.2); background:#0f1a30;
    }
    header h1 { font-size:14px; letter-spacing:2px; color:var(--gold); font-weight:600; }
    .tag { font-size:10px; padding:3px 8px; border-radius:999px; border:1px solid rgba(199,175,79,.35); }
    .tag.live { color:#5c8; border-color:#5c8; }
    .tag.off { color:rgba(255,255,255,.4); }
    /* Locked 16:9 — matches YouTube encode pixel-for-pixel, no stretch */
    .stage-wrap {
      flex:1; display:flex; align-items:center; justify-content:center;
      min-height:0; padding:8px;
    }
    .stage {
      position:relative; width:min(100%, calc((100vh - var(--chrome-h) - var(--footer-h) - 16px) * 16 / 9));
      aspect-ratio:16/9; background:#000; overflow:hidden;
    }
    #player { display:block; width:100%; height:100%; background:#000; }
    .offline-msg {
      position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
      background:var(--navy); color:rgba(255,255,255,.5); font-size:15px; text-align:center; padding:24px;
    }
    footer {
      flex-shrink:0; min-height:var(--footer-h); padding:8px 16px 12px;
      display:flex; flex-direction:column; align-items:center; gap:8px;
    }
    .unmute-bar { display:none; }
    .unmute-bar.show { display:block; }
    .unmute-bar button {
      font-size:14px; font-weight:700; letter-spacing:1px;
      background:var(--gold); color:var(--navy); border:none;
      padding:10px 24px; border-radius:4px; cursor:pointer;
    }
    .meta { font-size:13px; color:rgba(255,255,255,.6); text-align:center; }
    .ok { color:#5c8; } .warn { color:#f0883e; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"></script>
</head>
<body>
  <header>
    <h1>CLIPZ WORLD LIVE — LOCAL WATCH</h1>
    <span id="status-tag" class="tag off">OFFLINE</span>
  </header>
  <div class="stage-wrap">
    <div class="stage" id="stage">
      <div id="offline-msg" class="offline-msg">Grid offline — GO LIVE (Local only) on the broadcast dashboard</div>
      <video id="player" playsinline muted></video>
    </div>
  </div>
  <footer>
    <div id="unmute-bar" class="unmute-bar show">
      <button type="button" onclick="unmute()">▶ UNMUTE — HEAR ON-AIR AUDIO</button>
    </div>
    <p class="meta" id="meta">Loading…</p>
  </footer>
  <script>
    const v = document.getElementById('player');
    const meta = document.getElementById('meta');
    const stage = document.getElementById('stage');
    const offlineMsg = document.getElementById('offline-msg');
    const statusTag = document.getElementById('status-tag');
    const unmuteBar = document.getElementById('unmute-bar');
    let hlsInstance = null;

    function unmute() {
      v.muted = false;
      v.play().catch(() => {});
      unmuteBar.classList.remove('show');
    }

    function attachHls(url) {
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      offlineMsg.style.display = 'none';
      v.style.display = 'block';
      if (v.canPlayType('application/vnd.apple.mpegurl')) {
        v.src = url;
      } else if (window.Hls && Hls.isSupported()) {
        hlsInstance = new Hls({ lowLatencyMode: true, enableWorker: true });
        hlsInstance.loadSource(url);
        hlsInstance.attachMedia(v);
      }
      v.play().catch(() => {});
    }

    function detachHls() {
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      v.removeAttribute('src');
      v.load();
      v.style.display = 'none';
      offlineMsg.style.display = 'flex';
    }

    async function boot() {
      const feed = await fetch('/broadcast/local-feed').then((r) => r.json()).catch(() => null);
      if (!feed?.ok) {
        meta.innerHTML = '<span class="warn">Could not load /broadcast/local-feed</span>';
        return;
      }
      const live = feed.gridRunning && feed.composed?.hlsReady;
      const stale = feed.gridRunning && feed.composed?.hlsStale;
      statusTag.textContent = live ? 'LIVE' : stale ? 'STALE' : 'OFFLINE';
      statusTag.className = 'tag ' + (live ? 'live' : 'off');

      if (live && feed.composed?.hlsUrl) {
        const url = feed.composed.hlsUrl + '?t=' + Date.now();
        if (stage.dataset.liveUrl !== feed.composed.hlsUrl) {
          stage.dataset.liveUrl = feed.composed.hlsUrl;
          attachHls(url);
        }
        if (v.muted) unmuteBar.classList.add('show');
        meta.innerHTML = `<span class="ok">Live encode</span> · Q${feed.onAir?.quadrant || '?'} ${feed.onAir?.login || ''} · ${v.videoWidth || '?'}×${v.videoHeight || '?'}`;
      } else {
        delete stage.dataset.liveUrl;
        detachHls();
        meta.innerHTML = stale
          ? '<span class="warn">Stale HLS — END STREAM → Local only → GO LIVE</span>'
          : feed.gridRunning
            ? '<span class="warn">Encoder starting…</span>'
            : '<span class="warn">Grid offline</span>';
        unmuteBar.classList.remove('show');
      }
    }

    v.addEventListener('volumechange', () => { if (!v.muted) unmuteBar.classList.remove('show'); });
    boot();
    setInterval(boot, 8000);
  </script>
</body>
</html>

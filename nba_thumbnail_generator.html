<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0e1a; color:#fff; font-family:'Barlow Condensed',Arial,sans-serif; }
#ctrl { background:#111827; border-bottom:3px solid #c7af4f; padding:14px 20px; display:flex; align-items:center; gap:14px; position:relative; z-index:999; }
#ctrl label { font-size:11px; font-weight:700; color:rgba(199,175,79,0.7); letter-spacing:2px; }
#gid { background:#1a2538; border:1px solid rgba(199,175,79,0.3); color:#fff; font-family:monospace; font-size:14px; padding:7px 12px; border-radius:4px; width:180px; }
#gen-btn { background:#c7af4f; color:#0a0e1a; font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:3px; padding:8px 22px; border:none; border-radius:4px; cursor:pointer; }
#gen-btn:hover { background:#f0d060; }
#status { font-size:11px; color:rgba(255,255,255,0.4); font-family:monospace; }
#thumb { width:1280px; height:720px; position:relative; overflow:hidden; background:#060a12; z-index:1; }
.tbg { position:absolute; inset:0; }
.tbg-static { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(0.4) saturate(0.7); z-index:0; }
.tfloor { position:absolute; bottom:0; left:0; right:0; height:300px; overflow:hidden; }
.tfloor::before { content:''; position:absolute; bottom:0; left:-30%; right:-30%; height:480px; background:repeating-linear-gradient(90deg,rgba(255,255,255,0.025) 0,rgba(255,255,255,0.025) 1px,transparent 1px,transparent 64px),repeating-linear-gradient(0deg,rgba(255,255,255,0.02) 0,rgba(255,255,255,0.02) 1px,transparent 1px,transparent 44px); transform:perspective(280px) rotateX(72deg); transform-origin:bottom center; }
.tfloor::after { content:''; position:absolute; bottom:0; left:0; right:0; height:180px; background:linear-gradient(0deg,#060a12 0%,transparent 100%); }
#panel-a { position:absolute; top:0; left:0; bottom:0; width:500px; clip-path:polygon(0 0,100% 0,68% 100%,0 100%); }
#panel-h { position:absolute; top:0; right:0; bottom:0; width:500px; clip-path:polygon(32% 0,100% 0,100% 100%,0 100%); }
.vl { position:absolute; top:0; bottom:0; width:1px; background:linear-gradient(180deg,transparent,rgba(199,175,79,0.5) 50%,transparent); }
#team-a { position:absolute; left:30px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:22px; }
#team-h { position:absolute; right:30px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:22px; flex-direction:row-reverse; }
.logo-wrap { width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; border:3px solid rgba(255,255,255,0.15); }
.logo-wrap img { width:120px; height:120px; object-fit:contain; }
.tcity { font-size:17px; font-weight:700; letter-spacing:6px; margin-bottom:2px; }
.tname { font-family:'Bebas Neue',sans-serif; font-size:76px; line-height:0.9; color:#fff; text-shadow:0 4px 30px rgba(0,0,0,0.8); }
.trec { font-size:14px; font-weight:600; letter-spacing:2px; margin-top:8px; opacity:0.55; }
.htext { text-align:right; }
.tctr { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:12px; z-index:10; }
.vs-ring { width:118px; height:118px; border-radius:50%; background:radial-gradient(circle,#1a2840,#0d1524); border:3px solid rgba(199,175,79,0.55); box-shadow:0 0 60px rgba(199,175,79,0.28); display:flex; align-items:center; justify-content:center; }
.vs-lbl { font-family:'Bebas Neue',sans-serif; font-size:46px; color:#c7af4f; letter-spacing:4px; }
.live-pill { display:flex; align-items:center; gap:8px; background:rgba(192,30,30,0.92); padding:6px 22px; border-radius:3px; }
.live-dot { width:8px; height:8px; border-radius:50%; background:#fff; }
.live-txt { font-family:'Bebas Neue',sans-serif; font-size:17px; color:#fff; letter-spacing:5px; }
#tip-time { font-family:'Bebas Neue',sans-serif; font-size:34px; color:#c7af4f; letter-spacing:4px; }
#game-sub { font-size:13px; font-weight:600; color:rgba(255,255,255,0.38); letter-spacing:4px; text-align:center; }
.brand { position:absolute; top:22px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.72); border:1px solid rgba(199,175,79,0.45); color:#c7af4f; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:8px; padding:6px 24px; border-radius:3px; white-space:nowrap; }
#game-tag { position:absolute; top:64px; left:50%; transform:translateX(-50%); color:rgba(199,175,79,0.65); font-size:11px; font-weight:700; letter-spacing:4px; white-space:nowrap; }
#copy-wrap { background:#111827; border-top:2px solid rgba(199,175,79,0.2); padding:20px; display:flex; gap:16px; position:relative; z-index:999; }
.ccol { display:flex; flex-direction:column; gap:8px; flex:1; }
.ccol.wide { flex:2; }

.cbox { background:#0d1524; border:1px solid rgba(199,175,79,0.15); border-radius:4px; padding:12px; font-family:Arial,sans-serif; font-size:12px; color:rgba(255,255,255,0.8); line-height:1.6; white-space:pre-wrap; min-height:80px; }
.cbtn { background:rgba(199,175,79,0.15); border:1px solid rgba(199,175,79,0.3); color:#c7af4f; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:2px; padding:6px 16px; border-radius:3px; cursor:pointer; align-self:flex-start; }
.cbtn:hover { background:rgba(199,175,79,0.25); }

/* SEO Status Bar */
.seo-bar { display:flex; align-items:center; gap:8px; padding:8px 14px; border-radius:4px; margin-top:8px; font-family:Arial,sans-serif; font-size:12px; cursor:pointer; }
.seo-bar.all-pass { background:rgba(46,204,113,0.1); border:1px solid rgba(46,204,113,0.3); color:#2ecc71; }
.seo-bar.has-warn { background:rgba(243,156,18,0.1); border:1px solid rgba(243,156,18,0.3); color:#f39c12; }
.seo-bar.has-fail { background:rgba(231,76,60,0.1); border:1px solid rgba(231,76,60,0.3); color:#e74c3c; }
.seo-bar-icon { font-size:14px; font-weight:900; }

.seo-issues { background:#0d1524; border:1px solid rgba(199,175,79,0.1); border-radius:4px; padding:10px 14px; margin-top:4px; display:none; }
.seo-issues.show { display:block; }
.seo-issue-row { display:flex; align-items:center; gap:8px; padding:4px 0; font-size:11px; font-family:Arial,sans-serif; border-bottom:1px solid rgba(255,255,255,0.04); }

.seo-badge { font-size:9px; font-weight:900; padding:2px 6px; border-radius:2px; flex-shrink:0; }
.seo-badge.fail { background:rgba(231,76,60,0.2); color:#e74c3c; }
.seo-badge.warn { background:rgba(243,156,18,0.2); color:#f39c12; }

<script>
function g(id) { return document.getElementById(id); }

function doCopy(id) {
  var el = g(id);
  var ta = document.createElement('textarea');
  ta.value = el.textContent;
  document.body.appendChild(ta);
  ta.select();
  document.execCommand('copy');
  document.body.removeChild(ta);
  el.style.borderColor = '#c7af4f';
  setTimeout(function() { el.style.borderColor = ''; }, 800);
}

function fmtTime(str) {
  var d = new Date(str);
  var h = d.getHours(); var m = d.getMinutes();
  var ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + (m < 10 ? '0' + m : m) + ' ' + ap + ' ET';
}

function hexRgb(hex) {
  hex = (hex || '').replace('#', '');
  if (hex.length !== 6) return '100,100,100';
  return parseInt(hex.slice(0,2),16) + ',' + parseInt(hex.slice(2,4),16) + ',' + parseInt(hex.slice(4,6),16);
}

function doGenerate() {
  var gameId = g('gid').value.trim();
  if (!gameId) return;
  g('status').textContent = 'Fetching game ' + gameId + '...';
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=' + gameId, true);
  xhr.timeout = 10000;
  xhr.onload = function() {
    if (xhr.status !== 200) { g('status').textContent = 'ESPN error ' + xhr.status; return; }
    try {
      var data = JSON.parse(xhr.responseText);
      renderGame(data);
    } catch(e) {
      g('status').textContent = 'Parse error: ' + e.message;
    }
  };
  xhr.onerror = function() { g('status').textContent = 'Network error'; };
  xhr.ontimeout = function() { g('status').textContent = 'Timeout'; };
  xhr.send();
}

function renderGame(data) {
  var hc = data.header && data.header.competitions && data.header.competitions[0];
  var comps = (hc && hc.competitors) || [];
  var away = {team:{}}, home = {team:{}};
  for (var i = 0; i < comps.length; i++) {
    if (comps[i].homeAway === 'away') away = comps[i];
    if (comps[i].homeAway === 'home') home = comps[i];
  }

  var bst = (data.boxscore && data.boxscore.teams) || [];
  var aColor = '1d428a', hColor = 'c41311';
  var aAbbr = (away.team && away.team.abbreviation) || 'AWAY';
  var hAbbr = (home.team && home.team.abbreviation) || 'HOME';
  for (var t = 0; t < bst.length; t++) {
    var bt = bst[t].team || {};
    if (bt.abbreviation === aAbbr && bt.color) aColor = bt.color;
    if (bt.abbreviation === hAbbr && bt.color) hColor = bt.color;
  }

  g('panel-a').style.background = 'linear-gradient(120deg,#' + aColor + '66 0%,#' + aColor + '22 60%,transparent 100%)';
  g('panel-h').style.background = 'linear-gradient(240deg,#' + hColor + '66 0%,#' + hColor + '22 60%,transparent 100%)';
  g('tbg').style.background = 'radial-gradient(ellipse 70% 90% at 15% 50%,rgba(' + hexRgb(aColor) + ',0.25) 0%,transparent 60%),radial-gradient(ellipse 70% 90% at 85% 50%,rgba(' + hexRgb(hColor) + ',0.2) 0%,transparent 60%),transparent';

  var aLoc = (away.team && away.team.location) || '';
  var aNick = (away.team && away.team.name) || '';
  var aRec = (away.records && away.records[0] && away.records[0].summary) || '';
  g('a-city').textContent = aLoc.toUpperCase();
  g('a-city').style.color = 'rgba(' + hexRgb(aColor) + ',0.8)';
  g('a-name').textContent = aNick.toUpperCase();
  g('a-rec').textContent = aRec;
  g('a-logo').src = 'https://a.espncdn.com/i/teamlogos/nba/500/' + aAbbr.toLowerCase() + '.png';

  var hLoc = (home.team && home.team.location) || '';
  var hNick = (home.team && home.team.name) || '';
  var hRec = (home.records && home.records[0] && home.records[0].summary) || '';
  g('h-city').textContent = hLoc.toUpperCase();
  g('h-city').style.color = 'rgba(' + hexRgb(hColor) + ',0.8)';
  g('h-name').textContent = hNick.toUpperCase();
  g('h-rec').textContent = hRec;
  g('h-logo').src = 'https://a.espncdn.com/i/teamlogos/nba/500/' + hAbbr.toLowerCase() + '.png';

  var gi = data.gameInfo || {};
  var venue = (gi.venue && gi.venue.fullName) || '';
  var city = (gi.venue && gi.venue.address && gi.venue.address.city) || '';
  g('tip-time').textContent = hc && hc.date ? fmtTime(hc.date) : '-- ET';
  g('game-sub').textContent = venue.toUpperCase() + (city ? ' - ' + city.toUpperCase() : '');
  g('game-tag').textContent = 'NBA - ' + (hc && hc.date ? new Date(hc.date).toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'}).toUpperCase() : '');

  var injData = data.injuries || [];
  var aOuts = [], hOuts = [];
  for (var ii = 0; ii < injData.length; ii++) {
    var injT = injData[ii];
    var tAb = (injT.team && injT.team.abbreviation) || '';
    var ps = injT.injuries || [];
    for (var ji = 0; ji < ps.length; ji++) {
      if ((ps[ji].status || '').toLowerCase() === 'out') {
        var pn = (ps[ji].athlete && ps[ji].athlete.shortName) || '';
        if (tAb === aAbbr) aOuts.push(pn);
        if (tAb === hAbbr) hOuts.push(pn);
      }
    }
  }

  buildCopy(data, aAbbr, hAbbr, aRec, hRec, venue, city, hc, aOuts, hOuts);
  g('status').textContent = 'Done! Screenshot the thumbnail above.';
}


function runSeoCheck(title, desc, opts) {
  opts = opts || {};
  var checks = [];
  var tLen = (title || '').length;
  var dLen = (desc || '').length;
  var firstLine = (desc || '').split('\n')[0] || '';
  var hashCount = ((desc || '').match(/#\w+/g) || []).length;
  var hasTimestamps = (desc || '').indexOf('00:00') > -1;
  var hasCTA = (desc || '').toLowerCase().indexOf('subscribe') > -1;

  checks.push({ label:'Title length', pass:tLen<=60, warn:tLen>60&&tLen<=100, fail:tLen>100,
    msg:tLen<=60?'Perfect ('+tLen+' chars)':tLen<=100?'OK but shorter is better ('+tLen+' chars)':'Too long, trim to under 100 ('+tLen+' chars)' });

  if (opts.teams && opts.teams.length >= 2) {
    var both = title.indexOf(opts.teams[0])>-1 && title.indexOf(opts.teams[1])>-1;
    checks.push({ label:'Names in title', pass:both, fail:!both,
      msg:both?'Both names found':'Missing: '+opts.teams.join(' / ') });
  }

  checks.push({ label:'First line keywords', pass:firstLine.length>=40, warn:firstLine.length>=20&&firstLine.length<40, fail:firstLine.length<20,
    msg:firstLine.length>=40?'Good ('+firstLine.length+' chars)':'First line too short, add keywords' });

  checks.push({ label:'Timestamps', pass:hasTimestamps, fail:!hasTimestamps,
    msg:hasTimestamps?'Timestamps included':'Add timestamps (00:00, 12:00 etc)' });

  checks.push({ label:'Hashtags', pass:hashCount>=8&&hashCount<=20, warn:hashCount>0&&(hashCount<8||hashCount>20), fail:hashCount===0,
    msg:hashCount+' hashtags '+(hashCount>=8&&hashCount<=20?'-- ideal':'-- aim for 8-20') });

  checks.push({ label:'Subscribe CTA', pass:hasCTA, fail:!hasCTA,
    msg:hasCTA?'CTA present':'Add a subscribe call to action' });

  checks.push({ label:'Description length', pass:dLen>=300, warn:dLen>=100&&dLen<300, fail:dLen<100,
    msg:dLen+' chars '+(dLen>=500?'-- great':dLen>=300?'-- good':'-- add more detail') });

  var failures=checks.filter(function(c){return c.fail;});
  var warnings=checks.filter(function(c){return c.warn&&!c.fail;});
  var passes=checks.filter(function(c){return !c.fail&&!c.warn;});
  return {checks:checks,failures:failures,warnings:warnings,passes:passes};
}

function renderSeoBar(containerId, title, desc, opts) {
  var el = document.getElementById(containerId);
  if (!el) return;
  var r = runSeoCheck(title, desc, opts);
  var f=r.failures.length, w=r.warnings.length, p=r.passes.length;
  var cls = f>0?'has-fail':w>0?'has-warn':'all-pass';
  var lbl = f>0?'ISSUES FOUND':w>0?'REVIEW SUGGESTED':'ALL CHECKS PASSED';
  var msg = f>0?f+' thing'+(f>1?'s':'')+' to fix':w>0?w+' suggestion'+(w>1?'s':''):'Good to publish!';
  var issHtml='';
  if(f>0||w>0){
    r.checks.forEach(function(c){
      if(c.fail||c.warn){
        issHtml+='<div class="seo-issue-row"><span class="seo-badge '+(c.fail?'fail':'warn')+'">'+(c.fail?'FIX':'TIP')+'</span><span>'+c.label+' -- '+c.msg+'</span></div>';
      }
    });
  }
  el.innerHTML='<div class="seo-bar '+cls+'" onclick="var i=document.getElementById(\''+containerId+'-iss\');if(i)i.classList.toggle(\'show\')">'
    +'<span class="seo-bar-icon">'+(f>0?'!!':w>0?'i':'OK')+'</span>'
    +'<span class="seo-bar-txt">SEO: '+lbl+' -- '+msg+'</span>'
    +(f>0||w>0?'<span class="seo-bar-detail">click for details</span>':'')
    +'</div>'
    +(issHtml?'<div class="seo-issues" id="'+containerId+'-iss">'+issHtml+'</div>':'');
}

function buildCopy(data, aAbbr, hAbbr, aRec, hRec, venue, city, hc, aOuts, hOuts) {
  var awayName = g('a-city').textContent + ' ' + g('a-name').textContent;
  var homeName = g('h-city').textContent + ' ' + g('h-name').textContent;
  var dateStr = hc && hc.date ? new Date(hc.date).toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'}) : '';
  var timeStr = hc && hc.date ? fmtTime(hc.date) : '';
  var aL = SEASON_LEADERS[aAbbr];
  var hL = SEASON_LEADERS[hAbbr];

  // SEO Title - searchable terms first, under 60 chars ideal
  var titleBase = awayName + ' vs ' + homeName;
  var title = titleBase + ' | NBA Live Stream ' + dateStr;
  if (title.length > 100) title = title.slice(0, 97) + '...';
  g('c-title').textContent = title;

  var pc = data.pickcenter && data.pickcenter[0];
  var spread = pc ? (pc.details || '') : '';
  var ou = pc ? ('O/U ' + (pc.overUnder || '')) : '';
  var ss = data.seasonseries && data.seasonseries[0];
  var series = (ss && ss.summary) || '';

  // SEO Description - keyword-rich first 2 lines, then details
  var desc = '';
  // First 2 lines = most important for SEO (shown before "show more")
  desc += awayName + ' vs ' + homeName + ' NBA Live Coverage -- ' + dateStr + '\n';
  desc += 'Watch live at ' + timeStr + ' ET | ' + venue + (city ? ', ' + city : '') + '\n';
  desc += '\n';
  // Key player info
  if (aL) desc += aAbbr + ' | ' + aL.name + ' ' + aL.ppg + ' PPG  ' + aL.rpg + ' RPG  ' + aL.apg + ' APG\n';
  if (hL) desc += hAbbr + ' | ' + hL.name + ' ' + hL.ppg + ' PPG  ' + hL.rpg + ' RPG  ' + hL.apg + ' APG\n';
  desc += '\n';
  if (aOuts.length) desc += 'INJURIES OUT -- ' + aAbbr + ': ' + aOuts.join(', ') + '\n';
  if (hOuts.length) desc += 'INJURIES OUT -- ' + hAbbr + ': ' + hOuts.join(', ') + '\n';
  if (series) desc += 'Season Series: ' + series + '\n';
  if (spread) desc += 'Vegas Line: ' + spread + '  ' + ou + '\n';
  desc += '\n';
  desc += 'ClipzWorld News covers the NBA live every night. Subscribe for live game coverage, daily sports news and world news every weekday at noon ET.\n';
  desc += '\n';
  // Timestamps placeholder
  desc += '00:00 Pre-game\n';
  desc += '12:00 1st Quarter\n';
  desc += '24:00 2nd Quarter\n';
  desc += '36:00 Halftime\n';
  desc += '48:00 3rd Quarter\n';
  desc += '1:00:00 4th Quarter\n';
  desc += '\n';
  // Hashtags - specific first, broad last
  var tags = '#' + awayName.split(' ').join('') + ' #' + homeName.split(' ').join('') + ' #' + aAbbr + ' #' + hAbbr;
  tags += ' #NBA #NBALive #Basketball #NBAgame #NBAToday #ClipzWorldNews #LiveSports #NBAHighlights';
  desc += tags;

  g('c-desc').textContent = desc;
  // SEO check
  var seoEl = document.getElementById('seo-status');
  if (!seoEl) {
    seoEl = document.createElement('div');
    seoEl.id = 'seo-status';
    var descBox = document.getElementById('c-desc');
    if (descBox && descBox.parentNode) descBox.parentNode.appendChild(seoEl);
  }
  renderSeoBar('seo-status', g('c-title').textContent, g('c-desc').textContent, {teams:[awayName,homeName]});
}

g('gen-btn').addEventListener('click', doGenerate);
g('gid').addEventListener('keydown', function(e) { if (e.key === 'Enter') doGenerate(); });
g('copy-title-btn').addEventListener('click', function() { doCopy('c-title'); });
g('copy-desc-btn').addEventListener('click', function() { doCopy('c-desc'); });
</script>

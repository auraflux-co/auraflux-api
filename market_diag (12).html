<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>body{background:#111;color:#0f0;font-family:monospace;font-size:11px;padding:15px;}
h3{color:#f39c12;margin:8px 0 4px;}pre{background:#1a1a2e;padding:8px;border-radius:4px;white-space:pre-wrap;word-break:break-all;}</style>
</head><body>
<h3>FMP Commodity + Extra Symbol Test</h3>
<button onclick="run()" style="background:#c7af4f;color:#000;font-weight:900;padding:6px 14px;border:none;cursor:pointer">TEST</button>
<div id="out" style="margin-top:12px">Click TEST</div>
<script>
var KEY='rJPVYlHnpcjxuOLoR1phvBz7e27UMMSq';
var BASE='https://financialmodelingprep.com/stable/quote?apikey='+KEY+'&symbol=';
function run(){
  var out=''; var done=0; var total=3;
  function fin(l,s,t){ out+='<h3>'+l+' ('+s+')</h3><pre>'+t+'</pre>'; done++; if(done>=total) document.getElementById('out').innerHTML=out; }

  // Test commodity symbols
  setTimeout(function(){
    var xhr=new XMLHttpRequest();
    xhr.open('GET',BASE+'GCUSD,SIUSD,CLUSD,NGUSD,HGUSD,PLUSD,PAUSD',true);
    xhr.timeout=8000;
    xhr.onload=function(){
      try{
        var d=JSON.parse(xhr.responseText);
        if(Array.isArray(d)&&d.length) fin('Commodities',xhr.status,d.map(function(q){return q.symbol+': $'+q.price+' ('+parseFloat(q.changePercentage||0).toFixed(2)+'%)';}).join('\n'));
        else fin('Commodities',xhr.status,xhr.responseText.slice(0,200));
      }catch(e){fin('Commodities',xhr.status,xhr.responseText.slice(0,200));}
    };
    xhr.onerror=xhr.ontimeout=function(){fin('Commodities','ERR','failed');};
    xhr.send();
  },0);

  // Test more stocks
  setTimeout(function(){
    var xhr=new XMLHttpRequest();
    xhr.open('GET',BASE+'ORCL,CRM,UBER,ABNB,SPOT,COIN,RBLX,SNAP,TWTR,HOOD,SQ,SHOP,ZM,PLTR,RIVN',true);
    xhr.timeout=8000;
    xhr.onload=function(){
      try{
        var d=JSON.parse(xhr.responseText);
        if(Array.isArray(d)&&d.length) fin('Extra Stocks',xhr.status,d.map(function(q){return q.symbol+': $'+q.price+' ('+parseFloat(q.changePercentage||0).toFixed(2)+'%)';}).join('\n'));
        else fin('Extra Stocks',xhr.status,xhr.responseText.slice(0,200));
      }catch(e){fin('Extra Stocks',xhr.status,xhr.responseText.slice(0,200));}
    };
    xhr.onerror=xhr.ontimeout=function(){fin('Extra Stocks','ERR','failed');};
    xhr.send();
  },1500);

  // Test ETF + crypto extras
  setTimeout(function(){
    var xhr=new XMLHttpRequest();
    xhr.open('GET',BASE+'SPY,QQQ,GLD,SLV,USO,TLT,VXX',true);
    xhr.timeout=8000;
    xhr.onload=function(){
      try{
        var d=JSON.parse(xhr.responseText);
        if(Array.isArray(d)&&d.length) fin('ETFs+Proxies',xhr.status,d.map(function(q){return q.symbol+': $'+q.price+' ('+parseFloat(q.changePercentage||0).toFixed(2)+'%)';}).join('\n'));
        else fin('ETFs+Proxies',xhr.status,xhr.responseText.slice(0,200));
      }catch(e){fin('ETFs+Proxies',xhr.status,xhr.responseText.slice(0,200));}
    };
    xhr.onerror=xhr.ontimeout=function(){fin('ETFs+Proxies','ERR','failed');};
    xhr.send();
  },3000);
}
</script></body></html>

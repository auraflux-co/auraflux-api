<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:1920px; height:64px; background:transparent; overflow:hidden; font-family:Arial,sans-serif; }
.ticker-wrap { width:1920px; height:64px; background:linear-gradient(90deg,#0d0119,#120424,#0d0119); border-top:2px solid #9146ff; border-bottom:2px solid #9146ff; display:flex; align-items:stretch; overflow:hidden; }
.bookend { flex-shrink:0; width:220px; background:linear-gradient(90deg,#22304b,#1a2538); border-right:3px solid #c7af4f; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; z-index:10; }
.b-title { font-family:'Arial Black',Arial,sans-serif; font-size:12px; font-weight:900; color:#c7af4f; letter-spacing:3px; }
.b-sub { font-size:9px; font-weight:700; color:rgba(255,255,255,0.4); letter-spacing:2px; }
.live-row { display:flex; align-items:center; gap:5px; margin-top:1px; }
.dot { width:7px; height:7px; border-radius:50%; background:#e74c3c; animation:pulse 1.2s ease-in-out infinite; }
.live-txt { font-size:9px; font-weight:900; color:#e74c3c; letter-spacing:2px; }
.scroll-outer { flex:1; overflow:hidden; }
.scroll-track { display:flex; align-items:center; height:64px; white-space:nowrap; will-change:transform; }

/* Stream items */
.stream-item { display:inline-flex; align-items:center; gap:10px; padding:0 20px; flex-shrink:0; border-right:1px solid rgba(145,70,255,0.15); }
.stream-avatar { width:36px; height:36px; border-radius:50%; object-fit:cover; border:2px solid #9146ff; flex-shrink:0; background:#1a0a2e; }
.stream-info { display:flex; flex-direction:column; gap:2px; }
.stream-name { font-size:12px; font-weight:900; color:#9146ff; letter-spacing:1px; }
.stream-title { font-size:11px; font-weight:600; color:rgba(255,255,255,0.8); max-width:280px; overflow:hidden; text-overflow:ellipsis; }
.stream-game { font-size:9px; color:rgba(255,255,255,0.35); letter-spacing:1px; }
.stream-viewers { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
.viewer-count { font-size:13px; font-weight:900; color:#fff; font-family:monospace; }
.viewer-lbl { font-size:8px; color:rgba(255,255,255,0.3); letter-spacing:1px; }
.live-indicator { display:inline-block; background:#e74c3c; color:#fff; font-size:8px; font-weight:900; padding:2px 5px; border-radius:2px; letter-spacing:1px; }

/* Divider */
.cat-div { display:inline-flex; align-items:center; padding:0 16px; flex-shrink:0; }
.cat-div-lbl { font-size:8px; font-weight:900; color:rgba(145,70,255,0.4); letter-spacing:3px; background:rgba(145,70,255,0.08); padding:3px 8px; border-radius:2px; border:1px solid rgba(145,70,255,0.15); }

@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.3;} }
</style>
</head>
<body>
<div class="ticker-wrap">
  <div class="bookend">
    <div class="b-title">CLIPZWORLD</div>
    <div class="b-title" style="margin-top:-2px;">NEWS</div>
    <div class="live-row" style="margin-top:4px;"><div class="dot"></div><div class="live-txt">LIVE</div></div>
  </div>
  <div class="scroll-outer">
    <div class="scroll-track" id="track">
      <div class="stream-item"><div class="stream-info"><div class="stream-name">Loading Twitch...</div></div></div>
    </div>
  </div>
</div>

<script>
var CLIENT_ID = 'nghzr9gr22acplvunvkm5c13784nit';
var TOKEN = 'shcz8knnxikq8pz8rogp7nli8e84qm'; // hardcoded - re-auth if expired
var trackEl = document.getElementById('track');
var scrollX = 0, animId, lastTime = null;
var PX_PER_SEC = 50;

function fmtNum(n) {
  if (n >= 1000000) return (n/1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n/1000).toFixed(1) + 'K';
  return n.toString();
}

function tw(path, cb) {
  if (!TOKEN) { cb({data:[]}); return; }
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://api.twitch.tv/helix/' + path, true);
  xhr.setRequestHeader('Client-Id', CLIENT_ID);
  xhr.setRequestHeader('Authorization', 'Bearer ' + TOKEN);
  xhr.timeout = 10000;
  xhr.onload = function() { try { cb(JSON.parse(xhr.responseText)); } catch(e) { cb({data:[]}); } };
  xhr.onerror = xhr.ontimeout = function() { cb({data:[]}); };
  xhr.send();
}

function buildTicker(streams, topClips) {
  var html = '';

  if (streams && streams.length) {
    html += '<div class="cat-div"><div class="cat-div-lbl">LIVE NOW</div></div>';
    streams.forEach(function(s) {
      var avatar = s.thumbnail_url ? s.thumbnail_url.replace('{width}','40').replace('{height}','40') : '';
      html += '<div class="stream-item">'
        + (avatar ? '<img class="stream-avatar" src="' + avatar + '">' : '<div class="stream-avatar"></div>')
        + '<div class="stream-info">'
        + '<div class="stream-name">' + s.user_name + ' <span class="live-indicator">LIVE</span></div>'
        + '<div class="stream-title">' + (s.title || '').slice(0, 50) + '</div>'
        + '<div class="stream-game">' + (s.game_name || '') + '</div>'
        + '</div>'
        + '<div class="stream-viewers"><div class="viewer-count">' + fmtNum(s.viewer_count) + '</div><div class="viewer-lbl">VIEWERS</div></div>'
        + '</div>';
    });
  }

  if (topClips && topClips.length) {
    html += '<div class="cat-div"><div class="cat-div-lbl">TOP CLIPS</div></div>';
    topClips.forEach(function(c) {
      html += '<div class="stream-item">'
        + '<div class="stream-info">'
        + '<div class="stream-name">' + (c.broadcaster_name || '') + '</div>'
        + '<div class="stream-title">' + (c.title || '').slice(0, 50) + '</div>'
        + '<div class="stream-game">' + fmtNum(c.view_count || 0) + ' views · ' + (c.game_name || '') + '</div>'
        + '</div></div>';
    });
  }

  if (!html) { html = '<div class="stream-item"><div class="stream-info"><div class="stream-name" style="color:rgba(255,255,255,0.3)">Connect Twitch to see live streams</div></div></div>'; }

  trackEl.innerHTML = html + html;
  setTimeout(function() {
    if (!animId) animId = requestAnimationFrame(animate);
  }, 100);
}

function animate(ts) {
  if (lastTime === null) lastTime = ts;
  var delta = ts - lastTime;
  lastTime = ts;
  if (delta > 100) delta = 100; // cap for tab switching
  var hw = trackEl.scrollWidth / 2;
  scrollX += PX_PER_SEC * (delta / 1000);
  if (scrollX >= hw) scrollX = 0;
  trackEl.style.transform = 'translateX(-' + scrollX + 'px)';
  animId = requestAnimationFrame(animate);
}

function loadData() {
  var streams = null, clips = null;
  var done = 0;
  function check() {
    done++;
    if (done >= 2) buildTicker(streams, clips);
  }
  // Top English live streams
  tw('streams?first=20&language=en', function(d) { streams = d.data || []; check(); });
  // Top clips from sports today
  var yesterday = new Date(Date.now() - 86400000).toISOString();
  tw('clips?game_id=518203&first=10&started_at=' + yesterday, function(d) { clips = d.data || []; check(); });
}

loadData();

setInterval(function() {
  lastTime = null;
  loadData();
}, 120000); // refresh every 2 min
</script>
</body>
</html>

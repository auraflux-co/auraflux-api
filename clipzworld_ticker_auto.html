<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ClipzWorld Live Ticker — Auto</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: transparent;
    font-family: 'Arial Black', Arial, sans-serif;
    overflow: hidden;
    width: 1920px;
    height: 64px;
  }

  .ticker-wrap {
    width: 1920px;
    height: 64px;
    background: #111827;
    border-top: 3px solid #c7af4f;
    display: flex;
    align-items: stretch;
    overflow: hidden;
  }

  .brand-block {
    background: #c7af4f;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
    flex-shrink: 0;
    flex-direction: column;
    gap: 2px;
    min-width: 110px;
  }
  .brand-title { font-size: 11px; font-weight: 900; color: #111827; letter-spacing: 2px; }
  .brand-live { display: flex; align-items: center; gap: 4px; font-size: 9px; font-weight: 700; color: #111827; letter-spacing: 1px; }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: #c0392b; animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .scroll-outer { flex: 1; overflow: hidden; position: relative; }
  .scroll-track {
    display: flex;
    align-items: center;
    white-space: nowrap;
    height: 64px;
    animation: scroll-left var(--scroll-dur, 80s) linear infinite;
  }
  @keyframes scroll-left {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  .league-div {
    display: inline-flex;
    align-items: center;
    height: 64px;
    padding: 0 12px;
    border-right: 2px solid rgba(199,175,79,0.25);
    flex-shrink: 0;
  }
  .league-lbl { font-size: 9px; font-weight: 900; color: rgba(199,175,79,0.55); letter-spacing: 2px; }

  .game-chip {
    display: inline-flex;
    align-items: center;
    height: 64px;
    border-right: 1px solid rgba(199,175,79,0.1);
    padding: 0 12px;
    flex-shrink: 0;
    gap: 6px;
    transition: background .15s;
  }
  .game-chip:hover { background: rgba(199,175,79,0.05); }

  .team-col {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    min-width: 52px;
  }
  .team-col.away { align-items: flex-end; }
  .team-col.home { align-items: flex-start; }

  .t-abbr { font-size: 13px; font-weight: 900; color: #fff; letter-spacing: .5px; line-height: 1; }
  .t-abbr.winner { color: #c7af4f; }
  .t-record { font-size: 8px; color: rgba(255,255,255,0.3); font-family: Arial, sans-serif; line-height: 1; }

  .logo-wrap {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    overflow: hidden;
    border: 1.5px solid rgba(255,255,255,0.12);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .logo-wrap img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    padding: 3px;
    background: #fff;
  }
  .logo-fallback {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 8px;
    font-weight: 900;
    color: #fff;
  }

  .score-mid {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-width: 70px;
    gap: 3px;
  }
  .score-row { display: flex; align-items: center; gap: 5px; }
  .sc { font-size: 24px; font-weight: 900; color: #fff; line-height: 1; min-width: 26px; text-align: center; }
  .sc.win { color: #c7af4f; }
  .sc-sep { font-size: 14px; color: rgba(199,175,79,0.4); }
  .game-state { font-size: 9px; font-weight: 700; font-family: Arial, sans-serif; letter-spacing: .3px; text-align: center; }
  .st-live { color: #e74c3c; }
  .st-final { color: rgba(255,255,255,0.3); }
  .st-pre { color: #27ae60; }
  .st-half { color: #f39c12; }

  /* Status bar */
  .status-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.7);
    color: rgba(199,175,79,0.7);
    font-size: 9px;
    font-family: Arial, sans-serif;
    padding: 2px 8px;
    letter-spacing: .5px;
    display: flex;
    justify-content: space-between;
  }

  .no-games {
    display: inline-flex;
    align-items: center;
    height: 64px;
    padding: 0 24px;
    font-size: 13px;
    color: rgba(199,175,79,0.5);
    font-family: Arial, sans-serif;
  }
</style>
</head>
<body>

<div class="status-bar">
  <span id="status-msg">Connecting to ESPN...</span>
  <span id="last-update">—</span>
</div>

<div class="ticker-wrap">
  <div class="brand-block">
    <div class="brand-title">CLIPZWORLD</div>
    <div class="brand-live"><div class="live-dot"></div>LIVE</div>
  </div>
  <div class="scroll-outer">
    <div class="scroll-track" id="ticker-track">
      <div class="no-games">Loading scores...</div>
    </div>
  </div>
</div>

<script>
const LEAGUES = [
  { key:'nba',    label:'NBA',         url:'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard' },
  { key:'ncaam',  label:'NCAA MEN',    url:'https://site.api.espn.com/apis/site/v2/sports/basketball/mens-college-basketball/scoreboard' },
  { key:'ncaaw',  label:'NCAA WOMEN',  url:'https://site.api.espn.com/apis/site/v2/sports/basketball/womens-college-basketball/scoreboard' },
];

let allGames = {};
let fetchErrors = 0;

function parseGame(ev, leagueKey){
  try {
    const comp = ev.competitions[0];
    const competitors = comp.competitors;
    const home = competitors.find(c=>c.homeAway==='home');
    const away = competitors.find(c=>c.homeAway==='away');
    if(!home||!away) return null;

    const status = ev.status;
    const stType = status.type.name;
    const period = status.period || 0;
    const clock  = status.displayClock || '';

    let stateLabel='';
    let stateClass='st-pre';

    if(stType==='STATUS_FINAL'||stType==='STATUS_FULL_TIME'){
      stateLabel='FINAL'; stateClass='st-final';
    } else if(stType==='STATUS_HALFTIME'){
      stateLabel='HALFTIME'; stateClass='st-half';
    } else if(stType==='STATUS_IN_PROGRESS'){
      const pLabel = leagueKey==='nba' ? `Q${period}` : (period===1?'1H':'2H');
      stateLabel=`${pLabel} ${clock}`; stateClass='st-live';
    } else {
      const d=new Date(ev.date);
      stateLabel=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit',timeZoneName:'short'});
      stateClass='st-pre';
    }

    const awayScore = parseInt(away.score)||0;
    const homeScore = parseInt(home.score)||0;
    const isFinal = stType==='STATUS_FINAL'||stType==='STATUS_FULL_TIME';

    return {
      id: ev.id,
      league: leagueKey,
      awayAbbr: away.team.abbreviation,
      awayName: away.team.shortDisplayName||away.team.displayName,
      awayLogo: away.team.logo||'',
      awayColor: '#'+( away.team.color||'333333'),
      awayScore,
      awayRecord: away.records?.[0]?.summary||'',
      homeAbbr: home.team.abbreviation,
      homeName: home.team.shortDisplayName||home.team.displayName,
      homeLogo: home.team.logo||'',
      homeColor: '#'+(home.team.color||'333333'),
      homeScore,
      homeRecord: home.records?.[0]?.summary||'',
      stateLabel,
      stateClass,
      isFinal,
    };
  } catch(e){ return null; }
}

function logoHTML(url, abbr, color){
  if(url){
    return `<div class="logo-wrap" style="background:${color}">
      <img src="${url}" alt="${abbr}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
      <div class="logo-fallback" style="display:none;background:${color}">${abbr.slice(0,2)}</div>
    </div>`;
  }
  return `<div class="logo-wrap" style="background:${color}">
    <div class="logo-fallback">${abbr.slice(0,2)}</div>
  </div>`;
}

function gameChip(g){
  const awWin = g.isFinal && g.awayScore > g.homeScore;
  const hmWin = g.isFinal && g.homeScore > g.awayScore;
  return `<div class="game-chip">
    <div class="team-col away">
      <div class="t-abbr${awWin?' winner':''}">${g.awayAbbr}</div>
      <div class="t-record">${g.awayRecord}</div>
    </div>
    ${logoHTML(g.awayLogo, g.awayAbbr, g.awayColor)}
    <div class="score-mid">
      <div class="score-row">
        <span class="sc${awWin?' win':''}">${g.awayScore}</span>
        <span class="sc-sep">·</span>
        <span class="sc${hmWin?' win':''}">${g.homeScore}</span>
      </div>
      <div class="game-state ${g.stateClass}">${g.stateLabel}</div>
    </div>
    ${logoHTML(g.homeLogo, g.homeAbbr, g.homeColor)}
    <div class="team-col home">
      <div class="t-abbr${hmWin?' winner':''}">${g.homeAbbr}</div>
      <div class="t-record">${g.homeRecord}</div>
    </div>
  </div>`;
}

function buildTicker(){
  const track = document.getElementById('ticker-track');
  let html = '';
  let totalGames = 0;

  LEAGUES.forEach(lg=>{
    const games = allGames[lg.key]||[];
    if(!games.length) return;
    html += `<div class="league-div"><span class="league-lbl">${lg.label}</span></div>`;
    games.forEach(g=>{ html+=gameChip(g); totalGames++; });
  });

  if(!totalGames){
    html='<div class="no-games">No games scheduled today — check back later</div>';
    track.innerHTML=html;
    return;
  }

  // Duplicate for seamless loop
  const single=html;
  track.innerHTML=single+single;

  // Adjust scroll speed based on content width
  const dur = Math.max(60, totalGames * 12);
  track.style.setProperty('--scroll-dur', dur+'s');
  track.style.animation='none';
  track.offsetHeight;
  track.style.animation=`scroll-left ${dur}s linear infinite`;
}

async function fetchLeague(lg){
  try {
    const res = await fetch(lg.url, { cache:'no-store' });
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data = await res.json();
    const events = data.events||[];
    allGames[lg.key] = events
      .map(ev=>parseGame(ev,lg.key))
      .filter(Boolean);
    return true;
  } catch(e){
    console.warn(`Failed to fetch ${lg.key}:`, e);
    return false;
  }
}

async function fetchAll(){
  document.getElementById('status-msg').textContent='Fetching live scores...';
  const results = await Promise.all(LEAGUES.map(fetchLeague));
  const ok = results.filter(Boolean).length;
  fetchErrors = LEAGUES.length - ok;

  buildTicker();

  const now=new Date();
  const timeStr=now.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('last-update').textContent=`Updated ${timeStr}`;

  if(fetchErrors===0){
    document.getElementById('status-msg').textContent=
      `Live · ${Object.values(allGames).flat().length} games loaded · Auto-refreshes every 30s`;
  } else {
    document.getElementById('status-msg').textContent=
      `${ok}/${LEAGUES.length} leagues loaded · ${fetchErrors} failed (CORS issue — use OBS Browser Source)`;
  }
}

// Initial fetch
fetchAll();

// Auto-refresh every 30 seconds
setInterval(fetchAll, 30000);
</script>
</body>
</html>

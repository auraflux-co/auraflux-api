<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>body{background:#111;color:#0f0;font-family:monospace;font-size:11px;padding:15px;}
h3{color:#f39c12;margin:8px 0 4px;}pre{background:#1a1a1a;padding:8px;border-radius:4px;overflow-x:auto;white-space:pre-wrap;word-break:break-all;}</style>
</head><body>
<h3>FMP API Test</h3>
<input id="k" style="background:#1a2538;border:1px solid #c7af4f;color:#fff;padding:6px;font-family:monospace;width:320px" placeholder="Paste FMP API key">
<button onclick="run()" style="background:#c7af4f;color:#000;font-weight:900;padding:6px 14px;border:none;cursor:pointer;margin-left:8px">TEST</button>
<div id="out" style="margin-top:12px">Enter key and click TEST</div>
<script>
function run(){
  var KEY=document.getElementById('k').value.trim();
  if(!KEY) return;
  var BASE='https://financialmodelingprep.com/stable/';
  var out=''; var done=0; var total=4;
  function fin(l,s,t){ out+='<h3>'+l+' ('+s+')</h3><pre>'+t.slice(0,500)+'</pre>'; done++; if(done>=total) document.getElementById('out').innerHTML=out; }

  // Test 1: Batch quotes - indices + stocks
  var xhr1=new XMLHttpRequest();
  xhr1.open('GET',BASE+'quote?symbol=SPY,QQQ,DIA,IWM,AAPL,NVDA,TSLA,AMZN&apikey='+KEY,true);
  xhr1.timeout=10000;
  xhr1.onload=function(){
    try{
      var d=JSON.parse(xhr1.responseText);
      var arr=Array.isArray(d)?d:(d.quote||[]);
      fin('Batch Quote',xhr1.status,arr.map(function(q){return q.symbol+':$'+q.price+' ('+parseFloat(q.changesPercentage).toFixed(2)+'%)';}).join('\n'));
    }catch(e){ fin('Batch Quote',xhr1.status,xhr1.responseText.slice(0,300)); }
  };
  xhr1.onerror=xhr1.ontimeout=function(){ fin('Batch Quote','ERR','failed'); };
  xhr1.send();

  // Test 2: Sector ETFs
  setTimeout(function(){
    var xhr2=new XMLHttpRequest();
    xhr2.open('GET',BASE+'quote?symbol=XLK,XLE,XLF,XLV,XLI,XLY,XLRE&apikey='+KEY,true);
    xhr2.timeout=10000;
    xhr2.onload=function(){
      try{
        var d=JSON.parse(xhr2.responseText);
        var arr=Array.isArray(d)?d:[];
        fin('Sectors',xhr2.status,arr.map(function(q){return q.symbol+':'+parseFloat(q.changesPercentage).toFixed(2)+'%';}).join('\n'));
      }catch(e){ fin('Sectors',xhr2.status,xhr2.responseText.slice(0,200)); }
    };
    xhr2.onerror=xhr2.ontimeout=function(){ fin('Sectors','ERR','failed'); };
    xhr2.send();
  }, 1000);

  // Test 3: Commodities
  setTimeout(function(){
    var xhr3=new XMLHttpRequest();
    xhr3.open('GET',BASE+'quote?symbol=GCUSD,SIUSD,CLUSD&apikey='+KEY,true);
    xhr3.timeout=10000;
    xhr3.onload=function(){
      try{
        var d=JSON.parse(xhr3.responseText);
        var arr=Array.isArray(d)?d:[];
        fin('Commodities Gold/Silver/Oil',xhr3.status,arr.map(function(q){return q.symbol+':$'+q.price+' ('+parseFloat(q.changesPercentage||0).toFixed(2)+'%)';}).join('\n'));
      }catch(e){ fin('Commodities',xhr3.status,xhr3.responseText.slice(0,200)); }
    };
    xhr3.onerror=xhr3.ontimeout=function(){ fin('Commodities','ERR','failed'); };
    xhr3.send();
  }, 2000);

  // Test 4: Forex
  setTimeout(function(){
    var xhr4=new XMLHttpRequest();
    xhr4.open('GET',BASE+'forex/last?apikey='+KEY,true);
    xhr4.timeout=10000;
    xhr4.onload=function(){
      try{
        var d=JSON.parse(xhr4.responseText);
        var arr=Array.isArray(d)?d:[];
        var pairs=['EURUSD','USDJPY','GBPUSD'];
        var filtered=arr.filter(function(f){ return pairs.indexOf(f.ticker)>-1; });
        fin('Forex',xhr4.status,filtered.map(function(f){return f.ticker+':'+f.bid;}).join('\n')||JSON.stringify(arr[0]));
      }catch(e){ fin('Forex',xhr4.status,xhr4.responseText.slice(0,200)); }
    };
    xhr4.onerror=xhr4.ontimeout=function(){ fin('Forex','ERR','failed'); };
    xhr4.send();
  }, 3000);
}
</script></body></html>

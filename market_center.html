<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { width:530px; height:580px; background:#0d1424; border-radius:10px; overflow:hidden; font-family:'Arial Black',Arial,sans-serif; -webkit-font-smoothing:antialiased; }
.header { background:linear-gradient(90deg,#22304b,#1a2538); border-bottom:2px solid #c7af4f; padding:7px 14px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
.hdr-brand { font-size:11px; font-weight:900; color:#c7af4f; letter-spacing:3px; }
.hdr-title { font-size:11px; font-weight:700; color:rgba(255,255,255,0.7); letter-spacing:1px; text-align:center; flex:1; }
.hdr-right { display:flex; align-items:center; gap:8px; }
.hdr-status { font-size:9px; font-weight:900; letter-spacing:2px; padding:2px 8px; border-radius:2px; }
.st-open   { background:rgba(39,174,96,0.3);  color:#2ecc71; font-weight:900; }
.st-closed { background:rgba(192,57,43,0.3);  color:#e74c3c; font-weight:900; }
.st-pre    { background:rgba(243,156,18,0.3);  color:#f39c12; font-weight:900; }
.hdr-time  { font-size:9px; color:rgba(255,255,255,0.45); letter-spacing:1px; }

.indices { padding:8px 12px; border-bottom:1px solid rgba(199,175,79,0.1); }
.idx-row { display:flex; align-items:center; padding:5px 0; border-bottom:1px solid rgba(255,255,255,0.04); gap:8px; }
.idx-row:last-child { border-bottom:none; }
.idx-name  { font-size:11px; font-weight:900; color:#fff; letter-spacing:1px; min-width:72px; }
.idx-bar-bg { flex:1; height:4px; background:rgba(255,255,255,0.08); border-radius:2px; overflow:hidden; }
.idx-bar   { height:100%; border-radius:2px; transition:width 0.8s ease; width:50%; }
.idx-price { font-size:13px; font-weight:700; color:#fff; min-width:68px; text-align:right; font-family:Arial,sans-serif; }
.idx-chg   { font-size:10px; font-weight:700; min-width:90px; text-align:right; font-family:Arial,sans-serif; }
.up   { color:#27ae60; } .down { color:#e74c3c; }
.bar-up { background:#27ae60; } .bar-down { background:#e74c3c; }

.sec-lbl { font-size:8px; font-weight:900; color:rgba(199,175,79,0.55); letter-spacing:3px; padding:7px 12px 4px; }
.stocks-grid { display:grid; grid-template-columns:1fr 1fr; gap:1px; background:rgba(199,175,79,0.08); }
.stock-cell { background:#0d1424; padding:7px 12px; }
.stock-ticker { font-size:11px; font-weight:900; color:#fff; letter-spacing:1px; }
.stock-name   { font-size:8px; color:rgba(255,255,255,0.3); margin-bottom:2px; }
.stock-price  { font-size:14px; font-weight:700; color:#fff; font-family:Arial,sans-serif; }
.stock-chg    { font-size:10px; font-weight:700; font-family:Arial,sans-serif; }

.crypto-row { display:flex; border-top:1px solid rgba(199,175,79,0.1); }
.crypto-cell { flex:1; padding:7px 12px; border-right:1px solid rgba(199,175,79,0.08); }
.crypto-cell:last-child { border-right:none; }
.crypto-sym   { font-size:10px; font-weight:900; color:#c7af4f; letter-spacing:1px; }
.crypto-price { font-size:13px; font-weight:700; color:#fff; font-family:Arial,sans-serif; }
.crypto-sub   { font-size:9px; color:rgba(255,255,255,0.35); font-family:Arial,sans-serif; }

.mkt-clock { background:rgba(199,175,79,0.06); border-top:1px solid rgba(199,175,79,0.12); padding:5px 12px; display:flex; align-items:center; justify-content:space-between; }
.clk-item { display:flex; flex-direction:column; align-items:center; gap:1px; }
.clk-lbl  { font-size:7px; color:rgba(255,255,255,0.3); letter-spacing:2px; }
.clk-val  { font-size:11px; font-weight:900; color:#fff; font-family:Arial,sans-serif; letter-spacing:1px; }
.clk-sep  { width:1px; height:24px; background:rgba(199,175,79,0.15); }
</style>
</head>
<body>
<div class="header">
  <div class="hdr-brand">CLIPZWORLD NEWS</div>
  <div class="hdr-title" id="hdr-date">—</div>
  <div class="hdr-right">
    <div class="hdr-status st-closed" id="mkt-status">CLOSED</div>
  </div>
</div>

<div class="indices">
  <div class="idx-row">
    <div class="idx-name">S&P 500</div>
    <div class="idx-bar-bg"><div class="idx-bar" id="spy-bar"></div></div>
    <div class="idx-price" id="spy-price">—</div>
    <div class="idx-chg"   id="spy-chg">—</div>
  </div>
  <div class="idx-row">
    <div class="idx-name">NASDAQ</div>
    <div class="idx-bar-bg"><div class="idx-bar" id="qqq-bar"></div></div>
    <div class="idx-price" id="qqq-price">—</div>
    <div class="idx-chg"   id="qqq-chg">—</div>
  </div>
  <div class="idx-row">
    <div class="idx-name">DOW</div>
    <div class="idx-bar-bg"><div class="idx-bar" id="dia-bar"></div></div>
    <div class="idx-price" id="dia-price">—</div>
    <div class="idx-chg"   id="dia-chg">—</div>
  </div>
  <div class="idx-row">
    <div class="idx-name">RUSSELL</div>
    <div class="idx-bar-bg"><div class="idx-bar" id="iwm-bar"></div></div>
    <div class="idx-price" id="iwm-price">—</div>
    <div class="idx-chg"   id="iwm-chg">—</div>
  </div>
</div>

<div class="sec-lbl">KEY STOCKS</div>
<div class="stocks-grid">
  <div class="stock-cell">
    <div class="stock-ticker">AAPL</div>
    <div class="stock-name">Apple Inc.</div>
    <div class="stock-price" id="aapl-price">—</div>
    <div class="stock-chg"   id="aapl-chg">—</div>
  </div>
  <div class="stock-cell">
    <div class="stock-ticker">NVDA</div>
    <div class="stock-name">Nvidia</div>
    <div class="stock-price" id="nvda-price">—</div>
    <div class="stock-chg"   id="nvda-chg">—</div>
  </div>
  <div class="stock-cell">
    <div class="stock-ticker">TSLA</div>
    <div class="stock-name">Tesla</div>
    <div class="stock-price" id="tsla-price">—</div>
    <div class="stock-chg"   id="tsla-chg">—</div>
  </div>
  <div class="stock-cell">
    <div class="stock-ticker">AMZN</div>
    <div class="stock-name">Amazon</div>
    <div class="stock-price" id="amzn-price">—</div>
    <div class="stock-chg"   id="amzn-chg">—</div>
  </div>
</div>

<div class="sec-lbl">CRYPTO</div>
<div class="crypto-row">
  <div class="crypto-cell">
    <div class="crypto-sym">BTC</div>
    <div class="crypto-price" id="btc-price">—</div>
    <div class="crypto-sub" id="btc-sub">Bitcoin</div>
  </div>
  <div class="crypto-cell">
    <div class="crypto-sym">ETH</div>
    <div class="crypto-price" id="eth-price">—</div>
    <div class="crypto-sub" id="eth-sub">Ethereum</div>
  </div>
  <div class="crypto-cell">
    <div class="crypto-sym">SOL</div>
    <div class="crypto-price" id="sol-price">—</div>
    <div class="crypto-sub" id="sol-sub">Solana</div>
  </div>
</div>

<div class="mkt-clock">
  <div class="clk-item"><div class="clk-lbl">NEW YORK</div><div class="clk-val" id="clk-ny">—</div></div>
  <div class="clk-sep"></div>
  <div class="clk-item"><div class="clk-lbl">LONDON</div><div class="clk-val" id="clk-lon">—</div></div>
  <div class="clk-sep"></div>
  <div class="clk-item"><div class="clk-lbl">TOKYO</div><div class="clk-val" id="clk-tok">—</div></div>
  <div class="clk-sep"></div>
  <div class="clk-item"><div class="clk-lbl">LOS ANGELES</div><div class="clk-val" id="clk-la">—</div></div>
</div>

<script>
function g(id){ return document.getElementById(id); }

function fmtPrice(p) {
  var v = parseFloat(p);
  if (!v || isNaN(v)) return '—';
  if (v > 1000) return '$' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return '$' + v.toFixed(2);
}

function fmtChg(chg, pct) {
  var c = parseFloat(chg), p = parseFloat(pct);
  if (isNaN(c) || isNaN(p)) return '—';
  var s = c >= 0 ? '+' : '';
  return s + c.toFixed(2) + ' (' + s + p.toFixed(2) + '%)';
}

function setIdx(id, price, chg, pct) {
  var up = parseFloat(pct) >= 0;
  var pe = g(id+'-price'), ce = g(id+'-chg'), be = g(id+'-bar');
  if (pe) pe.textContent = fmtPrice(price);
  if (ce) { ce.textContent = fmtChg(chg, pct); ce.className = 'idx-chg '+(up?'up':'down'); }
  if (be) { be.style.width = Math.min(100,Math.max(2,50+parseFloat(pct)*8))+'%'; be.className='idx-bar '+(up?'bar-up':'bar-down'); }
}

function setStock(id, price, chg, pct) {
  var up = parseFloat(pct) >= 0;
  var s = g(id+'-chg');
  if (g(id+'-price')) g(id+'-price').textContent = fmtPrice(price);
  if (s) { s.textContent = (up?'+':'')+parseFloat(pct).toFixed(2)+'%'; s.className='stock-chg '+(up?'up':'down'); }
}

function readData() {
  try {
    var idx = JSON.parse(localStorage.getItem('mkt_indices')||'{}');
    var SPY=idx.SPY, QQQ=idx.QQQ, DIA=idx.DIA, IWM=idx.IWM;
    if(SPY) setIdx('spy',SPY.price,SPY.change,SPY.pct);
    if(QQQ) setIdx('qqq',QQQ.price,QQQ.change,QQQ.pct);
    if(DIA) setIdx('dia',DIA.price,DIA.change,DIA.pct);
    if(IWM) setIdx('iwm',IWM.price,IWM.change,IWM.pct);

    // Time-based market status (ET)
    var now2 = new Date();
    var etHour = parseInt(now2.toLocaleTimeString('en-US',{timeZone:'America/New_York',hour:'numeric',hour12:false}));
    var etMin  = now2.getMinutes();
    var etDay  = now2.toLocaleDateString('en-US',{timeZone:'America/New_York',weekday:'short'});
    var isWeekend = etDay === 'Sat' || etDay === 'Sun';
    var etMins = etHour * 60 + etMin;
    var st = g('mkt-status');
    if(st) {
      if(isWeekend) {
        st.textContent = 'CLOSED'; st.className = 'hdr-status st-closed';
      } else if(etMins >= 570 && etMins < 960) {
        // 9:30 AM - 4:00 PM ET = OPEN
        st.textContent = 'OPEN'; st.className = 'hdr-status st-open';
      } else if(etMins >= 480 && etMins < 570) {
        // 8:00 AM - 9:30 AM = PRE-MARKET
        st.textContent = 'PRE-MKT'; st.className = 'hdr-status st-pre';
      } else if(etMins >= 960 && etMins < 1200) {
        // 4:00 PM - 8:00 PM = AFTER HOURS
        st.textContent = 'AFTER HRS'; st.className = 'hdr-status st-pre';
      } else {
        st.textContent = 'CLOSED'; st.className = 'hdr-status st-closed';
      }
    }

    var stk = JSON.parse(localStorage.getItem('mkt_stocks')||'{}');
    if(stk.AAPL) setStock('aapl',stk.AAPL.price,stk.AAPL.change,stk.AAPL.pct);
    if(stk.NVDA) setStock('nvda',stk.NVDA.price,stk.NVDA.change,stk.NVDA.pct);
    if(stk.TSLA) setStock('tsla',stk.TSLA.price,stk.TSLA.change,stk.TSLA.pct);
    if(stk.AMZN) setStock('amzn',stk.AMZN.price,stk.AMZN.change,stk.AMZN.pct);

    var cry = JSON.parse(localStorage.getItem('mkt_crypto')||'{}');
    if(cry.BTC && g('btc-price')) g('btc-price').textContent = fmtPrice(cry.BTC.price);
    if(cry.ETH && g('eth-price')) g('eth-price').textContent = fmtPrice(cry.ETH.price);
    if(cry.SOL && g('sol-price')) g('sol-price').textContent = fmtPrice(cry.SOL.price);

  } catch(e){}
}

function updateClocks() {
  var now = new Date();
  var fmt = {hour:'2-digit',minute:'2-digit',hour12:true};
  var fmt24 = {hour:'2-digit',minute:'2-digit',hour12:false};
  var el;
  el=g('clk-ny');  if(el) el.textContent=now.toLocaleTimeString('en-US',Object.assign({timeZone:'America/New_York'},fmt));
  el=g('clk-lon'); if(el) el.textContent=now.toLocaleTimeString('en-US',Object.assign({timeZone:'Europe/London'},fmt24));
  el=g('clk-tok'); if(el) el.textContent=now.toLocaleTimeString('en-US',Object.assign({timeZone:'Asia/Tokyo'},fmt24));
  el=g('clk-la');  if(el) el.textContent=now.toLocaleTimeString('en-US',Object.assign({timeZone:'America/Los_Angeles'},fmt));
  el=g('hdr-date');if(el) el.textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'America/New_York'}).toUpperCase();
}

updateClocks();
setInterval(updateClocks, 1000);
readData();
setInterval(readData, 5000);
</script>
</body>
</html>

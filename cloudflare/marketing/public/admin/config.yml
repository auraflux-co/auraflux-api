# CMS config v2 — Navigation, Footer, Blog Posts included
backend:
  name: github
  repo: auraflux-co/auraflux-api
  branch: marketing
  base_url: https://auraflux.co
  auth_endpoint: /oauth/authorize

media_folder: cloudflare/marketing/assets
public_folder: /assets

site_url: https://auraflux.co
display_url: https://auraflux.co

collections:

  # ── Home page ──────────────────────────────────────────────────────────
  - name: home
    label: Home Page
    files:
      - name: home
        label: Home Page Content
        file: cloudflare/marketing/content/home.json
        fields:
          - { label: "Hero Headline", name: hero_headline, widget: string, hint: "Main heading — keep under 8 words" }
          - { label: "Hero Subtext", name: hero_sub, widget: text, hint: "Subtitle below the headline" }
          - { label: "Hero CTA Label", name: cta_primary_label, widget: string, default: "See How It Works" }
          - { label: "Hero CTA URL", name: cta_primary_url, widget: string, default: "/our-system", hint: "Where the main button links" }
          - { label: "Final CTA Label", name: final_cta_label, widget: string, default: "Start Producing" }
          - { label: "Final CTA URL", name: final_cta_url, widget: string, default: "/plans", hint: "Where the bottom CTA button links" }
          - label: "Trusted By — Platform Quotes"
            name: trusted_by
            widget: list
            fields:
              - { label: Platform, name: platform, widget: string }
              - { label: Handle, name: handle, widget: string }
              - { label: Quote, name: quote, widget: string }
          - label: "How It Works Steps"
            name: steps
            widget: list
            fields:
              - { label: Headline, name: headline, widget: string }
              - { label: Body, name: body, widget: text }
          - { label: "Final CTA Headline", name: final_cta_headline, widget: string }
          - { label: "Final CTA Subtext", name: final_cta_sub, widget: string }
          - { label: "OG / Share Image", name: og_image, widget: image, required: false, hint: "Image shown when shared on social media" }

  # ── Our Story (/our-story) ─────────────────────────────────────────────
  - name: our_story
    label: Our Story Page
    files:
      - name: our_story
        label: Our Story Content
        file: cloudflare/marketing/content/our-story.json
        fields:
          - { label: "Hero Headline", name: hero_headline, widget: string }
          - { label: "Hero Subtext", name: hero_sub, widget: text }
          - { label: "Mission — Why We Built This", name: mission_body, widget: markdown, hint: "The main narrative under Why We Built This" }
          - { label: "Blockquote", name: blockquote, widget: string, hint: "The pull quote in the mission section" }
          - label: "Stats"
            name: stats
            widget: list
            fields:
              - { label: Number, name: number, widget: string }
              - { label: Label, name: label, widget: string }
          - label: "What Makes AuraFlux Different — Cards"
            name: diff_cards
            widget: list
            fields:
              - { label: Icon, name: icon, widget: string, hint: "Emoji or symbol" }
              - { label: Headline, name: headline, widget: string }
              - { label: Body, name: body, widget: text }
          - label: "Founder"
            name: founder_photo
            widget: image
            required: false
            hint: "Profile photo shown in The People Behind AuraFlux section"
          - { label: "Founder Name", name: founder_name, widget: string }
          - { label: "Founder Role", name: founder_role, widget: string }
          - { label: "Founder Bio", name: founder_bio, widget: text }
          - { label: "CTA Headline", name: cta_headline, widget: string }
          - { label: "CTA Subtext", name: cta_sub, widget: string }
          - { label: "Hero Button Label", name: hero_cta_label, widget: string, default: "See Plans" }
          - { label: "Hero Button Style", name: hero_cta_style, widget: select, options: [{label: 'Gold (filled)', value: 'primary'}, {label: 'Gold (outline)', value: 'secondary'}, {label: 'Ghost (text only)', value: 'ghost'}], default: 'primary' }
          - { label: "Hero Button URL", name: hero_cta_url, widget: string, default: "/plans" }
          - { label: "Bottom CTA Button Label", name: cta_btn_label, widget: string, default: "Get Started" }
          - { label: "Bottom CTA Button Style", name: cta_btn_style, widget: select, options: [{label: 'Gold (filled)', value: 'primary'}, {label: 'Gold (outline)', value: 'secondary'}, {label: 'Ghost (text only)', value: 'ghost'}], default: 'secondary' }
          - { label: "Bottom CTA Button URL", name: cta_btn_url, widget: string, default: "/plans" }

  # ── Our System (/our-system) ───────────────────────────────────────────
  - name: our_system
    label: Our System Page
    files:
      - name: our_system
        label: Our System Content
        file: cloudflare/marketing/content/our-system.json
        fields:
          - { label: "Hero Headline", name: hero_headline, widget: string }
          - { label: "Hero Subtext", name: hero_sub, widget: text }
          - label: "Pipeline Portals"
            name: portals
            widget: list
            fields:
              - { label: Badge, name: badge, widget: string, hint: "e.g. P0" }
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Tag, name: tag, widget: string, hint: "e.g. ALWAYS ON, OPTIONAL, QA GATE" }
          - label: "Content Types"
            name: content_types
            widget: list
            fields:
              - { label: Icon, name: icon, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text }
          - { label: "Hero Button Label", name: hero_cta_label, widget: string, default: "View Plans" }
          - { label: "Hero Button Style", name: hero_cta_style, widget: select, options: [{label: 'Gold (filled)', value: 'primary'}, {label: 'Gold (outline)', value: 'secondary'}, {label: 'Ghost (text only)', value: 'ghost'}], default: 'primary' }
          - { label: "Hero Button URL", name: hero_cta_url, widget: string, default: "/plans" }
          - { label: "Bottom CTA Button Label", name: bottom_cta_label, widget: string, default: "Compare Plans" }
          - { label: "Bottom CTA Button Style", name: bottom_cta_style, widget: select, options: [{label: 'Gold (filled)', value: 'primary'}, {label: 'Gold (outline)', value: 'secondary'}, {label: 'Ghost (text only)', value: 'ghost'}], default: 'primary' }
          - { label: "Bottom CTA Button URL", name: bottom_cta_url, widget: string, default: "/plans" }

  # ── Plans (/plans) ─────────────────────────────────────────────────────
  - name: plans
    label: Plans Page
    files:
      - name: plans
        label: Plans Content
        file: cloudflare/marketing/content/plans.json
        fields:
          - { label: "Hero Headline", name: hero_headline, widget: string }
          - { label: "Hero Subtext", name: hero_sub, widget: text }
          - label: "Operate Plan"
            name: operate
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Price, name: price, widget: string, hint: "e.g. $499" }
              - { label: Credits line, name: credits, widget: string }
              - { label: Card Image, name: image_url, widget: image, required: false, hint: "Header image shown on the plan card" }
              - { label: Features, name: features, widget: list, field: { label: Feature, name: feature, widget: string } }
              - { label: CTA Label, name: cta_label, widget: string }
              - { label: CTA Style, name: cta_style, widget: select, options: [{label: 'Gold (filled)', value: 'primary'}, {label: 'Gold (outline)', value: 'secondary'}], default: 'secondary' }
              - { label: CTA URL, name: cta_url, widget: string, default: "/contact-us" }
          - label: "Guided Plan"
            name: guided
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Price, name: price, widget: string }
              - { label: Credits line, name: credits, widget: string }
              - { label: Card Image, name: image_url, widget: image, required: false, hint: "Header image shown on the plan card" }
              - { label: Features, name: features, widget: list, field: { label: Feature, name: feature, widget: string } }
              - { label: CTA Label, name: cta_label, widget: string }
              - { label: CTA Style, name: cta_style, widget: select, options: [{label: 'Gold (filled)', value: 'primary'}, {label: 'Gold (outline)', value: 'secondary'}], default: 'primary' }
              - { label: CTA URL, name: cta_url, widget: string, default: "/contact-us" }
          - label: "Managed Plan"
            name: managed
            widget: object
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Subtitle, name: subtitle, widget: string }
              - { label: Credits line, name: credits, widget: string }
              - { label: Card Image, name: image_url, widget: image, required: false, hint: "Header image shown on the plan card" }
              - { label: Features, name: features, widget: list, field: { label: Feature, name: feature, widget: string } }
              - { label: CTA Label, name: cta_label, widget: string }
              - { label: CTA Style, name: cta_style, widget: select, options: [{label: 'Gold (filled)', value: 'primary'}, {label: 'Gold (outline)', value: 'secondary'}], default: 'secondary' }
              - { label: CTA URL, name: cta_url, widget: string, default: "/contact-us" }
          - { label: "Credit Pack Footnote", name: credit_note, widget: text }

  # ── Roadmap (/roadmap) ─────────────────────────────────────────────────
  - name: roadmap
    label: Roadmap Page
    files:
      - name: roadmap
        label: Roadmap Content
        file: cloudflare/marketing/content/roadmap.json
        fields:
          - { label: "Hero Headline", name: hero_headline, widget: string }
          - { label: "Hero Subtext", name: hero_sub, widget: text }
          - label: "Now — In Active Development"
            name: now
            widget: list
            fields:
              - { label: Tag, name: tag, widget: string, hint: "e.g. Publishing, Production" }
              - { label: Headline, name: headline, widget: string }
              - { label: Description, name: description, widget: text }
          - label: "Next — Planned"
            name: next
            widget: list
            fields:
              - { label: Tag, name: tag, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Description, name: description, widget: text }
          - label: "Future — Exploring"
            name: future
            widget: list
            fields:
              - { label: Tag, name: tag, widget: string }
              - { label: Headline, name: headline, widget: string }
              - { label: Description, name: description, widget: text }

  # ── Contact Us (/contact-us) ───────────────────────────────────────────
  - name: contact
    label: Contact Page
    files:
      - name: contact
        label: Contact Content
        file: cloudflare/marketing/content/contact.json
        fields:
          - { label: "Hero Headline", name: hero_headline, widget: string }
          - { label: "Hero Subtext", name: hero_sub, widget: text }
          - label: "FAQ"
            name: faq
            widget: list
            fields:
              - { label: Question, name: question, widget: string }
              - { label: Answer, name: answer, widget: text }

  # ── Blog (/blog) ───────────────────────────────────────────────────────
  - name: blog
    label: Blog Page
    files:
      - name: blog
        label: Blog Posts
        file: cloudflare/marketing/content/blog.json
        fields:
          - { label: "Page Headline", name: hero_headline, widget: string }
          - { label: "Page Subtext", name: hero_sub, widget: text }
          - label: "Posts"
            name: posts
            widget: list
            fields:
              - { label: Tag, name: tag, widget: string, hint: "e.g. Guide, Platform, AI" }
              - { label: Title, name: title, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Status, name: status, widget: string, default: "Coming soon" }
              - { label: URL, name: url, widget: string, required: false, hint: "Leave blank if not published yet" }

  # ── SEO — Global meta ──────────────────────────────────────────────────
  - name: seo
    label: SEO & Meta
    files:
      - name: seo
        label: Page Meta Tags
        file: cloudflare/marketing/content/seo.json
        fields:
          - label: Pages
            name: pages
            widget: list
            fields:
              - { label: Page, name: page, widget: string, hint: "e.g. home, plans, our-story" }
              - { label: Title Tag, name: title, widget: string, hint: "Shown in browser tab and Google" }
              - { label: Meta Description, name: description, widget: text, hint: "150-160 chars. Shown in Google search results." }
              - { label: OG Image URL, name: og_image, widget: string, required: false }

  # ── Navigation (/admin → Header) ──────────────────────────────────────────
  - name: navigation
    label: Navigation
    files:
      - name: nav
        label: Top Navigation
        file: cloudflare/marketing/content/nav.json
        fields:
          - { label: "CTA Button Label", name: cta_label, widget: string, default: "Get Started", hint: "The gold button top-right" }
          - { label: "CTA Button URL", name: cta_url, widget: string, default: "/plans" }
          - label: "Nav Links"
            name: links
            widget: list
            hint: "Order matters — left to right in the menu"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string }

  # ── Footer ─────────────────────────────────────────────────────────────────
  - name: footer_content
    label: Footer
    files:
      - name: footer
        label: Footer Content
        file: cloudflare/marketing/content/footer.json
        fields:
          - { label: "Tagline", name: tagline, widget: string, hint: "Text shown below the logo" }
          - { label: "Copyright", name: copyright, widget: string }
          - label: "Platform Column Links"
            name: platform_links
            widget: list
            hint: "Left column — Platform section"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string }
          - label: "Resources Column Links"
            name: resource_links
            widget: list
            hint: "Right column — Resources section"
            fields:
              - { label: Label, name: label, widget: string }
              - { label: URL, name: url, widget: string }
          - label: "Social Media Links"
            name: social_links
            widget: list
            fields:
              - { label: Platform, name: platform, widget: select, options: [LinkedIn, Instagram, TikTok, YouTube, Twitter, Facebook] }
              - { label: URL, name: url, widget: string }

  # ── Blog Posts (full articles) ─────────────────────────────────────────────
  - name: blog_posts
    label: Blog
    folder: cloudflare/marketing/content/blog-posts
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: title, widget: string }
      - { label: "Publish Date", name: date, widget: datetime, required: false }
      - { label: "Author", name: author, widget: string, default: "Rob Gregory" }
      - { label: "Tag / Category", name: tag, widget: string, hint: "e.g. Guide, Platform, AI, Monetization" }
      - { label: "Description", name: description, widget: text, hint: "1–2 sentence summary shown in the blog list" }
      - { label: "Cover Image", name: cover_image, widget: image, required: false }
      - { label: "Published", name: published, widget: boolean, default: false, hint: "Toggle on to show this post on the site" }
      - { label: "Body", name: body, widget: markdown, hint: "Full article content. Supports headers, bold, lists, links, images." }

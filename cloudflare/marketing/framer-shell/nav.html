<style>
#af-nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  height:84px;
  background:rgba(11,18,32,0.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;
  padding:0 32px;
  font-family:'Satoshi','Inter',-apple-system,sans-serif;
}
#af-nav-inner{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;max-width:1320px;margin:0 auto;
}
#af-nav-logo{
  display:block;width:72px;height:48px;flex-shrink:0;text-decoration:none;
}
#af-nav-logo img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;}
#af-nav-divider{
  width:1px;height:28px;background:rgba(255,255,255,0.12);
  margin:0 24px 0 20px;flex-shrink:0;
}
#af-nav-links{
  display:flex;align-items:center;gap:28px;flex:1;
}
#af-nav-links a{
  font-size:15px;font-weight:400;color:rgba(255,255,255,0.85);
  text-decoration:none;letter-spacing:0.01em;white-space:nowrap;
  transition:color .15s;
}
#af-nav-links a:hover{color:#ffffff;text-decoration:none;}
#af-nav-right{
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
#af-nav-phone{
  display:flex;align-items:center;gap:6px;
  padding:9px 16px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:10px;
  color:rgba(255,255,255,0.85);
  text-decoration:none;
  font-size:14px;font-weight:500;letter-spacing:0.01em;white-space:nowrap;
  transition:background .15s;
}
#af-nav-phone:hover{background:rgba(255,255,255,0.1);text-decoration:none;color:#fff;}
#af-nav-chat{
  display:flex;align-items:center;gap:6px;
  padding:9px 18px;
  background:#f5c542;
  border:none;border-radius:10px;
  color:#0b1220;
  font-size:14px;font-weight:700;letter-spacing:0.01em;white-space:nowrap;
  cursor:pointer;transition:opacity .15s;
  font-family:inherit;
}
#af-nav-chat:hover{opacity:.88;}
@media(max-width:900px){
  #af-nav-links{gap:18px;}
  #af-nav-links a{font-size:14px;}
  #af-nav-phone span{display:none;}
  #af-nav-divider{margin:0 16px 0 14px;}
}
@media(max-width:680px){
  #af-nav-links{display:none;}
  #af-nav-divider{display:none;}
}
</style>

<nav id="af-nav">
  <div id="af-nav-inner">

    <a id="af-nav-logo" href="/" aria-label="AuraFlux home">
      <img src="https://assets.auraflux.co/marketing/images/QbVUbsjpCzrLC1gPNNNGcQzwPp8.png" alt="AuraFlux" width="72" height="48">
    </a>

    <div id="af-nav-divider"></div>

    <div id="af-nav-links">
      <a href="/">Home</a>
      <a href="/about">Our Story</a>
      <a href="/system">Our System</a>
      <a href="/pricing">Pricing</a>
      <a href="/roadmap">Roadmap</a>
      <a href="/contact">Contact</a>
    </div>

    <div id="af-nav-right">
      <a id="af-nav-phone" href="tel:+15716002835">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07A19.5 19.5 0 0 1 4.69 12 19.79 19.79 0 0 1 1.61 3.18 2 2 0 0 1 3.6 1h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L7.91 8.6a16 16 0 0 0 6 6l.96-.96a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span>+1 (571) 600-2835</span>
      </a>
      <button id="af-nav-chat" onclick="var p=document.getElementById('af-chat-panel');if(p){p.classList.add('open');var i=document.getElementById('af-chat-input');if(i)i.focus();}">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        Chat
      </button>
    </div>

  </div>
</nav>

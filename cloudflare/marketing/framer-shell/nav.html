<style>
#af-nav{
  position:fixed;top:0;left:0;right:0;z-index:1000;
  height:84px;
  background:rgba(11,18,32,0.92);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex;align-items:center;
  padding:0 32px;
  font-family:'Satoshi','Inter',-apple-system,sans-serif;
}
#af-nav-inner{
  display:flex;align-items:center;justify-content:space-between;
  width:100%;max-width:1320px;margin:0 auto;
}
#af-nav-logo{
  display:block;width:100px;height:67px;flex-shrink:0;text-decoration:none;
}
#af-nav-logo img{display:block;width:100%;height:100%;object-fit:contain;object-position:center;}
#af-nav-divider{
  width:1px;height:28px;background:rgba(255,255,255,0.12);
  margin:0 24px 0 20px;flex-shrink:0;
}
#af-nav-links{
  display:flex;align-items:center;gap:28px;flex:1;
}
#af-nav-links a{
  font-size:15px;font-weight:400;color:rgba(255,255,255,0.85);
  text-decoration:none;letter-spacing:0.01em;white-space:nowrap;
  transition:color .15s;
}
#af-nav-links a:hover{color:#ffffff;text-decoration:none;}
#af-nav-right{
  display:flex;align-items:center;gap:10px;flex-shrink:0;
}
#af-nav-phone{
  display:flex;align-items:center;gap:6px;
  padding:9px 16px;
  background:rgba(255,255,255,0.06);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:10px;
  color:rgba(255,255,255,0.85);
  text-decoration:none;
  font-size:14px;font-weight:500;letter-spacing:0.01em;white-space:nowrap;
  transition:background .15s;
}
#af-nav-phone:hover{background:rgba(255,255,255,0.1);text-decoration:none;color:#fff;}
#af-nav-cta{
  display:inline-block;
  padding:9px 20px;
  background:#f5c542;
  border-radius:10px;
  color:#0b1220;
  font-size:14px;font-weight:700;letter-spacing:-0.01em;white-space:nowrap;
  text-decoration:none;transition:opacity .15s;
  font-family:inherit;
}
#af-nav-cta:hover{opacity:.88;text-decoration:none;}
@media(max-width:900px){
  #af-nav-links{gap:18px;}
  #af-nav-links a{font-size:14px;}
  #af-nav-phone span{display:none;}
  #af-nav-divider{margin:0 16px 0 14px;}
}

/* ── Mobile hamburger ──────────────────────────────────────────────── */
#af-nav-hamburger{
  display:none;flex-direction:column;gap:5px;cursor:pointer;
  padding:8px;background:none;border:none;
}
#af-nav-hamburger span{
  display:block;width:22px;height:2px;
  background:rgba(255,255,255,.85);border-radius:2px;
  transition:transform .2s,opacity .2s;
}
#af-mobile-menu{
  display:none;position:fixed;top:84px;left:0;right:0;
  background:rgba(11,18,32,.97);backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(255,255,255,.08);
  padding:16px 24px 24px;z-index:999;
  flex-direction:column;gap:4px;
}
#af-mobile-menu.open{display:flex;}
#af-mobile-menu a{
  font-size:1rem;font-weight:500;color:rgba(255,255,255,.8);
  text-decoration:none;padding:12px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
  transition:color .15s;
}
#af-mobile-menu a:last-child{border-bottom:none;}
#af-mobile-menu a:hover{color:#f5c542;text-decoration:none;}
#af-mobile-cta{
  margin-top:12px;display:block;text-align:center;
  background:#f5c542;color:#0b1220;padding:12px;
  border-radius:8px;font-weight:700;font-size:.95rem;text-decoration:none;
}
@media(max-width:680px){
  #af-nav-links{display:none !important;}
  #af-nav-divider{display:none !important;}
  #af-nav-hamburger{display:flex;}
}

</style>

<nav id="af-nav">
  <div id="af-nav-inner">

    <a id="af-nav-logo" href="/" aria-label="AuraFlux home">
      <img src="https://assets.auraflux.co/marketing/images/QbVUbsjpCzrLC1gPNNNGcQzwPp8.png" alt="AuraFlux" width="100" height="67">
    </a>

    <div id="af-nav-divider"></div>

    <div id="af-nav-links">
      <a href="/">Home</a>
      <a href="/our-story">Our Story</a>
      <a href="/our-system">Our System</a>
      <a href="/pricing">Plans</a>
      <a href="/roadmap">Roadmap</a>
      <a href="/contact-us">Contact Us</a>
    </div>

    <div id="af-nav-right">
      <button id="af-nav-hamburger" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
      <a id="af-nav-cta" href="/plans">Get Started</a>
    </div>

  </div>
</nav>
  <!-- Mobile menu -->
  <div id="af-mobile-menu">
    <a href="/">Home</a>
    <a href="/our-story">Our Story</a>
    <a href="/our-system">Our System</a>
    <a href="/pricing">Plans</a>
    <a href="/roadmap">Roadmap</a>
    <a href="/contact-us">Contact Us</a>
    <a href="/plans" id="af-mobile-cta">Get Started</a>
  </div>
  <script>
  (function(){
    var btn = document.getElementById('af-nav-hamburger');
    var menu = document.getElementById('af-mobile-menu');
    if(btn && menu){
      btn.addEventListener('click', function(){
        menu.classList.toggle('open');
      });
    }
  })();
  </script>

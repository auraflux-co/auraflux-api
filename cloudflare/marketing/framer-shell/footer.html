<style>
#af-footer{
  background:#0b1220;
  border-top:1px solid rgba(255,255,255,0.08);
  font-family:'Satoshi','Inter',-apple-system,sans-serif;
  padding:64px 32px 32px;
  position:relative;
}
/* Background image overlay: matches Framer footer */
#af-footer-bg{
  position:absolute;inset:0;
  background-image:url('https://assets.auraflux.co/marketing/images/ICh4uY08MHOfs03CfirTdP5yKVs.jpg');
  background-size:cover;background-position:center top;
  opacity:0.12;pointer-events:none;
}
#af-footer-inner{
  max-width:1320px;margin:0 auto;position:relative;
}
/* Top row: nav links | logo + tagline + legal | socials */
#af-footer-top{
  display:grid;
  grid-template-columns:200px 1fr 200px;
  gap:40px;
  margin-bottom:48px;
  align-items:start;
}
/* Left: two-column nav grid */
#af-footer-links{
  display:grid;grid-template-columns:1fr 1fr;gap:0 32px;
}
.af-footer-col{display:flex;flex-direction:column;gap:10px;}
.af-footer-col-label{
  font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;
  color:#8f9bb7;font-family:'Satoshi','Inter',monospace;margin-bottom:4px;
}
#af-footer-links a{
  font-size:13px;font-weight:500;color:rgba(255,255,255,0.65);
  text-decoration:none;transition:color .15s;
}
#af-footer-links a:hover{color:#f5c542;text-decoration:none;}
/* Centre: logo + tagline + legal */
#af-footer-center{
  display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;
}
#af-footer-logo{
  display:block;width:100px;height:67px;
}
#af-footer-logo img{display:block;width:100%;height:100%;object-fit:contain;}
#af-footer-tagline{
  font-size:13px;color:rgba(160,160,184,0.8);max-width:280px;line-height:1.5;
}
#af-footer-legal-links{
  display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;
}
#af-footer-legal-links a{
  font-size:12px;color:rgba(160,160,184,0.7);text-decoration:none;transition:color .15s;
}
#af-footer-legal-links a:hover{color:#f5c542;text-decoration:none;}
#af-footer-legal-links span{color:rgba(255,255,255,0.2);font-size:11px;}
/* Right: socials */
#af-footer-socials{
  display:flex;flex-direction:column;align-items:flex-end;gap:12px;
}
.af-social{
  display:flex;align-items:center;gap:10px;text-decoration:none;
  color:rgba(160,160,184,0.8);font-size:14px;font-weight:400;
  transition:color .15s;
}
.af-social:hover{color:#fff;text-decoration:none;}
.af-social-li:hover .af-social-icon{background:rgba(10,102,194,.2);border-color:rgba(10,102,194,.4);}
.af-social-li:hover .af-social-icon svg{fill:#0a66c2;}
.af-social-ig:hover .af-social-icon{background:rgba(225,48,108,.15);border-color:rgba(225,48,108,.4);}
.af-social-ig:hover .af-social-icon svg{fill:#e1306c;}
.af-social-tt:hover .af-social-icon{background:rgba(105,201,208,.1);border-color:rgba(105,201,208,.3);}
.af-social-tt:hover .af-social-icon svg{fill:#69c9d0;}
.af-social-yt:hover .af-social-icon{background:rgba(255,0,0,.15);border-color:rgba(255,0,0,.4);}
.af-social-yt:hover .af-social-icon svg{fill:#ff0000;}
.af-social-icon{
  width:34px;height:34px;border-radius:8px;
  background:rgba(3,3,30,0.4);border:1px solid rgba(255,255,255,0.12);
  backdrop-filter:blur(10px);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .2s,border-color .2s;
}
.af-social-icon svg{width:15px;height:15px;fill:rgba(160,160,184,0.7);transition:fill .2s;}
/* Bottom row: copyright */
#af-footer-bottom{
  border-top:1px solid rgba(255,255,255,0.08);
  padding-top:24px;
  display:flex;align-items:center;justify-content:space-between;
}
#af-footer-copy{
  font-size:12px;color:rgba(160,160,184,0.6);
}
@media(max-width:900px){
  #af-footer-top{grid-template-columns:1fr 1fr;grid-template-rows:auto auto;}
  #af-footer-center{grid-column:1/-1;order:3;}
  #af-footer-socials{align-items:flex-start;}
}
@media(max-width:560px){
  #af-footer-top{grid-template-columns:1fr;}
  #af-footer-socials{flex-direction:row;flex-wrap:wrap;gap:10px;}
  #af-footer-socials .af-social span{display:none;}
  #af-footer-bottom{flex-direction:column;gap:12px;text-align:center;}
}
</style>

<style>
/* ── Roadmap flat grid ──────────────────────────────────────────────── */
.rdm-hero{text-align:center;margin-bottom:56px;}
.rdm-hero h1{letter-spacing:-.03em;}
.rdm-hero p{max-width:42rem;margin:16px auto 0;color:#8f9bb7;line-height:1.7;}

/* Phase legend */
.rdm-legend{display:flex;gap:20px;justify-content:center;flex-wrap:wrap;margin-bottom:40px;}
.rdm-legend-item{display:flex;align-items:center;gap:8px;font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8f9bb7;}
.rdm-legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.rdm-legend-dot-now{background:#f5c542;animation:rdm-pulse 2s ease-in-out infinite;}
.rdm-legend-dot-next{background:#60a5fa;}
.rdm-legend-dot-future{background:#a78bfa;}
@keyframes rdm-pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.85)}}

/* Flat grid */
.rdm-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
  max-width:1200px;
  margin:0 auto;
  padding:0 16px;
}
@media(max-width:900px){.rdm-grid{grid-template-columns:repeat(2,1fr);}}
@media(max-width:540px){.rdm-grid{grid-template-columns:1fr;}}

/* Cards */
.rdm-card{
  background:#0f172a;
  border:1px solid rgba(255,255,255,.08);
  border-radius:16px;
  padding:24px;
  display:flex;flex-direction:column;
  transition:border-color .2s,transform .15s;
}
.rdm-card:hover{transform:translateY(-2px);box-shadow:0 4px 24px rgba(0,0,0,.3);}
.rdm-card-now{border-color:rgba(199,175,79,.35);background:rgba(15,23,42,.8);}
.rdm-card-now:hover{border-color:rgba(245,197,66,.6);}
.rdm-card-next{border-color:rgba(96,165,250,.15);}
.rdm-card-next:hover{border-color:rgba(96,165,250,.4);}
.rdm-card-future{border-color:rgba(167,139,250,.12);opacity:.8;}
.rdm-card-future:hover{border-color:rgba(167,139,250,.3);opacity:1;}

/* Card header row: phase badge + category tag */
.rdm-card-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:6px;}

.rdm-phase{
  display:inline-flex;align-items:center;gap:5px;
  font-size:.6rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  border-radius:20px;padding:3px 10px;
}
.rdm-phase-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.rdm-phase-now{background:rgba(245,197,66,.12);color:#f5c542;}
.rdm-phase-now .rdm-phase-dot{background:#f5c542;animation:rdm-pulse 2s ease-in-out infinite;}
.rdm-phase-next{background:rgba(96,165,250,.1);color:#60a5fa;}
.rdm-phase-next .rdm-phase-dot{background:#60a5fa;}
.rdm-phase-future{background:rgba(167,139,250,.1);color:#a78bfa;}
.rdm-phase-future .rdm-phase-dot{background:#a78bfa;}

.rdm-tag{
  display:inline-block;
  font-size:.6rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  font-family:'Satoshi','Inter',monospace;
  padding:2px 8px;border-radius:4px;
}
.rdm-tag-publish{background:rgba(16,185,129,.12);color:#10b981;}
.rdm-tag-prod{background:rgba(245,197,66,.1);color:#f5c542;}
.rdm-tag-mono{background:rgba(99,102,241,.12);color:#818cf8;}

.rdm-card h3{
  font-size:1.05rem;font-weight:700;color:#fff;
  letter-spacing:-.01em;margin-bottom:8px;
  font-family:'Satoshi','Inter',sans-serif;
}
.rdm-card p{
  font-size:.85rem;color:#8f9bb7;line-height:1.6;
  font-family:'Satoshi','Inter',sans-serif;
  flex:1;
}

.rdm-progress{height:3px;background:rgba(245,197,66,.12);border-radius:2px;margin:10px 0 4px;overflow:hidden;}
.rdm-progress-fill{height:100%;border-radius:2px;background:linear-gradient(90deg,#c7af4f,#f5c542);animation:rdm-scan 2.5s ease-in-out infinite;}
@keyframes rdm-scan{0%{width:60%;opacity:.8;}50%{width:78%;opacity:1;}100%{width:60%;opacity:.8;}}
.rdm-progress-label{font-size:.6rem;font-family:'Satoshi','Inter',monospace;letter-spacing:.08em;text-transform:uppercase;color:#c7af4f;margin:0 0 10px;}

.rdm-request{
  max-width:1200px;margin:40px auto 0;padding:0 16px;
}
.rdm-request-inner{
  padding:20px 24px;
  border:1px solid rgba(255,255,255,.06);border-radius:12px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
  flex-wrap:wrap;
}
.rdm-request p{font-size:.88rem;color:#8f9bb7;margin:0;}
.rdm-request a{
  display:inline-block;padding:8px 20px;
  background:rgba(245,197,66,.1);border:1px solid rgba(245,197,66,.25);
  border-radius:8px;color:#f5c542;font-size:.85rem;font-weight:700;
  text-decoration:none;white-space:nowrap;transition:background .15s;
}
.rdm-request a:hover{background:rgba(245,197,66,.18);text-decoration:none;}
</style>

<div class="rdm-hero">
  <h1>What's Coming to AuraFlux</h1>
  <p data-editable="hero_subtext">We ship fast. Features move from Future to Next to Now as engineering capacity opens. This is a live view of our product pipeline.</p>
</div>

<div class="rdm-legend">
  <div class="rdm-legend-item"><div class="rdm-legend-dot rdm-legend-dot-now"></div>In Development</div>
  <div class="rdm-legend-item"><div class="rdm-legend-dot rdm-legend-dot-next"></div>Planned</div>
  <div class="rdm-legend-item"><div class="rdm-legend-dot rdm-legend-dot-future"></div>Future</div>
</div>


<!-- NOW -->
<div class="rdm-grid"><!-- RDM_CARDS --></div>

<div class="rdm-request">
  <div class="rdm-request-inner">
    <p>Have a feature request? We read every message. The best ideas go straight to the board.</p>
    <a href="/contact-us">Send a request →</a>
  </div>
</div>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page Not Found — AuraFlux</title>
<meta name="robots" content="noindex">
<link href="/favicon.png" rel="icon" type="image/png">
${FRAMER_FONTS || ''}
${FRAMER_CSS || ''}
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{line-height:1.6}
.err-wrap{
  min-height:calc(100vh - 84px);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  text-align:center;padding:60px 24px;
}
.err-code{
  font-size:7rem;font-weight:800;letter-spacing:-.06em;
  color:rgba(245,197,66,.15);line-height:1;margin-bottom:8px;
  font-family:'Satoshi','Inter',sans-serif;
}
.err-title{
  font-size:2rem;font-weight:800;color:#fff;
  letter-spacing:-.03em;margin-bottom:16px;
}
.err-sub{font-size:1rem;color:#8f9bb7;max-width:400px;margin:0 auto 40px;line-height:1.6;}
.err-cta{
  display:inline-block;background:#f5c542;color:#0b1220;
  padding:13px 32px;border-radius:8px;font-size:.95rem;font-weight:700;
  text-decoration:none;transition:opacity .15s;letter-spacing:-.01em;
}
.err-cta:hover{opacity:.88;text-decoration:none;}
.err-links{
  display:flex;gap:24px;justify-content:center;flex-wrap:wrap;
  margin-top:32px;
}
.err-links a{font-size:.88rem;color:#8f9bb7;text-decoration:none;transition:color .15s;}
.err-links a:hover{color:#f5c542;text-decoration:none;}
</style>
</head>
<body>
${FRAMER_NAV || FALLBACK_NAV}
<div class="err-wrap">
  <div class="err-code">404</div>
  <h1 class="err-title">Page not found</h1>
  <p class="err-sub">The page you were looking for doesn't exist or has moved. Let's get you back on track.</p>
  <a href="/" class="err-cta">Back to Home</a>
  <div class="err-links">
    <a href="/our-system">Our System</a>
    <a href="/plans">Plans</a>
    <a href="/roadmap">Roadmap</a>
    <a href="/contact-us">Contact</a>
  </div>
</div>
${FRAMER_FOOTER || FALLBACK_FOOTER}
</body>
</html>

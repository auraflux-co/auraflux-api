<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__POST_TITLE__ — AuraFlux Blog</title>
<meta name="description" content="__POST_DESC__">
<link rel="canonical" href="https://auraflux.co/blog/__POST_SLUG__">
<link href="/favicon.png" rel="icon" type="image/png">
<meta property="og:type" content="article">
<meta property="og:title" content="__POST_TITLE__">
<meta property="og:description" content="__POST_DESC__">
<meta property="og:image" content="__POST_OG_IMAGE__">
${FRAMER_FONTS || ''}
${FRAMER_CSS || ''}
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{line-height:1.7}
.post-wrap{max-width:760px;margin:0 auto;padding:48px 24px 120px;}
.post-header{margin-bottom:40px;}
.post-tag{display:inline-block;font-size:.68rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-family:'Satoshi','Inter',monospace;padding:3px 12px;border-radius:100px;background:rgba(245,197,66,.1);color:#f5c542;margin-bottom:16px;}
.post-header h1{font-size:2.5rem;font-weight:800;color:#fff;letter-spacing:-.03em;line-height:1.1;margin-bottom:16px;}
.post-meta{font-size:.82rem;color:#8f9bb7;display:flex;gap:16px;flex-wrap:wrap;align-items:center;}
.post-meta span{display:flex;align-items:center;gap:6px;}
.post-cover{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:16px;margin-bottom:40px;border:1px solid rgba(255,255,255,.07);}
.post-body{font-size:1rem;color:#c8c8e0;line-height:1.8;}
.post-body h2{font-size:1.6rem;font-weight:800;color:#fff;letter-spacing:-.02em;margin:40px 0 16px;}
.post-body h3{font-size:1.2rem;font-weight:700;color:#fff;letter-spacing:-.01em;margin:32px 0 12px;}
.post-body p{margin-bottom:20px;}
.post-body strong{color:#fff;font-weight:700;}
.post-body a{color:#f5c542;}
.post-body ul,.post-body ol{padding-left:24px;margin-bottom:20px;display:flex;flex-direction:column;gap:8px;}
.post-body li{color:#c8c8e0;}
.post-body blockquote{border-left:3px solid #f5c542;padding:16px 20px;background:rgba(245,197,66,.05);border-radius:0 12px 12px 0;margin:24px 0;font-style:italic;color:#e4e4f0;}
.post-body code{background:#0f172a;padding:2px 8px;border-radius:4px;font-size:.88em;color:#f5c542;font-family:monospace;}
.post-body pre{background:#0f172a;padding:20px;border-radius:12px;overflow-x:auto;margin-bottom:20px;}
.post-body pre code{background:none;padding:0;color:#a0a0b8;}
.post-body img{max-width:100%;border-radius:12px;margin:20px 0;}
.post-back{display:inline-flex;align-items:center;gap:6px;color:#8f9bb7;font-size:.88rem;margin-bottom:32px;text-decoration:none;transition:color .15s;}
.post-back:hover{color:#fff;text-decoration:none;}
</style>
</head>
<body>
${FRAMER_NAV || FALLBACK_NAV}
<div class="post-wrap">
  <a href="/blog" class="post-back">← Back to Blog</a>
  <div class="post-header">
    <span class="post-tag">__POST_TAG__</span>
    <h1>__POST_TITLE__</h1>
    <div class="post-meta">
      <span>__POST_AUTHOR__</span>
      <span>__POST_DATE__</span>
    </div>
  </div>
  __POST_COVER__
  <div class="post-body">__POST_BODY__</div>
</div>
${FRAMER_FOOTER || FALLBACK_FOOTER}
</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 1280px;
        height: 720px;
        background: #060a12;
        font-family: 'Barlow Condensed', Arial, sans-serif;
        overflow: hidden;
      }

      /* BACKGROUND */
      .bg {
        position: absolute;
        inset: 0;
        background:
          radial-gradient(
            ellipse 80% 60% at 50% 100%,
            rgba(199, 175, 79, 0.12) 0%,
            transparent 70%
          ),
          radial-gradient(ellipse 60% 40% at 20% 50%, rgba(34, 48, 75, 0.8) 0%, transparent 60%),
          radial-gradient(ellipse 60% 40% at 80% 50%, rgba(34, 48, 75, 0.6) 0%, transparent 60%),
          linear-gradient(180deg, #080d1a 0%, #060a12 100%);
      }

      /* Grid floor */
      .grid {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 280px;
        overflow: hidden;
      }
      .grid::before {
        content: '';
        position: absolute;
        bottom: 0;
        left: -20%;
        right: -20%;
        height: 500px;
        background:
          repeating-linear-gradient(
            90deg,
            rgba(199, 175, 79, 0.06) 0,
            rgba(199, 175, 79, 0.06) 1px,
            transparent 1px,
            transparent 80px
          ),
          repeating-linear-gradient(
            0deg,
            rgba(199, 175, 79, 0.04) 0,
            rgba(199, 175, 79, 0.04) 1px,
            transparent 1px,
            transparent 60px
          );
        transform: perspective(300px) rotateX(70deg);
        transform-origin: bottom center;
      }
      .grid::after {
        content: '';
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 120px;
        background: linear-gradient(0deg, #060a12 0%, transparent 100%);
      }

      /* TOP BAR */
      .topbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 52px;
        background: rgba(6, 10, 18, 0.9);
        border-bottom: 2px solid #c7af4f;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 32px;
      }
      .tb-brand {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 22px;
        color: #c7af4f;
        letter-spacing: 6px;
      }
      .tb-date {
        font-size: 13px;
        font-weight: 700;
        color: rgba(255, 255, 255, 0.5);
        letter-spacing: 3px;
      }
      .tb-tag {
        font-size: 11px;
        font-weight: 900;
        color: #060a12;
        background: #c7af4f;
        padding: 4px 14px;
        letter-spacing: 2px;
        border-radius: 2px;
      }

      /* MAIN HEADLINE */
      .headline-wrap {
        position: absolute;
        top: 80px;
        left: 0;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 0 60px;
      }
      .closing-label {
        font-size: 13px;
        font-weight: 900;
        color: #c7af4f;
        letter-spacing: 6px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .closing-label::before,
      .closing-label::after {
        content: '';
        flex: 1;
        height: 1px;
        background: rgba(199, 175, 79, 0.4);
      }
      .main-title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 112px;
        line-height: 0.9;
        color: #fff;
        text-align: center;
        letter-spacing: 4px;
        text-shadow: 0 0 80px rgba(199, 175, 79, 0.2);
      }
      .main-title span {
        color: #c7af4f;
      }
      .sub-title {
        font-size: 22px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.55);
        letter-spacing: 4px;
        text-align: center;
      }

      /* INDEX CARDS */
      .cards {
        position: absolute;
        bottom: 90px;
        left: 40px;
        right: 40px;
        display: flex;
        gap: 12px;
      }
      .card {
        flex: 1;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(199, 175, 79, 0.2);
        border-radius: 6px;
        padding: 16px 18px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        position: relative;
        overflow: hidden;
      }
      .card::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
      }
      .card.up::before {
        background: #27ae60;
      }
      .card.down::before {
        background: #e74c3c;
      }

      .card-name {
        font-size: 10px;
        font-weight: 900;
        color: rgba(255, 255, 255, 0.4);
        letter-spacing: 3px;
      }
      .card-price {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 36px;
        color: #fff;
        letter-spacing: 1px;
        line-height: 1;
      }
      .card-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .card-chg {
        font-size: 13px;
        font-weight: 900;
        font-family: Arial, sans-serif;
      }
      .card-pts {
        font-size: 11px;
        color: rgba(255, 255, 255, 0.4);
        font-family: Arial, sans-serif;
      }
      .card-up {
        color: #27ae60;
      }
      .card-dn {
        color: #e74c3c;
      }

      /* BELL ICON area */
      .bell-ring {
        position: absolute;
        top: 60px;
        right: 50px;
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(199, 175, 79, 0.15), transparent 70%);
        border: 2px solid rgba(199, 175, 79, 0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        animation: ringbell 2s ease-in-out infinite;
      }
      @keyframes ringbell {
        0%,
        100% {
          transform: rotate(0deg);
        }
        10% {
          transform: rotate(-12deg);
        }
        20% {
          transform: rotate(12deg);
        }
        30% {
          transform: rotate(-8deg);
        }
        40% {
          transform: rotate(8deg);
        }
        50% {
          transform: rotate(0deg);
        }
      }

      /* BOTTOM BAR */
      .bottombar {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 56px;
        background: #c7af4f;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 40px;
      }
      .bb-item {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .bb-sym {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 18px;
        color: #111827;
        letter-spacing: 2px;
      }
      .bb-price {
        font-size: 15px;
        font-weight: 900;
        color: #111827;
        font-family: Arial, sans-serif;
      }
      .bb-chg {
        font-size: 12px;
        font-weight: 900;
        font-family: Arial, sans-serif;
      }
      .bb-up {
        color: #1a5c2e;
      }
      .bb-dn {
        color: #8b1a1a;
      }
      .bb-sep {
        width: 1px;
        height: 28px;
        background: rgba(17, 24, 39, 0.3);
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="grid"></div>

    <!-- Bell -->
    <div class="bell-ring">🔔</div>

    <!-- Top bar -->
    <div class="topbar">
      <div class="tb-brand">CLIPZWORLD NEWS</div>
      <div class="tb-date" id="tb-date">TUESDAY · MARCH 31, 2026</div>
      <div class="tb-tag">CLOSING BELL</div>
    </div>

    <!-- Headline -->
    <div class="headline-wrap">
      <div class="closing-label">MARKET CLOSE REPORT</div>
      <div class="main-title">HOW THE<br /><span>MARKET</span><br />DID TODAY</div>
      <div class="sub-title" id="sub-status">MARKETS CLOSED · 4:00 PM ET</div>
    </div>

    <!-- Index cards -->
    <div class="cards">
      <div class="card" id="card-sp">
        <div class="card-name">S&P 500</div>
        <div class="card-price" id="sp-price">—</div>
        <div class="card-row">
          <div class="card-chg" id="sp-chg">—</div>
          <div class="card-pts" id="sp-pts">—</div>
        </div>
      </div>
      <div class="card" id="card-nas">
        <div class="card-name">NASDAQ</div>
        <div class="card-price" id="nas-price">—</div>
        <div class="card-row">
          <div class="card-chg" id="nas-chg">—</div>
          <div class="card-pts" id="nas-pts">—</div>
        </div>
      </div>
      <div class="card" id="card-dow">
        <div class="card-name">DOW JONES</div>
        <div class="card-price" id="dow-price">—</div>
        <div class="card-row">
          <div class="card-chg" id="dow-chg">—</div>
          <div class="card-pts" id="dow-pts">—</div>
        </div>
      </div>
      <div class="card" id="card-rus">
        <div class="card-name">RUSSELL 2000</div>
        <div class="card-price" id="rus-price">—</div>
        <div class="card-row">
          <div class="card-chg" id="rus-chg">—</div>
          <div class="card-pts" id="rus-pts">—</div>
        </div>
      </div>
    </div>

    <!-- Bottom ticker bar -->
    <div class="bottombar">
      <div class="bb-item">
        <div class="bb-sym">BTC</div>
        <div class="bb-price" id="bb-btc">—</div>
      </div>
      <div class="bb-sep"></div>
      <div class="bb-item">
        <div class="bb-sym">ETH</div>
        <div class="bb-price" id="bb-eth">—</div>
      </div>
      <div class="bb-sep"></div>
      <div class="bb-item">
        <div class="bb-sym">AAPL</div>
        <div class="bb-price" id="bb-aapl">—</div>
      </div>
      <div class="bb-sep"></div>
      <div class="bb-item">
        <div class="bb-sym">NVDA</div>
        <div class="bb-price" id="bb-nvda">—</div>
      </div>
      <div class="bb-sep"></div>
      <div class="bb-item">
        <div class="bb-sym">TSLA</div>
        <div class="bb-price" id="bb-tsla">—</div>
      </div>
      <div class="bb-sep"></div>
      <div class="bb-item">
        <div class="bb-sym">META</div>
        <div class="bb-price" id="bb-meta">—</div>
      </div>
      <div class="bb-sep"></div>
      <div class="bb-item">
        <div class="bb-sym">GOOGL</div>
        <div class="bb-price" id="bb-googl">—</div>
      </div>
      <div class="bb-sep"></div>
      <div class="bb-item">
        <div class="bb-sym">EUR/USD</div>
        <div class="bb-price" id="bb-eur">—</div>
      </div>
    </div>

    <script>
      var FMP = 'rJPVYlHnpcjxuOLoR1phvBz7e27UMMSq';
      var DATA = { indices: {}, stocks: {}, crypto: {}, forex: {} };

      function g(id) {
        return document.getElementById(id);
      }

      function fmtP(p) {
        var v = parseFloat(p);
        if (!v || isNaN(v)) return '—';
        if (v >= 10000) return '$' + v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        if (v >= 1000) return '$' + v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return '$' + v.toFixed(2);
      }

      function fmtIndex(p) {
        var v = parseFloat(p);
        if (!v || isNaN(v)) return '—';
        if (v >= 10000) return v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
        return v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
      }

      function setCard(cardId, priceId, chgId, ptsId, price, chg, pct) {
        var p = parseFloat(pct),
          c = parseFloat(chg),
          pr = parseFloat(price);
        if (isNaN(p) || isNaN(pr)) return;
        var up = p >= 0;
        var card = g(cardId);
        if (card) card.className = 'card ' + (up ? 'up' : 'down');
        if (g(priceId)) g(priceId).textContent = fmtIndex(pr);
        if (g(chgId)) {
          g(chgId).textContent = (up ? '+' : '') + p.toFixed(2) + '%';
          g(chgId).className = 'card-chg ' + (up ? 'card-up' : 'card-dn');
        }
        if (g(ptsId)) {
          g(ptsId).textContent = (up ? '+' : '') + c.toFixed(2) + ' pts';
        }
      }

      function render() {
        // Date
        var now = new Date();
        var dateStr = now
          .toLocaleDateString('en-US', {
            weekday: 'long',
            month: 'long',
            day: 'numeric',
            year: 'numeric',
          })
          .toUpperCase();
        if (g('tb-date')) g('tb-date').textContent = dateStr;

        // Index cards
        var idx = DATA.indices;
        if (idx.SPY)
          setCard(
            'card-sp',
            'sp-price',
            'sp-chg',
            'sp-pts',
            idx.SPY.price,
            idx.SPY.change,
            idx.SPY.pct
          );
        if (idx.QQQ)
          setCard(
            'card-nas',
            'nas-price',
            'nas-chg',
            'nas-pts',
            idx.QQQ.price,
            idx.QQQ.change,
            idx.QQQ.pct
          );
        if (idx.DIA)
          setCard(
            'card-dow',
            'dow-price',
            'dow-chg',
            'dow-pts',
            idx.DIA.price,
            idx.DIA.change,
            idx.DIA.pct
          );
        if (idx.IWM)
          setCard(
            'card-rus',
            'rus-price',
            'rus-chg',
            'rus-pts',
            idx.IWM.price,
            idx.IWM.change,
            idx.IWM.pct
          );

        // Bottom bar
        var cry = DATA.crypto;
        var stk = DATA.stocks;
        var fx = DATA.forex;
        if (cry.BTC && g('bb-btc')) g('bb-btc').textContent = fmtP(cry.BTC.price);
        if (cry.ETH && g('bb-eth')) g('bb-eth').textContent = fmtP(cry.ETH.price);
        if (stk.AAPL && stk.AAPL.price && g('bb-aapl'))
          g('bb-aapl').textContent = fmtP(stk.AAPL.price);
        if (stk.NVDA && stk.NVDA.price && g('bb-nvda'))
          g('bb-nvda').textContent = fmtP(stk.NVDA.price);
        if (stk.TSLA && stk.TSLA.price && g('bb-tsla'))
          g('bb-tsla').textContent = fmtP(stk.TSLA.price);
        if (stk.META && stk.META.price && g('bb-meta'))
          g('bb-meta').textContent = fmtP(stk.META.price);
        if (stk.GOOGL && stk.GOOGL.price && g('bb-googl'))
          g('bb-googl').textContent = fmtP(stk.GOOGL.price);
        if (fx.EURUSD && g('bb-eur')) g('bb-eur').textContent = fx.EURUSD.rate;
      }

      function fetchIndices() {
        var xhr = new XMLHttpRequest();
        xhr.open(
          'GET',
          'https://financialmodelingprep.com/stable/quote?apikey=' +
            FMP +
            '&symbol=^GSPC,^IXIC,^DJI,^RUT',
          true
        );
        xhr.timeout = 10000;
        xhr.onload = function () {
          try {
            var arr = JSON.parse(xhr.responseText);
            var map = { '^GSPC': 'SPY', '^IXIC': 'QQQ', '^DJI': 'DIA', '^RUT': 'IWM' };
            var names = {
              '^GSPC': 'S&P 500',
              '^IXIC': 'Nasdaq',
              '^DJI': 'Dow Jones',
              '^RUT': 'Russell 2000',
            };
            arr.forEach(function (q) {
              var k = map[q.symbol];
              if (k)
                DATA.indices[k] = {
                  symbol: k,
                  name: names[q.symbol],
                  price: q.price,
                  change: q.change,
                  pct: q.changePercentage,
                };
            });
            render();
          } catch (e) {}
        };
        xhr.onerror = xhr.ontimeout = function () {};
        xhr.send();
      }

      function fetchStocks() {
        var syms = ['AAPL', 'NVDA', 'TSLA', 'AMZN', 'MSFT', 'META', 'GOOGL', 'NFLX'];
        syms.forEach(function (sym, i) {
          setTimeout(function () {
            var xhr = new XMLHttpRequest();
            xhr.open(
              'GET',
              'https://financialmodelingprep.com/stable/quote?apikey=' + FMP + '&symbol=' + sym,
              true
            );
            xhr.timeout = 8000;
            xhr.onload = function () {
              try {
                var arr = JSON.parse(xhr.responseText);
                if (arr && arr[0]) {
                  var q = arr[0];
                  DATA.stocks[q.symbol] = {
                    symbol: q.symbol,
                    name: q.name,
                    price: q.price,
                    change: q.change,
                    pct: q.changePercentage,
                  };
                  render();
                }
              } catch (e) {}
            };
            xhr.onerror = xhr.ontimeout = function () {};
            xhr.send();
          }, i * 500);
        });
      }

      function fetchCrypto() {
        var xhr = new XMLHttpRequest();
        xhr.open(
          'GET',
          'https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum&vs_currencies=usd&include_24hr_change=true',
          true
        );
        xhr.timeout = 8000;
        xhr.onload = function () {
          try {
            var d = JSON.parse(xhr.responseText);
            DATA.crypto = {
              BTC: { price: d.bitcoin.usd, pct: d.bitcoin.usd_24h_change },
              ETH: { price: d.ethereum.usd, pct: d.ethereum.usd_24h_change },
            };
            render();
          } catch (e) {}
        };
        xhr.onerror = xhr.ontimeout = function () {};
        xhr.send();
      }

      function fetchForex() {
        var xhr = new XMLHttpRequest();
        xhr.open('GET', 'https://api.frankfurter.app/latest?from=USD&to=EUR,GBP', true);
        xhr.timeout = 8000;
        xhr.onload = function () {
          try {
            var d = JSON.parse(xhr.responseText);
            var r = d.rates || {};
            DATA.forex = { EURUSD: { pair: 'EUR/USD', rate: (1 / r.EUR).toFixed(4) } };
            render();
          } catch (e) {}
        };
        xhr.onerror = xhr.ontimeout = function () {};
        xhr.send();
      }

      // Pre-load today's confirmed closing data as fallback
      DATA.indices = {
        SPY: { price: 6506.78, change: 154.83, pct: 2.57 },
        QQQ: { price: 21525.2, change: 795.99, pct: 3.51 },
        DIA: { price: 46244.31, change: 1125.17, pct: 2.49 },
        IWM: { price: 2487.32, change: 92.37, pct: 3.41 },
      };
      DATA.stocks = {
        AAPL: { price: 253.79, change: 6.54, pct: 2.65 },
        NVDA: { price: 174.44, change: 9.28, pct: 5.62 },
        TSLA: { price: 371.8, change: 16.48, pct: 4.65 },
        AMZN: { price: 208.27, change: 7.96, pct: 3.96 },
        MSFT: { price: null, change: null, pct: null },
        META: { price: 572.13, change: 35.82, pct: 6.67 },
        GOOGL: { price: 287.56, change: null, pct: null },
        NFLX: { price: null, change: null, pct: null },
      };
      render(); // Show fallback data immediately

      // Then fetch live/updated data
      fetchCrypto();
      setTimeout(fetchForex, 1500);
      setTimeout(fetchIndices, 3000);
      setTimeout(fetchStocks, 5000);

      setInterval(fetchIndices, 120000);
      setInterval(fetchStocks, 120000);
      setInterval(fetchCrypto, 30000);
      setInterval(fetchForex, 60000);
    </script>
  </body>
</html>

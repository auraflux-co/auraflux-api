<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0a0e1a; color:#fff; font-family:'Barlow Condensed',Arial,sans-serif; }

#ctrl { background:#111827; border-bottom:3px solid #c7af4f; padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; position:relative; z-index:999; }
#ctrl label { font-size:11px; font-weight:700; color:rgba(199,175,79,0.7); letter-spacing:2px; }
.ctrl-field { background:#1a2538; border:1px solid rgba(199,175,79,0.3); color:#fff; font-family:monospace; font-size:14px; padding:7px 12px; border-radius:4px; }
#ep-num  { width:70px; }
#ep-date { width:160px; }
#matchups { width:420px; }
#gen-btn { background:#c7af4f; color:#0a0e1a; font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:3px; padding:8px 22px; border:none; border-radius:4px; cursor:pointer; }
#gen-btn:hover { background:#f0d060; }
#ep-inc  { background:rgba(199,175,79,0.15); border:1px solid rgba(199,175,79,0.3); color:#c7af4f; font-family:'Bebas Neue',sans-serif; font-size:13px; letter-spacing:2px; padding:7px 14px; border-radius:4px; cursor:pointer; }
#ep-inc:hover { background:rgba(199,175,79,0.25); }
#status  { font-size:11px; color:rgba(255,255,255,0.4); font-family:monospace; }

/* Thumbnail canvas */
#thumb { width:1280px; height:720px; position:relative; overflow:hidden; background:#060a12; z-index:1; }
.tbg-static { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(0.55) saturate(0.8); z-index:0; }
.tbg-overlay { position:absolute; inset:0; background:linear-gradient(160deg,rgba(0,0,0,0.35) 0%,rgba(0,0,0,0.80) 100%); z-index:1; }
.tbg-glow    { position:absolute; inset:0; background:radial-gradient(ellipse 60% 50% at 50% 60%, rgba(199,175,79,0.08) 0%, transparent 70%); z-index:2; }

/* Brand bar top-center */
.t-brand { position:absolute; top:28px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.75); border:1px solid rgba(199,175,79,0.5); color:#c7af4f; font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:8px; padding:6px 28px; border-radius:3px; white-space:nowrap; z-index:10; }

/* Episode badge top-right */
.t-epbadge { position:absolute; top:28px; right:36px; background:rgba(199,175,79,0.12); border:1px solid rgba(199,175,79,0.45); color:#c7af4f; font-family:'Bebas Neue',sans-serif; font-size:16px; letter-spacing:4px; padding:6px 18px; border-radius:3px; z-index:10; }

/* Bottom content block */
.t-content { position:absolute; bottom:0; left:0; right:0; padding:0 48px 44px; z-index:10; }
.t-label   { font-size:15px; font-weight:900; color:#c7af4f; letter-spacing:6px; margin-bottom:10px; }
.t-headline { font-family:'Bebas Neue',sans-serif; font-size:82px; line-height:0.88; color:#fff; text-shadow:0 4px 32px rgba(0,0,0,0.9); max-width:1100px; }
.t-matchups { font-size:22px; font-weight:700; color:rgba(255,255,255,0.65); letter-spacing:3px; margin-top:16px; }
.t-date     { font-size:15px; font-weight:600; color:rgba(199,175,79,0.55); letter-spacing:4px; margin-top:8px; }

/* Gold accent line */
.t-line { position:absolute; bottom:0; left:0; right:0; height:4px; background:linear-gradient(90deg, transparent, #c7af4f 30%, #c7af4f 70%, transparent); z-index:10; }

/* Below thumbnail */
#thumb-wrap { overflow:auto; }
.thumb-scaler { display:inline-block; transform-origin:top left; }
#hint { background:#111827; border-top:2px solid rgba(199,175,79,0.15); padding:14px 20px; font-size:12px; color:rgba(255,255,255,0.35); font-family:monospace; letter-spacing:1px; }
</style>
</head>
<body>

<div id="ctrl">
  <label>EP #</label>
  <input id="ep-num" class="ctrl-field" type="number" min="1" value="1">
  <button id="ep-inc" title="Save + increment episode number">+1 AFTER PUBLISH</button>

  <label>DATE</label>
  <input id="ep-date" class="ctrl-field" type="text">

  <label>MATCHUPS</label>
  <input id="matchups" class="ctrl-field" type="text" placeholder="HEAT vs MAGIC · WARRIORS vs GRIZZLIES">

  <button id="gen-btn">GENERATE</button>
  <span id="status">Fill in matchups and click Generate</span>
</div>

<div id="thumb-wrap">
  <div class="thumb-scaler" id="thumb-scaler">
    <div id="thumb">
      <img class="tbg-static" id="tbg-img"
        src="../assets/nba_playoffs_2026_bracket.png" alt="">
      <div class="tbg-overlay"></div>
      <div class="tbg-glow"></div>

      <div class="t-brand">OTHER SIDE OF THE PILLOW</div>
      <div class="t-epbadge" id="t-epbadge">EP 1</div>

      <div class="t-content">
        <div class="t-label">NBA PLAYOFFS REACTION</div>
        <div class="t-headline" id="t-headline">TONIGHT'S GAMES</div>
        <div class="t-matchups" id="t-matchups">—</div>
        <div class="t-date" id="t-date">—</div>
      </div>

      <div class="t-line"></div>
    </div>
  </div>
</div>

<div id="hint">
  📸 Screenshot the thumbnail above at 1280×720 · Upload directly to YouTube ·
  Click "+1 AFTER PUBLISH" once you've uploaded to increment the episode counter
</div>

<script>
var EP_KEY   = 'cwn_nba_ep_num';
var DATE_KEY = 'cwn_nba_last_date';

function todayStr() {
  return new Date().toLocaleDateString('en-US', { weekday:'long', month:'long', day:'numeric', year:'numeric' });
}

function shortDate() {
  return new Date().toLocaleDateString('en-US', { month:'long', day:'numeric', year:'numeric' }).toUpperCase();
}

function scaleThumb() {
  var wrap  = document.getElementById('thumb-wrap');
  var scaler = document.getElementById('thumb-scaler');
  var avail  = wrap.clientWidth || window.innerWidth;
  var scale  = Math.min(1, (avail - 40) / 1280);
  scaler.style.transform = 'scale(' + scale + ')';
  scaler.style.width  = (1280 * scale) + 'px';
  scaler.style.height = (720  * scale) + 'px';
  wrap.style.height   = (720  * scale) + 'px';
}

function loadState() {
  var ep = parseInt(localStorage.getItem(EP_KEY), 10) || 1;
  document.getElementById('ep-num').value  = ep;
  document.getElementById('ep-date').value = todayStr();
}

function render() {
  var ep       = parseInt(document.getElementById('ep-num').value, 10) || 1;
  var dateStr  = document.getElementById('ep-date').value || todayStr();
  var matchups = document.getElementById('matchups').value.trim();

  document.getElementById('t-epbadge').textContent  = 'EP ' + ep;
  document.getElementById('t-matchups').textContent = matchups || '—';
  document.getElementById('t-date').textContent     = dateStr.toUpperCase();

  // Persist ep number (not incremented yet — user clicks +1 after publishing)
  localStorage.setItem(EP_KEY, ep);

  document.getElementById('status').textContent = 'EP ' + ep + ' — ' + dateStr + ' — screenshot when ready';
}

document.getElementById('gen-btn').addEventListener('click', render);

document.getElementById('ep-inc').addEventListener('click', function() {
  var ep  = parseInt(document.getElementById('ep-num').value, 10) || 1;
  var next = ep + 1;
  document.getElementById('ep-num').value = next;
  localStorage.setItem(EP_KEY, next);
  document.getElementById('status').textContent = 'Saved — next episode is EP ' + next;
});

// Allow Enter key in matchups field
document.getElementById('matchups').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') render();
});

window.addEventListener('resize', scaleThumb);

// Init
loadState();
scaleThumb();
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=640">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:640px; height:360px; overflow:hidden; }
body { background:#060a12; color:#fff; font-family:'Barlow Condensed',Arial,sans-serif; }

/* ── Thumbnail canvas: 640×360 ── */
#thumb { width:640px; height:360px; position:relative; overflow:hidden; background:#060a12; }
.tbg { position:absolute; inset:0; z-index:2; }
.tbg-static { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter:brightness(0.4) saturate(0.7) blur(6px); transform:scale(1.05); z-index:0; }
.tbg-overlay { position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,0.45) 0%,rgba(0,0,0,0.7) 100%); z-index:1; }

/* Court floor grid */
.tfloor { position:absolute; bottom:0; left:0; right:0; height:150px; overflow:hidden; z-index:2; }
.tfloor::before { content:''; position:absolute; bottom:0; left:-30%; right:-30%; height:240px; background:repeating-linear-gradient(90deg,rgba(255,255,255,0.025) 0,rgba(255,255,255,0.025) 1px,transparent 1px,transparent 32px),repeating-linear-gradient(0deg,rgba(255,255,255,0.02) 0,rgba(255,255,255,0.02) 1px,transparent 1px,transparent 22px); transform:perspective(140px) rotateX(72deg); transform-origin:bottom center; }
.tfloor::after { content:''; position:absolute; bottom:0; left:0; right:0; height:90px; background:linear-gradient(0deg,#060a12 0%,transparent 100%); }

/* Team color panels */
#panel-a { position:absolute; top:0; left:0; bottom:0; width:250px; clip-path:polygon(0 0,100% 0,68% 100%,0 100%); z-index:2; }
#panel-h { position:absolute; top:0; right:0; bottom:0; width:250px; clip-path:polygon(32% 0,100% 0,100% 100%,0 100%); z-index:2; }

/* Gold divider lines */
.vl { position:absolute; top:0; bottom:0; width:1px; background:linear-gradient(180deg,transparent,rgba(199,175,79,0.5) 50%,transparent); z-index:3; }

/* Team blocks */
#team-a { position:absolute; left:14px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:10px; z-index:5; }
#team-h { position:absolute; right:14px; top:50%; transform:translateY(-50%); display:flex; align-items:center; gap:10px; flex-direction:row-reverse; z-index:5; }
.logo-wrap { width:68px; height:68px; border-radius:50%; background:rgba(255,255,255,0.08); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; border:2px solid rgba(255,255,255,0.15); }
.logo-wrap img { width:56px; height:56px; object-fit:contain; }
.tcity { font-size:9px; font-weight:700; letter-spacing:4px; margin-bottom:1px; }
.tname { font-family:'Bebas Neue',sans-serif; font-size:36px; line-height:0.9; color:#fff; text-shadow:0 2px 15px rgba(0,0,0,0.8); }
.trec { font-size:9px; font-weight:600; letter-spacing:2px; margin-top:4px; opacity:0.55; }
.htext { text-align:right; }

/* PPG leader row */
.tppg { font-size:8px; font-weight:700; color:rgba(199,175,79,0.8); letter-spacing:1px; margin-top:3px; }

/* Center VS block */
.tctr { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); display:flex; flex-direction:column; align-items:center; gap:6px; z-index:10; }
.vs-ring { width:56px; height:56px; border-radius:50%; background:radial-gradient(circle,#1a2840,#0d1524); border:2px solid rgba(199,175,79,0.55); box-shadow:0 0 30px rgba(199,175,79,0.28); display:flex; align-items:center; justify-content:center; }
.vs-lbl { font-family:'Bebas Neue',sans-serif; font-size:22px; color:#c7af4f; letter-spacing:2px; }
.live-pill { display:flex; align-items:center; gap:5px; background:rgba(192,30,30,0.92); padding:3px 10px; border-radius:2px; }
.live-dot { width:5px; height:5px; border-radius:50%; background:#fff; }
.live-txt { font-family:'Bebas Neue',sans-serif; font-size:10px; color:#fff; letter-spacing:3px; }
#tip-time { font-family:'Bebas Neue',sans-serif; font-size:16px; color:#c7af4f; letter-spacing:2px; }
#game-sub { font-size:7px; font-weight:600; color:rgba(255,255,255,0.38); letter-spacing:2px; text-align:center; max-width:160px; }

/* Brand badge */
.brand { position:absolute; top:10px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,0.72); border:1px solid rgba(199,175,79,0.45); color:#c7af4f; font-family:'Bebas Neue',sans-serif; font-size:9px; letter-spacing:4px; padding:3px 12px; border-radius:2px; white-space:nowrap; z-index:10; }
#game-tag { position:absolute; top:30px; left:50%; transform:translateX(-50%); color:rgba(199,175,79,0.65); font-size:7px; font-weight:700; letter-spacing:3px; white-space:nowrap; z-index:10; }

/* Status overlay (hidden in screenshot) */
#status-bar { position:fixed; bottom:0; left:0; right:0; background:rgba(0,0,0,0.8); color:#c7af4f; font-family:monospace; font-size:10px; padding:4px 8px; z-index:999; }
</style>
</head>
<body>

<div id="thumb">
  <img class="tbg-static" src="../assets/nba_long_form thumbnail.jpg" alt="">
  <div class="tbg-overlay"></div>
  <div class="tbg" id="tbg"></div>
  <div class="tfloor"></div>
  <div id="panel-a"></div>
  <div id="panel-h"></div>
  <div class="vl" style="left:190px"></div>
  <div class="vl" style="right:190px"></div>

  <div id="team-a">
    <div class="logo-wrap"><img id="a-logo" src="" alt=""></div>
    <div>
      <div class="tcity" id="a-city"></div>
      <div class="tname" id="a-name">AWAY</div>
      <div class="trec" id="a-rec"></div>
      <div class="tppg" id="a-ppg"></div>
    </div>
  </div>

  <div id="team-h">
    <div class="logo-wrap"><img id="h-logo" src="" alt=""></div>
    <div class="htext">
      <div class="tcity" id="h-city"></div>
      <div class="tname" id="h-name">HOME</div>
      <div class="trec" id="h-rec"></div>
      <div class="tppg" id="h-ppg"></div>
    </div>
  </div>

  <div class="brand">BECAUSE THE LIGHT WAS ON</div>
  <div id="game-tag">NBA - LIVE COVERAGE</div>

  <div class="tctr">
    <div class="live-pill"><div class="live-dot"></div><div class="live-txt">LIVE TONIGHT</div></div>
    <div class="vs-ring"><div class="vs-lbl">VS</div></div>
    <div id="tip-time">-- ET</div>
    <div id="game-sub">LOADING...</div>
  </div>
</div>

<div id="status-bar">Loading...</div>

<script>
function g(id) { return document.getElementById(id); }

function fmtTime(str) {
  var d = new Date(str);
  var h = d.getHours(); var m = d.getMinutes();
  var ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  return h + ':' + (m < 10 ? '0' + m : m) + ' ' + ap + ' ET';
}

function hexRgb(hex) {
  hex = (hex || '').replace('#', '');
  if (hex.length !== 6) return '100,100,100';
  return parseInt(hex.slice(0,2),16) + ',' + parseInt(hex.slice(2,4),16) + ',' + parseInt(hex.slice(4,6),16);
}

var SEASON_LEADERS = {
  ATL: { name:'T. Young',              ppg:'23.1', rpg:'3.2', apg:'11.4' },
  BOS: { name:'J. Brown',              ppg:'27.2', rpg:'6.8', apg:'3.5'  },
  BKN: { name:'C. Thomas',             ppg:'21.3', rpg:'3.0', apg:'5.4'  },
  CHA: { name:'L. Ball',               ppg:'14.9', rpg:'4.1', apg:'8.0'  },
  CHI: { name:'Z. LaVine',             ppg:'24.1', rpg:'4.4', apg:'4.2'  },
  CLE: { name:'D. Garland',            ppg:'21.7', rpg:'3.0', apg:'7.0'  },
  DAL: { name:'K. Irving',             ppg:'25.8', rpg:'5.0', apg:'5.2'  },
  DEN: { name:'N. Jokic',              ppg:'29.6', rpg:'12.7',apg:'10.2' },
  DET: { name:'C. Cunningham',         ppg:'26.0', rpg:'4.4', apg:'9.2'  },
  GSW: { name:'S. Curry',              ppg:'24.5', rpg:'4.4', apg:'6.5'  },
  HOU: { name:'A. Sengun',             ppg:'21.1', rpg:'9.3', apg:'5.0'  },
  IND: { name:'T. Haliburton',         ppg:'20.4', rpg:'3.9', apg:'9.2'  },
  LAC: { name:'J. Harden',             ppg:'20.5', rpg:'5.0', apg:'8.7'  },
  LAL: { name:'L. James',              ppg:'23.5', rpg:'8.1', apg:'8.3'  },
  MEM: { name:'J. Morant',             ppg:'22.8', rpg:'5.3', apg:'8.1'  },
  MIA: { name:'T. Herro',              ppg:'24.5', rpg:'5.0', apg:'4.8'  },
  MIL: { name:'G. Antetokounmpo',      ppg:'32.7', rpg:'11.5',apg:'5.9'  },
  MIN: { name:'A. Edwards',            ppg:'27.4', rpg:'5.4', apg:'5.1'  },
  NOP: { name:'Z. Williams',           ppg:'19.0', rpg:'4.5', apg:'2.8'  },
  NYK: { name:'J. Brunson',            ppg:'26.3', rpg:'3.1', apg:'6.7'  },
  OKC: { name:'S. Gilgeous-Alexander', ppg:'32.3', rpg:'5.1', apg:'6.4'  },
  ORL: { name:'P. Banchero',           ppg:'25.6', rpg:'7.9', apg:'5.4'  },
  PHI: { name:'J. Embiid',             ppg:'24.6', rpg:'8.0', apg:'3.1'  },
  PHX: { name:'K. Durant',             ppg:'26.8', rpg:'7.3', apg:'4.0'  },
  POR: { name:'S. Sharpe',             ppg:'20.0', rpg:'5.5', apg:'3.5'  },
  SAC: { name:'D. Fox',                ppg:'24.7', rpg:'3.8', apg:'6.2'  },
  SAS: { name:'V. Wembanyama',         ppg:'24.3', rpg:'10.7',apg:'3.9'  },
  TOR: { name:'I. Quickley',           ppg:'18.6', rpg:'3.5', apg:'6.4'  },
  UTA: { name:'L. Markkanen',          ppg:'23.2', rpg:'8.2', apg:'2.0'  },
  WAS: { name:'K. Kuzma',              ppg:'22.5', rpg:'6.5', apg:'3.5'  }
};

function setStatus(msg) {
  var sb = g('status-bar');
  if (sb) sb.textContent = msg;
}

function renderGame(data) {
  var hc = data.header && data.header.competitions && data.header.competitions[0];
  var comps = (hc && hc.competitors) || [];
  var away = {team:{}}, home = {team:{}};
  for (var i = 0; i < comps.length; i++) {
    if (comps[i].homeAway === 'away') away = comps[i];
    if (comps[i].homeAway === 'home') home = comps[i];
  }

  var bst = (data.boxscore && data.boxscore.teams) || [];
  var aColor = '1d428a', hColor = 'c41311';
  var aAbbr = (away.team && away.team.abbreviation) || 'AWAY';
  var hAbbr = (home.team && home.team.abbreviation) || 'HOME';
  for (var t = 0; t < bst.length; t++) {
    var bt = bst[t].team || {};
    if (bt.abbreviation === aAbbr && bt.color) aColor = bt.color;
    if (bt.abbreviation === hAbbr && bt.color) hColor = bt.color;
  }

  g('panel-a').style.background = 'linear-gradient(120deg,#' + aColor + '66 0%,#' + aColor + '22 60%,transparent 100%)';
  g('panel-h').style.background = 'linear-gradient(240deg,#' + hColor + '66 0%,#' + hColor + '22 60%,transparent 100%)';
  g('tbg').style.background = 'radial-gradient(ellipse 70% 90% at 15% 50%,rgba(' + hexRgb(aColor) + ',0.25) 0%,transparent 60%),radial-gradient(ellipse 70% 90% at 85% 50%,rgba(' + hexRgb(hColor) + ',0.2) 0%,transparent 60%),transparent';

  var aLoc = (away.team && away.team.location) || '';
  var aNick = (away.team && away.team.name) || '';
  var aRec = (away.records && away.records[0] && away.records[0].summary) || '';
  g('a-city').textContent = aLoc.toUpperCase();
  g('a-city').style.color = 'rgba(' + hexRgb(aColor) + ',0.8)';
  g('a-name').textContent = aNick.toUpperCase();
  g('a-rec').textContent = aRec;
  g('a-logo').src = 'https://a.espncdn.com/i/teamlogos/nba/500/' + aAbbr.toLowerCase() + '.png';
  var aL = SEASON_LEADERS[aAbbr];
  if (aL) g('a-ppg').textContent = aL.name + ' ' + aL.ppg + ' PPG';

  var hLoc = (home.team && home.team.location) || '';
  var hNick = (home.team && home.team.name) || '';
  var hRec = (home.records && home.records[0] && home.records[0].summary) || '';
  g('h-city').textContent = hLoc.toUpperCase();
  g('h-city').style.color = 'rgba(' + hexRgb(hColor) + ',0.8)';
  g('h-name').textContent = hNick.toUpperCase();
  g('h-rec').textContent = hRec;
  g('h-logo').src = 'https://a.espncdn.com/i/teamlogos/nba/500/' + hAbbr.toLowerCase() + '.png';
  var hL = SEASON_LEADERS[hAbbr];
  if (hL) g('h-ppg').textContent = hL.name + ' ' + hL.ppg + ' PPG';

  var gi = data.gameInfo || {};
  var venue = (gi.venue && gi.venue.fullName) || '';
  var city = (gi.venue && gi.venue.address && gi.venue.address.city) || '';
  g('tip-time').textContent = hc && hc.date ? fmtTime(hc.date) : '-- ET';
  g('game-sub').textContent = venue.toUpperCase() + (city ? ' - ' + city.toUpperCase() : '');
  g('game-tag').textContent = 'NBA - ' + (hc && hc.date ? new Date(hc.date).toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'}).toUpperCase() : '');

  setStatus('READY');
  // Signal to Puppeteer that rendering is complete
  document.title = 'READY';
}

// ── Auto-load from URL param: ?gameId=401584893 ──
(function() {
  var params = new URLSearchParams(window.location.search);
  var gameId = params.get('gameId');
  if (!gameId) {
    setStatus('No gameId param — add ?gameId=XXXXXXX to URL');
    return;
  }
  setStatus('Fetching game ' + gameId + '...');
  var xhr = new XMLHttpRequest();
  xhr.open('GET', 'https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=' + gameId, true);
  xhr.timeout = 12000;
  xhr.onload = function() {
    if (xhr.status !== 200) { setStatus('ESPN error ' + xhr.status); return; }
    try {
      var data = JSON.parse(xhr.responseText);
      renderGame(data);
    } catch(e) {
      setStatus('Parse error: ' + e.message);
    }
  };
  xhr.onerror = function() { setStatus('Network error'); };
  xhr.ontimeout = function() { setStatus('Timeout'); };
  xhr.send();
})();
</script>
</body>
</html>

name: Jira — backfill untracked commits + CPD-1017

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report only — do not create issues or update Confluence'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Create missing Jira issues + update Confluence HOW pages
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          normalize_base() {
            local b="${1%/}"
            [[ -z "$b" ]] && return 1
            [[ "$b" != http* ]] && b="https://${b}"
            b="${b/http:\/\//https:\/\/}"
            b="${b%/wiki}"
            b="${b%/jira}"
            printf '%s' "$b"
          }

          BASE="$(normalize_base "$JIRA_BASE_URL")"
          if [[ "$BASE" == *"id.atlassian.com"* ]]; then
            echo "::error::JIRA_BASE_URL must be https://<site>.atlassian.net (got id.atlassian.com)" >&2
            exit 1
          fi
          AUTH="$JIRA_USER_EMAIL:$JIRA_API_TOKEN"

          jira_get() {
            curl -sS --max-time 15 -u "$AUTH" \
              -H "Accept: application/json" \
              "$BASE/rest/api/3/$1"
          }

          jira_post() {
            local path="$1" payload="$2"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "  [dry-run] POST $path"
              return 0
            fi
            local http body
            body=$(curl -sS --max-time 15 -u "$AUTH" \
              -H "Content-Type: application/json" \
              -H "Accept: application/json" \
              -X POST "$BASE/rest/api/3/$path" \
              -d "$payload" -w "\n__HTTP__:%{http_code}")
            http="${body##*__HTTP__:}"
            body="${body%__HTTP__:*}"
            if [[ "$http" =~ ^2 ]]; then
              echo "$body"
            else
              echo "  Jira POST $path: HTTP $http — ${body:0:300}" >&2
              echo "{}"
            fi
          }

          create_story() {
            local summary="$1" desc="$2" labels="$3"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "  [dry-run] would create: ${summary:0:70}" >&2
              return 0
            fi
            local payload key body
            for itype in Story Task Bug; do
              payload=$(jq -n \
                --arg summary "$summary" \
                --arg desc "$desc" \
                --arg itype "$itype" \
                --argjson labels "$labels" \
                '{fields:{project:{key:"CPD"},summary:$summary,issuetype:{name:$itype},description:{type:"doc",version:1,content:[{type:"paragraph",content:[{type:"text",text:$desc}]}]},labels:$labels}}')
              body=$(jira_post "issue" "$payload")
              key=$(echo "$body" | jq -r '.key // empty')
              if [[ -n "$key" ]]; then
                echo "  ✅ Created $key: ${summary:0:60}" >&2
                echo "$key"
                return 0
              fi
            done
            echo "" >&2
          }

          issue_exists() {
            local key="$1" http
            http=$(curl -sS -o /tmp/jira_issue.json -w "%{http_code}" --max-time 15 -u "$AUTH" \
              -H "Accept: application/json" \
              "$BASE/rest/api/3/issue/${key}?fields=summary")
            [[ "$http" == "200" ]]
          }

          echo ""
          echo "── CPD-1017 (PR #637) ──"
          if issue_exists "CPD-1017"; then
            echo "  CPD-1017 already exists"
            jira_post "issue/CPD-1017/comment" "$(jq -n \
              --arg url "https://github.com/${REPO}/pull/637" \
              '{body:{type:"doc",version:1,content:[{type:"paragraph",content:[{type:"text",text:"GitHub PR #637: "},{type:"text",text:$url,marks:[{type:"link",attrs:{href:$url}}]}]}]}}')" >/dev/null || true
          else
            key=$(create_story \
              "Broadcast Control Center, native dual-format, EchoMimic resume (CPD-1017)" \
              "Epic/story for PR #637 (feat/cpd-1017-program-director).\n\nScope: CPD-1026–1029 Broadcast Control Center, retire default dual YouTube listing, CPD-991 EchoMimic checkpoint resume, CPD-963 Gate 0 mixed-format.\n\nPR: https://github.com/${REPO}/pull/637" \
              '["broadcast","pr-637","backfill"]')
            [[ -n "$key" && "$key" != "0" ]] && echo "  Note: rename to CPD-1017 in Jira if auto-number differs ($key)"
          fi

          echo ""
          echo "── Untracked commits ──"
          create_story "[Backfill] fix(UX): landing page Sign In CTA always visible before Clerk hydrates" \
            "Landing page: Sign In / Get Started visible before Clerk hydrates; persistent header Sign In link.\n\nCommit: https://github.com/${REPO}/commit/b4ca5076d5cea99e2292e70ec2cadf25b36bfbd0" \
            '["auto-created","session-close","backfill"]'

          create_story "[Backfill] fix: populate gitHash from RENDER_GIT_COMMIT when .git unavailable" \
            "/health gitHash reads RENDER_GIT_COMMIT when .git stripped at Render runtime.\n\nCommit: https://github.com/${REPO}/commit/e654cbce" \
            '["auto-created","session-close","backfill"]'

          create_story "[Backfill] feat: Slack SMS notifications + multi-number support inbox" \
            "Slack webhook for inbound SMS, getSupportNumbers() for ported Telnyx numbers, telnyx_configure_ported_numbers.js script.\n\nCommit: https://github.com/${REPO}/commit/be24ce2d" \
            '["auto-created","session-close","backfill"]'

          echo ""
          echo "── Confluence HOW updates ──"
          conf_append() {
            local page_id="$1" marker="$2" wiki_block="$3"
            if [[ "$DRY_RUN" == "true" ]]; then
              echo "  [dry-run] would append to page $page_id"
              return 0
            fi
            local http old title version new_body payload
            http=$(curl -sS -o /tmp/conf_page.json -w "%{http_code}" --max-time 15 -u "$AUTH" \
              -H "Accept: application/json" \
              "$BASE/wiki/rest/api/content/${page_id}?expand=body.storage,version")
            if [[ ! "$http" =~ ^2 ]]; then
              echo "  Confluence GET $page_id: HTTP $http" >&2
              return 0
            fi
            old=$(jq -r '.body.storage.value' /tmp/conf_page.json)
            if grep -qF "$marker" <<< "$old"; then
              echo "  Page $page_id: section already present — skip"
              return 0
            fi
            title=$(jq -r '.title' /tmp/conf_page.json)
            version=$(jq -r '.version.number' /tmp/conf_page.json)
            new_body="${old}

          ${wiki_block}"
            payload=$(jq -n \
              --arg id "$page_id" \
              --arg title "$title" \
              --argjson ver "$((version + 1))" \
              --arg body "$new_body" \
              '{id:$id,type:"page",title:$title,version:{number:$ver},body:{storage:{value:$body,representation:"storage"}}}')
            http=$(curl -sS -o /tmp/conf_put.json -w "%{http_code}" --max-time 15 -u "$AUTH" \
              -H "Content-Type: application/json" \
              -X PUT "$BASE/wiki/rest/api/content/${page_id}" \
              -d "$payload")
            if [[ "$http" =~ ^2 ]]; then
              echo "  ✅ Confluence page $page_id updated"
            else
              echo "  Confluence PUT $page_id: HTTP $http — $(head -c 200 /tmp/conf_put.json)" >&2
            fi
          }

          conf_append "21135361" "CPD-869 updates" "$(cat <<'WIKI'
          h2. CPD-869 updates (2026-06-14)

          * Review Queue expand: What was ordered vs What was produced
          * createdBy tagging (dashboard / e2e_script / api)
          * staging-assets: orderSource, featureCompliance, wizardConfig
          * Customer status from job_spec; operator_review masked as processing

          See commit 0c7a24b6 on main.
          WIKI
          )"

          conf_append "31883268" "Production job submission policy" "$(cat <<'WIKI'
          h2. Production job submission policy

          * Production + sub-brand jobs: dashboard wizard only (My Jobs → New)
          * E2E scripts: Operate smoke tests only; ALLOW_E2E_JOB_SUBMIT=1 required
          * Review Queue shows amber banner for non-dashboard orders
          WIKI
          )"

          conf_append "22216746" "CPD-1006 sub-brand chrome" "$(cat <<'WIKI'
          h2. CPD-1006 sub-brand chrome

          * brandName baked on job creation; getBrand at chrome time
          * Twitch avatar sync to brands.image_url
          * Dual-logo: sub-brand avatar lower-third + AuraFlux watermark bottom-right
          * Wizard sends brandId + templateName + createdVia:dashboard
          WIKI
          )"

          echo ""
          echo "Done."

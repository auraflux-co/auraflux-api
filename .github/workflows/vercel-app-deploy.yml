name: Deploy auraflux-app (Vercel)

# Production: https://app.auraflux.co (Vercel project auraflux-app)
#
# Use this when auraflux-co/auraflux-api does not appear in Vercel's GitHub
# connect UI — only namespaces granted to the Vercel GitHub App are listed.
#
# GitHub → Settings → Secrets and variables → Actions:
#   VERCEL_TOKEN        — https://vercel.com/account/tokens (do not commit)
#   VERCEL_ORG_ID       — team_Uqf65YPnvqis36qNRfjOqRGr
#   VERCEL_PROJECT_ID   — prj_rxTdLMAjxoioijlN2Ij17Kzokb1T
#
# Manual deploy from repository root (local CLI):
#   vercel --prod --cwd app
# With token-only CI-style env:
#   VERCEL_ORG_ID=team_Uqf65YPnvqis36qNRfjOqRGr \
#   VERCEL_PROJECT_ID=prj_rxTdLMAjxoioijlN2Ij17Kzokb1T \
#   vercel --prod --cwd app --token "$VERCEL_TOKEN"

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - '.github/workflows/vercel-app-deploy.yml'

jobs:
  deploy:
    name: Vercel production (app/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        run: vercel pull --yes --environment=production --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build
        run: vercel build --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to production
        run: vercel deploy --prebuilt --prod --token="${{ secrets.VERCEL_TOKEN }}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summary
        run: echo "Deployed app/ to production — https://app.auraflux.co"

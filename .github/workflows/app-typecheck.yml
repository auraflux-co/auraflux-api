name: App TypeScript check

on:
  pull_request:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/app-typecheck.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

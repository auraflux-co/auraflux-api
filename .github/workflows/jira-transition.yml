name: Jira — Post merge comment (awaiting Rovo review)

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  post-merge-comment:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Extract Jira issue key from branch or PR title
        id: extract
        run: |
          BRANCH="${{ github.event.pull_request.head.ref }}"
          TITLE="${{ github.event.pull_request.title }}"
          KEY=$(echo "$BRANCH" | grep -oiE 'CPD-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]')
          if [ -z "$KEY" ]; then
            KEY=$(echo "$TITLE" | grep -oiE 'CPD-[0-9]+' | head -1 | tr '[:lower:]' '[:upper:]')
          fi
          echo "issue_key=$KEY" >> "$GITHUB_OUTPUT"
          echo "Found Jira key: $KEY"

      - name: Post merge comment — request Rovo review
        if: steps.extract.outputs.issue_key != ''
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          ISSUE_KEY: ${{ steps.extract.outputs.issue_key }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
        run: |
          BASE="${JIRA_BASE_URL%/}"
          # Story stays In Progress — only Rovo's review closes it to Done.
          # Post a comment asking Rovo to review the merged code.
          BODY=$(printf '{
            "body": {
              "type": "doc",
              "version": 1,
              "content": [{
                "type": "paragraph",
                "content": [
                  {"type":"text","text":"✅ PR #%s merged to main by @%s\n"},
                  {"type":"text","text":"%s\n%s\n\n"},
                  {"type":"text","text":"@rovo-dev please review the merged code and confirm it is production-ready. If the implementation looks correct, reply with [rovo-approved] to close this story."}
                ]
              }]
            }
          }' "$PR_NUMBER" "$MERGED_BY" "$PR_TITLE" "$PR_URL")

          HTTP_STATUS=$(curl -s -o /tmp/jira_comment_resp.json -w "%{http_code}" \
            -X POST \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -u "$JIRA_USER_EMAIL:$JIRA_API_TOKEN" \
            "$BASE/rest/api/3/issue/$ISSUE_KEY/comment" \
            -d "$BODY")

          cat /tmp/jira_comment_resp.json
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Merge comment + Rovo review request posted to $ISSUE_KEY"
            echo "   Story remains In Progress until Rovo posts [rovo-approved]"
          else
            echo "⚠️  Comment returned HTTP $HTTP_STATUS"
            exit 1
          fi

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@300;600;700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { width:2560px; height:1440px; background:#060a12; overflow:hidden; font-family:'Barlow Condensed',sans-serif; }

.bg {
  position:absolute; inset:0;
  background:
    radial-gradient(ellipse 100% 70% at 50% 50%, rgba(22,38,65,0.95) 0%, #060a12 70%),
    linear-gradient(135deg, #060a12 0%, #0d1a2e 50%, #060a12 100%);
}

/* Subtle grid */
.grid {
  position:absolute; inset:0;
  background-image:
    linear-gradient(rgba(199,175,79,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(199,175,79,0.03) 1px, transparent 1px);
  background-size:120px 120px;
}

/* Gold border lines */
.border-top    { position:absolute; top:140px;    left:0; right:0; height:2px; background:linear-gradient(90deg,transparent 5%,#c7af4f 20%,#c7af4f 80%,transparent 95%); }
.border-bottom { position:absolute; bottom:140px; left:0; right:0; height:2px; background:linear-gradient(90deg,transparent 5%,#c7af4f 20%,#c7af4f 80%,transparent 95%); }

/* Corner brackets */
.br { position:absolute; width:100px; height:100px; }
.br::before, .br::after { content:''; position:absolute; background:#c7af4f; }
.tl { top:80px; left:80px; }
.tl::before { width:3px; height:70px; top:0; left:0; }
.tl::after  { width:70px; height:3px; top:0; left:0; }
.tr { top:80px; right:80px; }
.tr::before { width:3px; height:70px; top:0; right:0; }
.tr::after  { width:70px; height:3px; top:0; right:0; }
.bl { bottom:80px; left:80px; }
.bl::before { width:3px; height:70px; bottom:0; left:0; }
.bl::after  { width:70px; height:3px; bottom:0; left:0; }
.br2 { bottom:80px; right:80px; }
.br2::before { width:3px; height:70px; bottom:0; right:0; }
.br2::after  { width:70px; height:3px; bottom:0; right:0; }

/* Logo */
.logo-wrap {
  position:absolute;
  left:200px; top:50%;
  transform:translateY(-50%);
  width:520px; height:520px;
  display:flex; align-items:center; justify-content:center;
}
.logo-wrap img {
  width:520px; height:520px;
  object-fit:contain;
  filter:drop-shadow(0 0 40px rgba(199,175,79,0.3));
}

/* Divider */
.divider {
  position:absolute;
  left:820px; top:180px; bottom:180px;
  width:2px;
  background:linear-gradient(180deg,transparent,rgba(199,175,79,0.5) 30%,rgba(199,175,79,0.5) 70%,transparent);
}

/* Text */
.text-area {
  position:absolute;
  left:900px; right:160px; top:50%;
  transform:translateY(-50%);
}
.eyebrow {
  font-size:28px; font-weight:600;
  color:rgba(199,175,79,0.7);
  letter-spacing:12px;
  margin-bottom:20px;
}
.main-word {
  display:block;
  font-family:'Bebas Neue',sans-serif;
  line-height:0.88;
  letter-spacing:6px;
  color:#fff;
  text-shadow:0 0 100px rgba(199,175,79,0.15);
}
.w1 { font-size:280px; }
.w2 { font-size:280px; color:#c7af4f; }
.w3 { font-size:180px; color:rgba(255,255,255,0.9); }
.gold-bar {
  width:100%;
  height:3px;
  background:linear-gradient(90deg,#c7af4f,rgba(199,175,79,0.1));
  margin:28px 0 24px;
}
.tagline {
  font-size:38px;
  font-weight:300;
  color:rgba(255,255,255,0.4);
  letter-spacing:16px;
}

/* Schedule */
.schedule {
  position:absolute;
  bottom:168px; left:900px; right:160px;
  display:flex; align-items:center; gap:50px;
}
.sched-item { display:flex; align-items:center; gap:14px; }
.sched-dot { width:8px; height:8px; border-radius:50%; background:#c7af4f; flex-shrink:0; }
.sched-txt { font-size:26px; font-weight:600; color:rgba(255,255,255,0.4); letter-spacing:4px; }
</style>
</head>

<div class="grid"></div>

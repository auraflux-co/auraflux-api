<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@600;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { background:#060a12; color:#fff; font-family:'Barlow Condensed',Arial,sans-serif; padding:20px; }
.header { background:linear-gradient(90deg,#22304b,#1a2538); border-bottom:3px solid #c7af4f; padding:16px 20px; border-radius:8px 8px 0 0; }
.header h1 { font-family:'Bebas Neue',sans-serif; font-size:24px; color:#c7af4f; letter-spacing:4px; }
.ctrl { background:#0d1524; border:1px solid rgba(199,175,79,0.2); padding:16px 20px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; border-radius:0 0 8px 8px; margin-bottom:20px; }
.ctrl label { font-size:11px; font-weight:700; color:rgba(199,175,79,0.6); letter-spacing:2px; }
.ctrl input { background:#1a2538; border:1px solid rgba(199,175,79,0.3); color:#fff; font-family:monospace; font-size:14px; padding:8px 12px; border-radius:4px; width:180px; }
.ctrl button { background:#c7af4f; color:#060a12; font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:3px; padding:8px 22px; border:none; border-radius:4px; cursor:pointer; }
.ctrl button:hover { background:#f0d060; }
#status { font-size:12px; color:rgba(255,255,255,0.4); font-family:monospace; }
.sec-title { font-family:'Bebas Neue',sans-serif; font-size:16px; color:#c7af4f; letter-spacing:3px; margin:20px 0 8px; }

/* YouTube mockup */
.yt-mockup { background:#0f0f0f; border-radius:8px; padding:20px; margin-bottom:20px; }
.yt-title-preview { font-size:18px; font-weight:700; color:#fff; line-height:1.4; margin-bottom:8px; font-family:Arial,sans-serif; }
.yt-meta { font-size:13px; color:#aaa; margin-bottom:12px; font-family:Arial,sans-serif; }
.yt-desc-preview { font-size:13px; color:#aaa; line-height:1.6; font-family:Arial,sans-serif; white-space:pre-wrap; }
.yt-desc-fold { overflow:hidden; max-height:60px; position:relative; }
.yt-desc-fold::after { content:''; position:absolute; bottom:0; left:0; right:0; height:30px; background:linear-gradient(transparent,#0f0f0f); }
.yt-show-more { color:#fff; font-size:13px; font-weight:700; cursor:pointer; font-family:Arial,sans-serif; margin-top:6px; display:inline-block; }

/* SEO score */
.seo-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:12px; margin-bottom:20px; }
.seo-card { background:#0d1524; border:1px solid rgba(199,175,79,0.15); border-radius:6px; padding:14px; }
.seo-card-title { font-size:10px; font-weight:900; color:rgba(199,175,79,0.6); letter-spacing:2px; margin-bottom:8px; }
.seo-check { display:flex; align-items:center; gap:8px; margin-bottom:6px; font-size:12px; font-family:Arial,sans-serif; }
.check-pass { color:#2ecc71; font-weight:900; }
.check-fail { color:#e74c3c; font-weight:900; }
.check-warn { color:#f39c12; font-weight:900; }

/* Copy */
.copy-box { background:#0d1524; border:1px solid rgba(199,175,79,0.15); border-radius:6px; padding:14px 16px; margin-bottom:14px; }
.copy-lbl { font-size:9px; font-weight:900; color:rgba(199,175,79,0.5); letter-spacing:3px; margin-bottom:6px; }
.copy-txt { font-size:13px; line-height:1.7; color:rgba(255,255,255,0.85); white-space:pre-wrap; font-family:Arial,sans-serif; }
.copy-btn { background:rgba(199,175,79,0.15); border:1px solid rgba(199,175,79,0.3); color:#c7af4f; font-family:'Bebas Neue',sans-serif; font-size:12px; letter-spacing:2px; padding:5px 14px; border-radius:3px; cursor:pointer; margin-top:8px; }
.copy-btn:hover { background:rgba(199,175,79,0.25); }

#results { display:none; }
.char-counter { font-size:11px; font-family:monospace; margin-left:8px; }
.green { color:#2ecc71; }
.red { color:#e74c3c; }
.yellow { color:#f39c12; }
</style>
</head>
<body>

<div class="header">
  <h1>CWN SEO PREVIEW TOOL</h1>
</div>
<div class="ctrl">
  <label>GAME ID</label>
  <input id="gid" type="text" value="401810961">
  <button onclick="load()">PREVIEW SEO</button>
  <span id="status">Enter game ID and preview</span>
</div>

<div id="results">

  <div class="sec-title">YOUTUBE SEARCH PREVIEW</div>
  <div class="yt-mockup">
    <div class="yt-title-preview" id="yt-title-mock">--</div>
    <div class="yt-meta">ClipzWorld News &nbsp;·&nbsp; <span id="yt-views">1.2K views</span> &nbsp;·&nbsp; <span id="yt-date">2 hours ago</span></div>
    <div class="yt-desc-preview yt-desc-fold" id="yt-desc-mock">--</div>
    <span class="yt-show-more" onclick="toggleDesc()">...more</span>
  </div>

  <div class="sec-title">SEO CHECKLIST</div>
  <div class="seo-grid" id="seo-grid"></div>

  <div class="sec-title">TITLE <span class="char-counter" id="title-chars"></span></div>
  <div class="copy-box">
    <div class="copy-lbl">COPY THIS TITLE</div>
    <div class="copy-txt" id="title-out">--</div>
    <button class="copy-btn" onclick="cp('title-out',this)">COPY TITLE</button>
  </div>

  <div class="sec-title">DESCRIPTION + TIMESTAMPS + HASHTAGS</div>
  <div class="copy-box">
    <div class="copy-lbl">COPY FULL DESCRIPTION</div>
    <div class="copy-txt" id="desc-out">--</div>
    <button class="copy-btn" onclick="cp('desc-out',this)">COPY DESCRIPTION</button>
  </div>

</div>

<script>
var SEASON_LEADERS = {
  ATL:{name:'T. Young',ppg:'23.1',rpg:'3.2',apg:'11.4'},BOS:{name:'J. Brown',ppg:'27.2',rpg:'6.8',apg:'3.5'},
  BKN:{name:'C. Thomas',ppg:'21.3',rpg:'3.0',apg:'5.4'},CHA:{name:'L. Ball',ppg:'14.9',rpg:'4.1',apg:'8.0'},
  CHI:{name:'Z. LaVine',ppg:'24.1',rpg:'4.4',apg:'4.2'},CLE:{name:'D. Garland',ppg:'21.7',rpg:'3.0',apg:'7.0'},
  DAL:{name:'K. Irving',ppg:'25.8',rpg:'5.0',apg:'5.2'},DEN:{name:'N. Jokic',ppg:'29.6',rpg:'12.7',apg:'10.2'},
  DET:{name:'C. Cunningham',ppg:'26.0',rpg:'4.4',apg:'9.2'},GSW:{name:'S. Curry',ppg:'24.5',rpg:'4.4',apg:'6.5'},
  HOU:{name:'A. Sengun',ppg:'21.1',rpg:'9.3',apg:'5.0'},IND:{name:'T. Haliburton',ppg:'20.4',rpg:'3.9',apg:'9.2'},
  LAC:{name:'J. Harden',ppg:'20.5',rpg:'5.0',apg:'8.7'},LAL:{name:'L. James',ppg:'23.5',rpg:'8.1',apg:'8.3'},
  MEM:{name:'J. Morant',ppg:'22.8',rpg:'5.3',apg:'8.1'},MIA:{name:'T. Herro',ppg:'24.5',rpg:'5.0',apg:'4.8'},
  MIL:{name:'G. Antetokounmpo',ppg:'32.7',rpg:'11.5',apg:'5.9'},MIN:{name:'A. Edwards',ppg:'27.4',rpg:'5.4',apg:'5.1'},
  NOP:{name:'Z. Williams',ppg:'19.0',rpg:'4.5',apg:'2.8'},NYK:{name:'J. Brunson',ppg:'26.3',rpg:'3.1',apg:'6.7'},
  NY:{name:'J. Brunson',ppg:'26.3',rpg:'3.1',apg:'6.7'},
  OKC:{name:'S. Gilgeous-Alexander',ppg:'32.3',rpg:'5.1',apg:'6.4'},ORL:{name:'P. Banchero',ppg:'25.6',rpg:'7.9',apg:'5.4'},
  PHI:{name:'J. Embiid',ppg:'24.6',rpg:'8.0',apg:'3.1'},PHX:{name:'K. Durant',ppg:'26.8',rpg:'7.3',apg:'4.0'},
  POR:{name:'S. Sharpe',ppg:'20.0',rpg:'5.5',apg:'3.5'},SAC:{name:'D. Fox',ppg:'24.7',rpg:'3.8',apg:'6.2'},
  SAS:{name:'V. Wembanyama',ppg:'24.3',rpg:'10.7',apg:'3.9'},TOR:{name:'I. Quickley',ppg:'18.6',rpg:'3.5',apg:'6.4'},
  UTA:{name:'L. Markkanen',ppg:'23.2',rpg:'8.2',apg:'2.0'},WAS:{name:'K. Kuzma',ppg:'22.5',rpg:'6.5',apg:'3.5'}
};

function g(id){ return document.getElementById(id); }
function cp(id,btn){ var ta=document.createElement('textarea');ta.value=g(id).textContent;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);var o=btn.textContent;btn.textContent='COPIED!';setTimeout(function(){btn.textContent=o;},1500); }
function toggleDesc(){ var el=g('yt-desc-mock'); var folded=el.classList.contains('yt-desc-fold'); el.classList.toggle('yt-desc-fold',!folded); document.querySelector('.yt-show-more').textContent=folded?'Show less':'...more'; }

function fmtTime(str){ var d=new Date(str);var h=d.getHours();var m=d.getMinutes();var ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+(m<10?'0'+m:m)+' '+ap+' ET'; }
function getRecord(arr){ if(!arr||!arr.length)return ''; for(var i=0;i<arr.length;i++){if(arr[i].type==='total')return arr[i].displayValue||arr[i].summary||'';} return arr[0].displayValue||arr[0].summary||''; }

function load(){
  var gameId=g('gid').value.trim();
  if(!gameId)return;
  g('status').textContent='Fetching game '+gameId+'...';
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event='+gameId,true);
  xhr.timeout=10000;
  xhr.onload=function(){
    if(xhr.status!==200){g('status').textContent='Error '+xhr.status;return;}
    try{ render(JSON.parse(xhr.responseText)); }
    catch(e){ g('status').textContent='Parse error: '+e.message; }
  };
  xhr.onerror=xhr.ontimeout=function(){g('status').textContent='Network error';};
  xhr.send();
}

function render(data){
  var hc=data.header&&data.header.competitions&&data.header.competitions[0];
  var comps=(hc&&hc.competitors)||[];
  var away={team:{}},home={team:{}};
  for(var i=0;i<comps.length;i++){if(comps[i].homeAway==='away')away=comps[i];if(comps[i].homeAway==='home')home=comps[i];}
  var awayFull=(away.team&&away.team.displayName)||'Away';
  var homeFull=(home.team&&home.team.displayName)||'Home';
  var awayAbbr=(away.team&&away.team.abbreviation)||'AWY';
  var homeAbbr=(home.team&&home.team.abbreviation)||'HME';
  var awayRec=getRecord(away.record||away.records);
  var homeRec=getRecord(home.record||home.records);
  var awayScore=away.score||'0';
  var homeScore=home.score||'0';
  var dateStr=hc&&hc.date?new Date(hc.date).toLocaleDateString([],{month:'long',day:'numeric',year:'numeric'}):'';
  var timeStr=hc&&hc.date?fmtTime(hc.date):'';
  var gi=data.gameInfo||{};
  var venue=(gi.venue&&gi.venue.fullName)||'';
  var city=(gi.venue&&gi.venue.address&&gi.venue.address.city)||'';
  var isFinal=(hc&&hc.status&&hc.status.type&&hc.status.type.name||'').indexOf('FINAL')>-1;
  var isLive=(hc&&hc.status&&hc.status.type&&hc.status.type.name||'').indexOf('PROGRESS')>-1;

  var injData=data.injuries||[];
  var aOuts=[],hOuts=[];
  injData.forEach(function(t){
    (t.injuries||[]).forEach(function(p){
      if((p.status||'').toLowerCase()==='out'){
        var sn=(p.athlete&&p.athlete.shortName)||'';
        if((t.team&&t.team.abbreviation)===awayAbbr) aOuts.push(sn);
        else hOuts.push(sn);
      }
    });
  });

  var aL=SEASON_LEADERS[awayAbbr];
  var hL=SEASON_LEADERS[homeAbbr];
  var pc=data.pickcenter&&data.pickcenter[0];
  var spread=pc?(pc.details||''):'';
  var ou = pc ? ('O/U ' + (pc.overUnder || '')) : '';
  var ss=data.seasonseries&&data.seasonseries[0];
  var series=(ss&&ss.summary)||'';

  // -- BUILD SEO TITLE -----------------------------------------
  var statusWord = isFinal ? 'FULL GAME HIGHLIGHTS' : isLive ? 'LIVE' : 'LIVE STREAM';
  var title = awayFull + ' vs ' + homeFull + ' | NBA ' + statusWord + ' | ' + dateStr;
  if(isFinal) title = awayFull + ' vs ' + homeFull + ' ' + awayScore + '-' + homeScore + ' | NBA Highlights ' + dateStr;
  if(title.length>100) title=title.slice(0,97)+'...';

  // -- BUILD SEO DESCRIPTION ------------------------------------
  var desc='';
  // LINE 1-2: most important - shown in search results
  if(isFinal){
    desc+=awayFull+' vs '+homeFull+' FINAL: '+awayScore+'-'+homeScore+' | NBA Game Highlights | '+dateStr+'\n';
  } else {
    desc+=awayFull+' ('+awayRec+') vs '+homeFull+' ('+homeRec+') -- NBA Live Coverage | '+dateStr+'\n';
  }
  desc+=(isFinal?'Full game highlights':'Watch live at '+timeStr+' ET')+' | '+venue+(city?' -- '+city:'')+'\n';
  desc+='\n';
  // Player leaders
  if(aL) desc+=awayAbbr+' Season Leader: '+aL.name+' -- '+aL.ppg+' PPG / '+aL.rpg+' RPG / '+aL.apg+' APG\n';
  if(hL) desc+=homeAbbr+' Season Leader: '+hL.name+' -- '+hL.ppg+' PPG / '+hL.rpg+' RPG / '+hL.apg+' APG\n';
  desc+='\n';
  if(aOuts.length) desc+='OUT -- '+awayAbbr+': '+aOuts.join(', ')+'\n';
  if(hOuts.length) desc+='OUT -- '+homeAbbr+': '+hOuts.join(', ')+'\n';
  if(series) desc+='Season Series: '+series+'\n';
  if(spread) desc+='Vegas Line: '+spread+'  '+ou+'\n';
  desc+='\n';
  desc+='ClipzWorld News streams NBA live every night. Subscribe and turn on notifications for live coverage + daily sports news every weekday at noon ET.\n';
  desc+='\n';
  // Timestamps
  desc+='TIMESTAMPS\n';
  desc+='00:00 Pre-game\n';
  desc+='12:00 1st Quarter\n';
  desc+='24:00 Halftime\n';
  desc+='36:00 3rd Quarter\n';
  desc+='48:00 4th Quarter\n';
  desc+='\n';
  // Hashtags - specific first
  var awayTag='#'+awayFull.split(' ').join('');
  var homeTag='#'+homeFull.split(' ').join('');
  desc+=awayTag+' '+homeTag+' #'+awayAbbr+' #'+homeAbbr;
  desc+=' #NBA #NBALive #Basketball #NBAgame #NBAHighlights #ClipzWorldNews #LiveSports #NBAToday';

  // -- DISPLAY --------------------------------------------------
  g('title-out').textContent=title;
  g('desc-out').textContent=desc;
  g('yt-title-mock').textContent=title;
  g('yt-desc-mock').textContent=desc;
  var tLen=title.length;
  g('title-chars').innerHTML='<span class="'+(tLen<=60?'green':tLen<=100?'yellow':'red')+'">'+tLen+' chars '+(tLen<=60?'(ideal)':tLen<=100?'(ok)':'(too long)')+'</span>';

  // -- SEO CHECKS -----------------------------------------------
  var checks=[
    {label:'Title length', pass:tLen<=100, warn:tLen>60&&tLen<=100, msg:tLen+' chars '+(tLen<=60?'-- ideal under 60':'-- ok under 100, shorter is better')},
    {label:'Team names in title', pass:title.indexOf(awayFull)>-1&&title.indexOf(homeFull)>-1, msg:'Both team names present'},
    {label:'Date in title', pass:title.indexOf(dateStr)>-1, msg:'Date helps with search freshness'},
    {label:'Score in title (final)', pass:!isFinal||(title.indexOf(awayScore)>-1||title.indexOf(homeScore)>-1), msg:'Final score in title for completed games'},
    {label:'First line keyword-rich', pass:desc.split('\n')[0].length>30, msg:desc.split('\n')[0].slice(0,60)+'...'},
    {label:'Timestamps included', pass:desc.indexOf('00:00')>-1, msg:'YouTube surfaces timestamped videos higher'},
    {label:'Hashtag count', pass:true, msg:(desc.match(/#\w+/g)||[]).length+' hashtags -- aim for 10-15'},
    {label:'Specific hashtags first', pass:desc.indexOf(awayTag)>-1, msg:'Team-specific tags before broad #NBA'},
    {label:'Channel CTA', pass:desc.indexOf('Subscribe')>-1, msg:'Subscribe call to action included'},
    {label:'Description length', pass:desc.length>300, msg:desc.length+' chars -- YouTube favors 200-500 words'},
  ];

  var grid=g('seo-grid');
  grid.innerHTML='';
  checks.forEach(function(c){
    var icon=c.warn?'WARN':c.pass?'PASS':'FAIL';
    var cls=c.warn?'check-warn':c.pass?'check-pass':'check-fail';
    var card=document.createElement('div');
    card.className='seo-card';
    card.innerHTML='<div class="seo-card-title">'+c.label+'</div>'
      +'<div class="seo-check"><span class="'+cls+'">'+icon+'</span> '+c.msg+'</div>';
    grid.appendChild(card);
  });

  g('status').textContent=awayFull+' vs '+homeFull+' | '+awayScore+'-'+homeScore+(isFinal?' FINAL':isLive?' LIVE':' UPCOMING');
  g('results').style.display='block';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1920px; height:64px; overflow:hidden; background:transparent; font-family:'Arial Black',Arial,sans-serif; -webkit-font-smoothing:antialiased; }

.ticker-wrap {
  width:1920px; height:64px;
  background:#111827;
  border-top:3px solid #c7af4f;
  display:grid;
  grid-template-columns:100px 1fr 100px;
  overflow:hidden;
}

.bookend {
  background:#c7af4f;
  display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  gap:2px; padding:0 8px;
  z-index:10;
}
.b-title { font-size:10px; font-weight:900; color:#111827; letter-spacing:1px; text-align:center; }
.b-sub   { font-size:8px;  font-weight:700; color:#111827; letter-spacing:1px; text-align:center; display:flex; align-items:center; gap:4px; }
.live-dot { width:5px; height:5px; border-radius:50%; background:#c0392b; animation:pulse 1.2s infinite; flex-shrink:0; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

.scroll-outer { overflow:hidden; position:relative; height:64px; }
.scroll-track  { display:flex; align-items:center; white-space:nowrap; height:64px; will-change:transform; }

.tick-item  { display:inline-flex; align-items:center; padding:0 14px; gap:8px; height:64px; border-right:1px solid rgba(255,255,255,0.05); flex-shrink:0; }
.tick-left  { display:flex; flex-direction:column; gap:1px; }
.tick-sym   { font-size:11px; font-weight:900; color:#fff; letter-spacing:1px; }
.tick-name  { font-size:7px;  color:rgba(255,255,255,0.3); letter-spacing:1px; }
.tick-right { display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
.tick-price { font-size:14px; font-weight:900; color:#fff; font-family:Arial,sans-serif; }
.tick-chg   { font-size:9px;  font-weight:700; font-family:Arial,sans-serif; padding:1px 4px; border-radius:2px; }
.up   { color:#2ecc71; background:rgba(46,204,113,0.15); }
.down { color:#e74c3c; background:rgba(231,76,60,0.15); }
.flat { color:rgba(255,255,255,0.35); background:transparent; }

.tick-cat { display:inline-flex; align-items:center; justify-content:center; padding:0 10px; height:64px; background:rgba(199,175,79,0.08); border-left:2px solid rgba(199,175,79,0.5); border-right:2px solid rgba(199,175,79,0.5); flex-shrink:0; }
.tick-cat-lbl { font-size:7px; font-weight:900; color:#c7af4f; letter-spacing:3px; }
</style>
</head>
<body>
<div class="ticker-wrap">

  <div class="bookend">
    <div class="b-title">CLIPZWORLD</div>
    <div class="b-sub"><div class="live-dot"></div>MARKETS</div>
  </div>

  <div class="scroll-outer">
    <div class="scroll-track" id="track">
      <div class="tick-item"><div class="tick-left"><div class="tick-sym">—</div></div><div class="tick-right"><div class="tick-price">Loading...</div></div></div>
    </div>
  </div>

  <div class="bookend">
    <div class="b-title">CLIPZWORLD</div>
    <div class="b-sub">LIVE MARKETS</div>
  </div>

</div>
<script>
var FMP = 'rJPVYlHnpcjxuOLoR1phvBz7e27UMMSq';
var trackEl = document.getElementById('track');
var scrollX = 0, animId;

// Fallback closing data - update daily
var DATA = {
  indices: {
    SPY: { price:6528.65, change:184.93, pct:2.92 },
    QQQ: { price:21590.63, change:795.99, pct:3.83 },
    DIA: { price:46341.32, change:1125.17, pct:2.49 },
    IWM: { price:2496.37, change:92.37, pct:3.41 }
  },
  stocks: {
    AAPL:  { name:'Apple',     price:253.79, pct:2.99 },
    NVDA:  { name:'Nvidia',    price:174.44, pct:5.62 },
    TSLA:  { name:'Tesla',     price:371.80, pct:4.65 },
    AMZN:  { name:'Amazon',    price:208.27, pct:3.64 },
    META:  { name:'Meta',      price:572.13, pct:6.67 },
    GOOGL: { name:'Alphabet',  price:287.56, pct:null },
    MSFT:  { name:'Microsoft', price:null,   pct:null },
    NFLX:  { name:'Netflix',   price:null,   pct:null }
  },
  crypto: {},
  forex: {}
};

function fmtP(p) {
  var v=parseFloat(p); if(!v||isNaN(v)) return '—';
  if(v>=10000) return '$'+v.toFixed(0).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  if(v>=1000)  return '$'+v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g,',');
  if(v>=10)    return '$'+v.toFixed(2);
  return '$'+v.toFixed(4);
}
function fmtPct(pct) {
  var p=parseFloat(pct); if(isNaN(p)) return {t:'',c:'flat'};
  return {t:(p>=0?'+':'')+p.toFixed(2)+'%', c:p>0?'up':p<0?'down':'flat'};
}
function mkItem(sym,name,price,pct) {
  var ch=fmtPct(pct);
  return '<div class="tick-item">'
    +'<div class="tick-left"><div class="tick-sym">'+sym+'</div>'+(name?'<div class="tick-name">'+name+'</div>':'')+'</div>'
    +'<div class="tick-right"><div class="tick-price">'+fmtP(price)+'</div>'
    +'<div class="tick-chg '+ch.c+'">'+ch.t+'</div></div></div>';
}
function mkCat(lbl) {
  return '<div class="tick-cat"><div class="tick-cat-lbl">'+lbl+'</div></div>';
}

function buildTicker() {
  var html=''; var hasData=false;

  var idxOrder=[{k:'SPY',n:'S&P 500'},{k:'QQQ',n:'NASDAQ'},{k:'DIA',n:'DOW'},{k:'IWM',n:'RUSSELL'}];
  var ih=''; idxOrder.forEach(function(i){ var q=DATA.indices[i.k]; if(q&&q.price){ih+=mkItem(i.n,'',q.price,q.pct);hasData=true;} });
  if(ih) html+=mkCat('INDICES')+ih;

  var stkOrder=['AAPL','NVDA','TSLA','AMZN','META','GOOGL','MSFT','NFLX'];
  var sh=''; stkOrder.forEach(function(s){ var q=DATA.stocks[s]; if(q&&q.price){
    sh+=mkItem(s,q.name,q.price,q.pct);hasData=true;
  }});
  if(sh) html+=mkCat('STOCKS')+sh;

  var cryOrder=[{k:'BTC',n:'Bitcoin'},{k:'ETH',n:'Ethereum'},{k:'SOL',n:'Solana'}];
  var ch=''; cryOrder.forEach(function(c){ var q=DATA.crypto[c.k]; if(q&&q.price){ch+=mkItem(c.k,c.n,q.price,q.pct);hasData=true;} });
  if(ch) html+=mkCat('CRYPTO')+ch;

  var fxOrder=['EURUSD','USDJPY','GBPUSD','USDCAD'];
  var fh=''; fxOrder.forEach(function(f){ var q=DATA.forex[f]; if(q){fh+=mkItem(q.pair,'',q.rate,null);hasData=true;} });
  if(fh) html+=mkCat('FOREX')+fh;

  if(!hasData) return;
  trackEl.innerHTML=html+html;
  if(!animId) startScroll();
}

function startScroll() {
  cancelAnimationFrame(animId);
  scrollX=0;
  function step(){
    var hw=trackEl.scrollWidth/2;
    scrollX+=1.2; if(scrollX>=hw) scrollX=0;
    trackEl.style.transform='translateX(-'+scrollX+'px)';
    animId=requestAnimationFrame(step);
  }
  animId=requestAnimationFrame(step);
}

function fetchIndices() {
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://financialmodelingprep.com/stable/quote?apikey='+FMP+'&symbol=^GSPC,^IXIC,^DJI,^RUT',true);
  xhr.timeout=10000;
  xhr.onload=function(){
    try{
      var arr=JSON.parse(xhr.responseText);
      if(!Array.isArray(arr)||!arr.length) return;
      var map={'^GSPC':'SPY','^IXIC':'QQQ','^DJI':'DIA','^RUT':'IWM'};
      arr.forEach(function(q){ var k=map[q.symbol]; if(k&&q.price) DATA.indices[k]={price:q.price,change:q.change,pct:q.changePercentage}; });
      buildTicker();
    }catch(e){}
  };
  xhr.send();
}
function fetchStocks() {
  ['AAPL','NVDA','TSLA','AMZN','META','GOOGL'].forEach(function(sym,i){
    setTimeout(function(){
      var xhr=new XMLHttpRequest();
      xhr.open('GET','https://financialmodelingprep.com/stable/quote?apikey='+FMP+'&symbol='+sym,true);
      xhr.timeout=8000;
      xhr.onload=function(){
        try{
          var arr=JSON.parse(xhr.responseText);
          if(arr&&arr[0]&&arr[0].price){
            DATA.stocks[sym]={name:DATA.stocks[sym]&&DATA.stocks[sym].name||sym,price:arr[0].price,change:arr[0].change,pct:arr[0].changePercentage};
            buildTicker();
          }
        }catch(e){}
      };
      xhr.send();
    },i*500);
  });
}
function fetchCrypto() {
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://api.coingecko.com/api/v3/simple/price?ids=bitcoin,ethereum,solana&vs_currencies=usd&include_24hr_change=true',true);
  xhr.timeout=8000;
  xhr.onload=function(){
    try{
      var d=JSON.parse(xhr.responseText);
      DATA.crypto={BTC:{price:d.bitcoin.usd,pct:d.bitcoin.usd_24h_change},ETH:{price:d.ethereum.usd,pct:d.ethereum.usd_24h_change},SOL:{price:d.solana.usd,pct:d.solana.usd_24h_change}};
      buildTicker();
    }catch(e){}
  };
  xhr.send();
}
function fetchForex() {
  var xhr=new XMLHttpRequest();
  xhr.open('GET','https://api.frankfurter.app/latest?from=USD&to=EUR,GBP,JPY,CAD',true);
  xhr.timeout=8000;
  xhr.onload=function(){
    try{
      var d=JSON.parse(xhr.responseText); var r=d.rates||{};
      DATA.forex={EURUSD:{pair:'EUR/USD',rate:(1/r.EUR).toFixed(4)},USDJPY:{pair:'USD/JPY',rate:r.JPY.toFixed(2)},GBPUSD:{pair:'GBP/USD',rate:(1/r.GBP).toFixed(4)},USDCAD:{pair:'USD/CAD',rate:r.CAD.toFixed(4)}};
      buildTicker();
    }catch(e){}
  };
  xhr.send();
}

// Start immediately with fallback data
buildTicker();

// Then fetch live updates
fetchCrypto();
setTimeout(fetchForex,   2000);
setTimeout(fetchIndices, 4000);
setTimeout(fetchStocks,  6000);

setInterval(fetchCrypto,   30000);
setInterval(fetchForex,    60000);
setInterval(fetchIndices, 120000);
setInterval(fetchStocks,  120000);
</script>
</body>
</html>

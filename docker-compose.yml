version: "3.9"

# CWN Production — local dev compose
# Usage:
#   docker compose up          → starts server + poller-builder
#   docker compose up --build  → rebuild after Dockerfile changes
#   docker compose down        → stop and remove containers
#
# The server runs nodemon in dev mode so code edits reload without rebuild.
# output/, tmp/, logs/, and data/ are bind-mounted so assets persist on host.

services:
  # ── Main CWN API server ───────────────────────────────────────────────────
  server:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: cwn-server:local
    container_name: cwn-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
      PORT: 3000
      # Docker poller: server spawns cwn-poller container via Docker socket
      # Set USE_DOCKER_POLLER=1 to activate (requires /var/run/docker.sock mount)
      USE_DOCKER_POLLER: "${USE_DOCKER_POLLER:-0}"
      # Allow requests from dashboard static server and localhost
      ALLOWED_ORIGINS: "http://localhost:8765,http://localhost:3000"
      # New Relic APM (optional — agent only loads when key is set)
      NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY:-}"
      NEW_RELIC_APP_NAME: "${NEW_RELIC_APP_NAME:-CWN Production}"
      # Puppeteer uses system Chromium baked into the image
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium"
    volumes:
      # Source code — live reload via nodemon
      - .:/app
      # Exclude host node_modules (image has its own build)
      - /app/node_modules
      # Runtime state — persist on host between restarts
      - ./output:/app/output
      - ./tmp:/app/tmp
      - ./logs:/app/logs
      - ./data:/app/data
      # Docker socket — needed only when USE_DOCKER_POLLER=1
      # (lets server spawn cwn-poller containers)
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "node", "-e",
        "require('http').get('http://localhost:3000/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    # nodemon for live reload in dev (override CMD from Dockerfile)
    command: ["./node_modules/.bin/nodemon", "server.js"]

  # ── Dashboard static file server ─────────────────────────────────────────
  # Lightweight Python server for cwn_production.html
  # Access at http://localhost:8765
  dashboard:
    image: python:3.12-slim
    container_name: cwn-dashboard
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      - .:/app:ro
    working_dir: /app
    command: ["python3", "-m", "http.server", "8765"]
    depends_on:
      - server

  # ── HeyGen Poller image (pre-built, used by server on demand) ────────────
  # This service exists only to ensure the cwn-poller image is built.
  # The server spawns actual poller containers at runtime (not via compose).
  poller-builder:
    build:
      context: .
      dockerfile: Dockerfile.poller
    image: cwn-poller:local
    # Never start automatically — image-build target only
    profiles:
      - build-only
